<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MVMT Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">

<style>
:root{
  /* ======================= Clay Soft =======================
     The theme layer. Every colour the page uses is declared here and nowhere
     else, so the next theme change is a rewrite of this block rather than a
     sweep through the stylesheet. The one other place literals appear is the
     :root override inside @media print, which re-points the same tokens at
     flat white — see the print block at the bottom. */

  /* ---- chrome. Light now, which is why the bar controls below are rebuilt
          rather than retinted: they were drawn for a dark bar. ---- */
  --chrome:      #FFFDFB;
  --chrome-fg:   #33241C;
  --chrome-dim:  #8E7867;
  --chrome-btn:  #E7DCD1;

  --accent:      #C25A2C;
  --accent-fg:   #FFFFFF;
  --accent-dk:   #A84A22;
  /* The accent at wash strength — selected rows, prescriptions, safety
     callouts. Goes to white in print, where the borders carry the work. */
  --accent-wash: #FBF1EA;

  --bg:          #F5EFE8;
  --panel:       #FFFFFF;
  --panel-2:     #FAF5EF;   /* group headers, notes block */
  --hover:       #FCF9F5;   /* row hover — deliberately lighter than panel-2,
                               which rows sit under */

  --ink:         #2E211A;
  --ink-2:       #63513F;
  /* Carries "What it's for:" on the printed handout, read by patients who are
     often in pain, sometimes older, and rarely in good light. It was 3.09:1 at
     its worst ground — enough to survive a glance in good conditions and not
     enough for those. This is the least-shifted value that clears 4.5:1 against
     every ground it sits on: panel, panel-2, accent-wash and hover. Darkening
     it compresses the third step of the ink ramp from 21.8 to 11.1 L*, which
     is a real cost and the right one to pay. */
  --ink-3:       #7E6C5E;
  --ink-soft:    #45332A;   /* hover for ink-filled controls */

  --line:        #EDE4D9;   /* inputs, and the structure print depends on */
  --line-2:      #F5EEE6;   /* row separators */

  /* Destructive and warning states. These used to read off --r-lumbar, which
     is a green in this palette — a green Delete is not a warning. */
  --danger:      #9E2B2B;
  --warn:        #9A6B12;

  /* Region accents — a full hue spread, muted to sit on warm paper. All eight
     are deliberately less saturated than --accent so the accent stays the only
     bright warm element and never reads as a ninth region. Colour-coding is a
     scanning aid across 281 entries: these have to stay distinct from each
     other, so check them side by side in the legend before changing any. */
  --r-cervical:    #9C4A63;
  --r-shoulder:    #A66A2E;
  --r-thoracic:    #7D7A38;
  --r-lumbar:      #4A7A57;
  --r-hip:         #2E7181;
  --r-knee:        #3A5E90;
  --r-elbow-wrist: #6A5A94;
  --r-ankle-foot:  #7A5240;

  /* Phase level, on the phase tabs. These were aliased onto three region
     tokens, which in this palette lands on teal / green / olive — three
     unrelated cool hues rather than a ramp. Explicit now, and ordered cool to
     warm so the progression says something. */
  --level-1: #2E7181;
  --level-2: #A66A2E;
  --level-3: #9C4A63;

  --radius-sm: 6px;    /* tags */
  --radius:    12px;   /* inputs, buttons */
  --radius-lg: 16px;   /* panels, cards */
  --pad:       18px;
  --gap:       20px;
  --shadow:    0 1px 2px rgba(60,40,25,.05), 0 6px 18px rgba(60,40,25,.06);
  --shadow-lg: 0 18px 50px rgba(60,40,25,.22);
  --scrim:     rgba(46,33,26,.5);

  /* Fraunces is reserved for the brand mark, the handout's patient name and
     the exercise numbers. Everything else is DM Sans. */
  --font-display: "Fraunces", Georgia, serif;
  --font-body:    "DM Sans", system-ui, sans-serif;
  --font-ui:      "DM Sans", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- scoreboard label ---------- */
.lbl{
  font-family:var(--font-ui);
  text-transform:uppercase;
  letter-spacing:.08em;
  font-weight:600;
  font-size:11px;
  color:var(--ink-3);
}

/* ---------- top bar ---------- */
/* The bar is light now. Everything in here previously assumed a dark ground —
   white text and rgba(255,255,255,…) borders — which is invisible on #FFFDFB,
   so the controls are rebuilt on the chrome tokens rather than retinted. The
   bar is separated from the page by a rule, not a shadow. */
.topbar{
  background:var(--chrome);
  color:var(--chrome-fg);
  padding:14px 22px;
  display:flex;
  align-items:center;
  gap:22px;
  flex-wrap:wrap;
  position:sticky;top:0;z-index:50;
  border-bottom:1px solid var(--line-2);
}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand b{
  font-family:var(--font-display);
  text-transform:uppercase;
  letter-spacing:.06em;
  font-size:17px;
  font-weight:700;
}
.brand span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--chrome-dim);font-family:var(--font-ui);font-weight:500}
.who{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.who input{
  background:var(--panel);
  border:1px solid var(--chrome-btn);
  border-radius:var(--radius);padding:7px 10px;color:var(--ink);width:150px;font-size:13px;
}
.who input::placeholder{color:var(--ink-3)}
/* The bar carries identity fields, a three-way view switch and six buttons.
   On a narrow screen that is more than one line's worth, so it wraps rather
   than running off the edge. */
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{
  background:transparent;border:1px solid var(--chrome-btn);color:var(--chrome-fg);
  padding:7px 14px;border-radius:var(--radius);
  font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:600;
}
.btn:hover{background:var(--panel-2)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.solid:hover{background:var(--accent-dk);border-color:var(--accent-dk)}

/* view switch */
.switch{display:flex;border:1px solid var(--chrome-btn);border-radius:var(--radius);overflow:hidden}
.switch button{
  background:transparent;border:0;color:var(--chrome-dim);padding:7px 15px;
  font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:600;
}
.switch button[aria-pressed="true"]{background:var(--chrome-btn);color:var(--chrome-fg)}

/* ---------- court strip (signature) ---------- */
.court{
  background:var(--panel);border-bottom:1px solid var(--line-2);
  padding:0 22px;
}
.court-inner{max-width:1500px;margin:0 auto;display:flex;align-items:stretch;gap:0;overflow-x:auto}
.blocktab{
  border:0;background:transparent;
  padding:14px 20px 12px;
  border-bottom:3px solid transparent;
  border-right:1px solid var(--line-2);
  text-align:left;min-width:168px;flex:1;
  display:flex;flex-direction:column;gap:3px;
}
.blocktab:hover{background:var(--hover)}
.blocktab[aria-selected="true"]{border-bottom-color:var(--accent);background:var(--accent-wash)}
.blocktab .st{
  font-family:var(--font-ui);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
}
.blocktab .nm{font-family:var(--font-ui);font-weight:700;font-size:15px;letter-spacing:.02em;color:var(--ink)}
.blocktab .wk{font-size:11px;color:var(--ink-3)}
.blocktab .ct{
  font-family:var(--font-ui);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-2);font-weight:600;margin-top:2px;
}
.st1{color:var(--level-1)} .st2{color:var(--level-2)} .st3{color:var(--level-3)}

/* ---------- layout ---------- */
.wrap{max-width:1500px;margin:0 auto;padding:22px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);align-items:start}
@media(max-width:1080px){.cols{grid-template-columns:1fr}}
/* Phone and small tablet. The theme's padding is generous, which is right on a
   desktop panel and too much once the panel is the whole screen. */
@media(max-width:860px){
  .topbar{padding:12px 14px;gap:12px;position:static}
  .who{margin-left:0;width:100%}
  .who input{flex:1 1 140px;width:auto;min-width:0}
  .acts{width:100%}
  .wrap{padding:14px}
  .court{padding:0 14px}
  .legend{padding:12px 14px}
  .sheet-hd{padding:22px 20px 18px}
  .sheet-sec{padding:20px 20px 0}
  .callout{margin:18px 20px 0}
  .sheet-foot{padding:18px 20px 0}
}

/* Structure comes from elevation rather than an outline. overflow:hidden is
   what keeps the scrolling lists from squaring off the bottom corners; the
   sticky group headers inside .lib are unaffected, since .lib is their own
   scroll container. Print puts the borders back — see the print block. */
.panel{background:var(--panel);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden}
.panel-hd{
  padding:14px var(--pad);border-bottom:1px solid var(--line-2);
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
}
.panel-hd h2{
  margin:0;font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.08em;
  font-size:13px;font-weight:700;
}
.panel-hd .count{margin-left:auto;font-family:var(--font-ui);font-size:11px;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase;font-weight:600}

/* ---------- filters ---------- */
.filters{padding:12px var(--pad);border-bottom:1px solid var(--line-2);display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.fgroup{display:flex;flex-direction:column;gap:5px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 11px;
  font-family:var(--font-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--ink-2);
}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.search{border:1px solid var(--line);border-radius:var(--radius);padding:7px 10px;min-width:180px;flex:1}

/* ---------- library list ---------- */
.lib{max-height:calc(100vh - 300px);overflow-y:auto}
.grp{padding:11px var(--pad) 5px;background:var(--panel-2);border-bottom:1px solid var(--line-2);position:sticky;top:0;z-index:2}
.grp .lbl{color:var(--ink-2)}
.ex{
  display:flex;gap:12px;padding:11px var(--pad);border-bottom:1px solid var(--line-2);
  border-left:3px solid transparent;
}
.ex:hover{background:var(--hover)}
.ex.cervical{border-left-color:var(--r-cervical)}
.ex.shoulder{border-left-color:var(--r-shoulder)}
.ex.elbow-wrist{border-left-color:var(--r-elbow-wrist)}
.ex.thoracic{border-left-color:var(--r-thoracic)}
.ex.lumbar{border-left-color:var(--r-lumbar)}
.ex.hip{border-left-color:var(--r-hip)}
.ex.knee{border-left-color:var(--r-knee)}
.ex.ankle-foot{border-left-color:var(--r-ankle-foot)}
.ex.on{background:var(--accent-wash)}
.ex input[type=checkbox]{
  margin-top:4px;width:16px;height:16px;accent-color:var(--accent);
  border-radius:calc(var(--radius)/2);flex:0 0 auto;
}
.ex-body{flex:1;min-width:0}
.ex-hd{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.ex-nm{font-weight:600;font-size:14.5px}
.tag{
  font-family:var(--font-ui);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  padding:2px 6px;border-radius:var(--radius-sm);background:var(--line-2);color:var(--ink-2);white-space:nowrap;
}
.tag.stage{background:var(--ink);color:var(--panel)}
/* User-authored entries are flagged wherever they appear, so nobody has to
   wonder whether a line came from the shipped library or from their own hand. */
.tag.custom{background:var(--accent-dk);color:var(--accent-fg)}
.ex-acts{margin-left:auto;display:flex;gap:2px}
.ex-acts button{
  border:0;background:transparent;color:var(--ink-3);
  font-family:var(--font-ui);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:3px 5px;
}
.ex-acts button:hover{color:var(--ink)}
.ex-acts button.danger:hover{color:var(--danger)}
.ex-d{font-size:13px;color:var(--ink-2);margin-top:3px}
.ex-t{font-size:12.5px;color:var(--ink-3);margin-top:3px;font-style:italic}

/* ---------- assigned list ---------- */
.asg{max-height:calc(100vh - 300px);overflow-y:auto}
.acard{padding:13px var(--pad);border-bottom:1px solid var(--line-2);border-left:3px solid transparent}
.acard.cervical{border-left-color:var(--r-cervical)}
.acard.shoulder{border-left-color:var(--r-shoulder)}
.acard.elbow-wrist{border-left-color:var(--r-elbow-wrist)}
.acard.thoracic{border-left-color:var(--r-thoracic)}
.acard.lumbar{border-left-color:var(--r-lumbar)}
.acard.hip{border-left-color:var(--r-hip)}
.acard.knee{border-left-color:var(--r-knee)}
.acard.ankle-foot{border-left-color:var(--r-ankle-foot)}
.acard-hd{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.acard-hd .num{
  font-family:var(--font-display);font-weight:700;color:var(--ink-3);font-size:13px;
  min-width:20px;font-variant-numeric:tabular-nums;
}
.rx{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.rx label{display:flex;flex-direction:column;gap:3px}
.rx input{border:1px solid var(--line);border-radius:var(--radius);padding:5px 8px;font-size:13px;width:88px}
.rx input.wide{width:100%}
.rx .grow{flex:1;min-width:190px}
.rm{
  margin-left:auto;border:0;background:transparent;color:var(--ink-3);
  font-family:var(--font-ui);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:3px 5px;
}
.rm:hover{color:var(--danger)}
.empty{padding:40px 22px;text-align:center;color:var(--ink-3);font-size:14px}
.empty b{display:block;font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin-bottom:6px;font-size:12px}

/* notes */
.notes{padding:15px var(--pad);border-top:1px solid var(--line-2);background:var(--panel-2)}
.notes label{display:block;margin-bottom:13px}
.notes textarea{
  width:100%;border:1px solid var(--line);border-radius:var(--radius);padding:9px 10px;
  min-height:66px;resize:vertical;font-size:13.5px;line-height:1.5;margin-top:5px;
}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:3px}

/* block meta editing */
.bmeta{padding:13px var(--pad);border-bottom:1px solid var(--line-2);display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.bmeta label{display:flex;flex-direction:column;gap:4px}
.bmeta input{border:1px solid var(--line);border-radius:var(--radius);padding:6px 9px;font-size:13px}
.bmeta input.nm{width:180px;font-weight:600}
.bmeta input.wk{width:130px}
.bmeta select{border:1px solid var(--line);border-radius:var(--radius);padding:6px 9px;font-size:13px}

/* ---------- patient handout ---------- */
.sheet{
  background:var(--panel);border-radius:var(--radius-lg);box-shadow:var(--shadow);
  max-width:900px;margin:0 auto;padding:0 0 40px;
}
.sheet-hd{padding:30px 40px 22px;border-bottom:4px solid var(--ink)}
.sheet-hd .eyebrow{font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:700;color:var(--ink-3)}
.sheet-hd h1{
  margin:6px 0 0;font-family:var(--font-display);font-size:26px;line-height:1.15;
  text-transform:uppercase;letter-spacing:.01em;font-weight:700;
}
.sheet-meta{display:flex;gap:32px;flex-wrap:wrap;margin-top:16px}
.sheet-meta div{display:flex;flex-direction:column;gap:2px}
.sheet-meta strong{font-size:15px;font-weight:600}
.sheet-sec{padding:26px 40px 0}
.sheet-sec h3{
  font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:700;
  color:var(--ink);margin:0 0 4px;padding-bottom:7px;border-bottom:1px solid var(--line);
}
/* Daily modifications body — matches the exercise description type, but sits
   directly under the part heading rather than inside a numbered row. */
.sheet-sec .modtext{padding:15px 0;font-size:14px;color:var(--ink-2)}
.sheet-sec .modtext p{margin:0 0 9px}
.sheet-sec .modtext p:last-child{margin:0}
.pex{padding:15px 0;border-bottom:1px solid var(--line-2);display:flex;gap:15px}
.pex .pnum{
  font-family:var(--font-display);font-weight:700;font-size:19px;color:var(--ink-3);
  min-width:28px;font-variant-numeric:tabular-nums;line-height:1.2;
}
.pex h4{margin:0;font-size:16px;font-weight:600}
.pex .pd{font-size:14px;color:var(--ink-2);margin-top:5px}
.pex .pt{font-size:13px;color:var(--ink-3);font-style:italic;margin-top:5px}
.pex .prx{
  margin-top:8px;display:inline-block;background:var(--accent-wash);border-left:3px solid var(--accent);
  padding:6px 11px;font-size:13.5px;font-weight:600;
}
.pex .pn{font-size:13.5px;margin-top:7px;padding-left:11px;border-left:2px solid var(--line)}
/* Callouts keep a real border rather than elevation: they sit inside the sheet,
   and a raised box on a piece of paper reads as a mistake. It is also what
   survives into print, where the wash goes white. */
.callout{
  margin:22px 40px 0;background:var(--panel-2);border:1px solid var(--line);border-left:4px solid var(--accent);
  padding:16px 20px;font-size:14px;border-radius:var(--radius);
}
/* The two forced safety callouts, told apart from the therapist's note and the
   closing guidance by weight of rule and by the accent wash — not by colour
   alone, so the distinction survives a mono printer. */
.callout.safety{background:var(--accent-wash);border-left-width:6px}
.callout .lbl{display:block;margin-bottom:6px}
.callout p{margin:0 0 8px}
.callout p:last-child{margin:0}
.callout ul{margin:0;padding-left:19px}
.callout li{margin:0 0 5px}
.callout li:last-child{margin:0}
.sheet-foot{padding:24px 40px 0;margin-top:24px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}

.legend{display:flex;gap:18px;flex-wrap:wrap;padding:12px 22px;max-width:1500px;margin:0 auto;font-size:12px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--panel);padding:11px 20px;border-radius:var(--radius);font-size:13.5px;
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:200;
}
.toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- print ---------- */
/* Shadows do not print, and this theme took the panel borders away in exchange
   for them. Everything that was relying on elevation for its edges gets a real
   rule back here, and the tinted grounds are flattened to white so nothing
   lands as a grey block on a mono clinic printer. */
@media print{
  @page{margin:14mm}
  /* The theme re-pointed at paper. Keeping the literals inside a :root block
     means print is still a token swap, not a set of overrides scattered
     through the rules below. */
  :root{
    --bg:#FFFFFF;
    --panel:#FFFFFF;
    --panel-2:#FFFFFF;
    --hover:#FFFFFF;
    --accent-wash:#FFFFFF;
    --shadow:none;
    --shadow-lg:none;
  }
  body{background:var(--panel)}
  .topbar,.court,.legend,.no-print{display:none!important}
  .wrap{padding:0;max-width:none}
  /* The sheet is the page here, so it keeps no edge of its own — the margin
     box is its border. Only the elements inside it need their rules restored. */
  .sheet{border:0;box-shadow:none;border-radius:0;max-width:none;padding:0}
  .sheet-hd{padding:0 0 18px}
  .sheet-sec{padding:20px 0 0;break-inside:auto}
  /* With the wash gone these carry their definition entirely on the border, so
     it is stated rather than inherited. Square corners: a 16px radius on a
     hairline prints as four broken corners on some drivers. */
  .callout{
    margin:18px 0 0;break-inside:avoid;border-radius:0;
    border:1px solid var(--line);border-left:4px solid var(--accent);
  }
  .callout.safety{border-left-width:6px}
  .pex .prx{border-left:3px solid var(--accent)}
  .sheet-foot{padding:18px 0 0}
  .pex{break-inside:avoid}
  .sheet-sec .modtext{break-inside:avoid}
  /* Practitioner view: these lost their outline to --shadow on screen and would
     otherwise print as unbordered text floating on the page. */
  .panel{border:1px solid var(--line);box-shadow:none;border-radius:0}
  .lib,.asg{max-height:none;overflow:visible}
  .ex-acts{display:none}
  .acard{break-inside:avoid}
}

/* ---------- saved indicator ---------- */
.saved{
  font-family:var(--font-ui);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--chrome-dim);font-weight:600;white-space:nowrap;
}
.saved.warn{color:var(--warn)}

/* ---------- add phase ---------- */
.addphase{
  border:0;background:transparent;color:var(--ink-3);padding:14px var(--pad);white-space:nowrap;
  font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:700;
}
.addphase:hover{color:var(--ink);background:var(--hover)}

/* ---------- small controls ---------- */
.pctl{display:flex;gap:6px;margin-left:auto;align-items:center}
.pbtn{
  border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:5px 9px;color:var(--ink-2);
  font-family:var(--font-ui);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
}
.pbtn:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.pbtn:disabled{opacity:.35;cursor:not-allowed}
.pbtn.danger:hover:not(:disabled){border-color:var(--danger);color:var(--danger)}

/* ---------- level hint ---------- */
.hintbar{
  padding:9px var(--pad);background:var(--accent-wash);border-bottom:1px solid var(--line-2);
  font-size:12.5px;color:var(--ink-2);display:flex;gap:10px;align-items:center;flex-wrap:wrap;
}
.hintbar button{border:0;background:transparent;color:var(--ink);font-weight:600;text-decoration:underline;font-size:12.5px;padding:0}

/* ---------- saved programs list ---------- */
.prow{display:flex;gap:14px;align-items:center;padding:13px var(--pad);border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.prow:hover{background:var(--hover)}
.prow .pnm{font-weight:600;font-size:15px;min-width:150px}
.prow .pnm .anon{color:var(--ink-3);font-weight:400;font-style:italic}
.prow .pmeta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.prow .pacts{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap}

/* ---------- modal ---------- */
.modal{
  position:fixed;inset:0;background:var(--scrim);z-index:300;
  display:flex;align-items:flex-start;justify-content:center;padding:6vh 18px;overflow-y:auto;
}
.modal[hidden]{display:none}
.modal-box{background:var(--panel);border-radius:var(--radius-lg);width:100%;max-width:520px;box-shadow:var(--shadow-lg)}
.modal-hd{padding:18px 22px 0;font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.08em;font-size:13px;font-weight:700}
.modal-body{padding:16px 22px}
.modal-body label{display:block;margin-bottom:13px}
.modal-body input,.modal-body select{
  width:100%;border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;font-size:14px;margin-top:5px;background:var(--panel);
}
.modal-body textarea{
  width:100%;border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;font-size:14px;margin-top:5px;
  background:var(--panel);min-height:74px;resize:vertical;line-height:1.5;
}
.modal-body p{font-size:13.5px;color:var(--ink-2);margin:0 0 13px}
.modal-body .fhint{display:block;font-size:11.5px;color:var(--ink-3);margin-top:4px}
.modal-body .ferr{color:var(--danger);font-weight:600}
.modal-body .ferr[hidden]{display:none}
.modal-foot{padding:0 22px 20px;display:flex;gap:9px;justify-content:flex-end}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.btn.dark:hover{background:var(--ink-soft);border-color:var(--ink-soft)}
.btn.ghost{border-color:var(--line);color:var(--ink-2)}
.btn.ghost:hover{background:var(--line-2)}
.rx select{border:1px solid var(--line);border-radius:var(--radius);padding:5px 8px;font-size:13px;width:112px;background:var(--panel)}
</style>
</head>

<div class="topbar no-print">

    <b>MVMT Program</b>
    <span>Homecare &amp; Treatment Plan Builder</span>

    <button class="btn" id="bOpen" title="Load a .json program file you saved earlier">Open file</button>
    <button class="btn" id="bBackup" title="Saves this program as a .json data file — not a handout">Save file (.json)</button>
    <button class="btn solid" id="bPrint" title="Makes the printable handout PDF">Print / Save as PDF</button>
    <input type="file" id="fFile" accept=".json,application/json" style="display:none">
  </div>
</div>

<div class="court no-print" id="courtWrap"><div class="court-inner" id="tabs" role="tablist"></div></div>

<div class="legend no-print" id="legend"></div>

<div class="wrap">

  <div id="listView">
    <section class="panel">
      <div class="panel-hd">
        <h2>Saved programs</h2>
        <input class="search" id="lSearch" placeholder="Search by patient name…">
        <span class="count" id="lCount"></span>
      </div>
      <div id="plist"></div>
    </section>
  </div>

  <div id="buildView" style="display:none">
    <div class="cols">
      <section class="panel">
        <div class="panel-hd">
          <h2>Exercise library</h2>
          <button class="pbtn" id="bAddEx" title="Add an exercise that isn't in the library">+ Add your own exercise</button>
          <button class="pbtn" id="bExportCustom" title="Save the exercises you've written as a .json file">Export my exercises</button>
          <button class="pbtn" id="bImportCustom" title="Load exercises from a .json file">Import exercises</button>
          <input type="file" id="fCustomFile" accept=".json,application/json" style="display:none">
          <span class="count" id="libCount"></span>
        </div>
        <div class="filters">
          <div class="fgroup">
            <span class="lbl">Region</span>
            <div class="chips" id="fRegion"></div>
          </div>
          <div class="fgroup">
            <span class="lbl">Type</span>
            <div class="chips" id="fType"></div>
          </div>
          <div class="fgroup">
            <span class="lbl">Level</span>
            <div class="chips" id="fLevel"></div>
          </div>
          <div class="fgroup" id="fSourceGroup" style="display:none">
            <span class="lbl">Source</span>
            <div class="chips" id="fSource"></div>
          </div>
          <input class="search" id="fSearch" placeholder="Search exercises…">
        </div>
        <div id="libHint"></div>
        <div class="lib" id="lib"></div>
      </section>

      <section class="panel">
        <div class="panel-hd">
          <h2 id="asgTitle">This phase</h2>
          <span class="count" id="asgCount"></span>
        </div>
        <div class="bmeta" id="bmeta"></div>
        <div class="asg" id="asg"></div>
        <div class="notes">
          <label>
            <span class="lbl">Notes for patient — prints on their copy</span>
            <textarea id="nPatient" placeholder="Order to run them in, what it should feel like, when to stop, what to progress to…"></textarea>
          </label>
          <label>
            <span class="lbl">Daily modifications — prints on their copy</span>
            <textarea id="nDaily" placeholder="Sitting, sleeping, lifting, driving, desk setup, what to ease off for now…"></textarea>
          </label>
          <label>
            <span class="lbl">Practitioner notes — stays on your copy only</span>
            <textarea id="nPrac" placeholder="Findings, compensations seen, regression/progression triggers, what to reassess next visit…"></textarea>
            <span class="hint">Hidden from the patient copy.</span>
          </label>
        </div>
      </section>
    </div>
  </div>

  <div id="patientView" style="display:none"></div>
</div>

<div class="modal no-print" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-hd" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn ghost" id="modalCancel">Cancel</button>
      <button class="btn dark" id="modalOk">Save</button>
    </div>
  </div>
</div>

{id:"hip-stab-skater-bound", region:"hip", alsoRegion:"knee", type:"stability", level:3,
 name:"Skater Bound", rx:"4 x 5 each direction",
 desc:"Push off one leg sideways, land on the other and hold it. Build it up: bound and stick for 3s → stick on a soft surface → continuous bounds → bound and catch a ball on landing.",
 targets:"The single most sport-specific drill here — gate return to sport on being able to stick the landing clean"},
{id:"hip-stab-single-leg-balance-progression", region:"hip", alsoRegion:["knee","ankle-foot"], type:"stability", level:1,
 name:"Single Leg Balance Progression", rx:"3 x 30s each side",
 desc:"Stand on one leg. Build it up: eyes open 30s → eyes closed → on a foam pad or cushion → turning the head side to side → someone lightly nudging you → catching and throwing a ball.",
 targets:"Balance and reaction on one leg"},
{id:"hip-stab-standing-banded-abduction", region:"hip", type:"stability", level:1,
 name:"Standing Banded Abduction", rx:"3 x 15 each side",
 desc:"Band around the ankles, push one leg out to the side — but focus on the leg you are standing on doing the work. Build it up: slow reps → slow with a hold → add an opposite arm reach.",
 targets:"Standing hip control — the leg holding you up, not the leg moving"},
{id:"hip-stab-wall-press-march", region:"hip", type:"stability", level:1,
 name:"Wall Press March", rx:"3 x 20s each side",
 desc:"Hands on a wall, drive one knee up hard into an imaginary resistance while the other leg holds you. Build it up: hold still → alternate sides → add a band around the working thigh.",
 targets:"Hip flexor strength at the top of the range, plus standing hip control"},
{id:"hip-stab-suitcase-carry", region:"hip", type:"stability", level:2,
 name:"Suitcase Carry", rx:"4 x 30m each side",
 desc:"Carry a heavy weight in one hand only and walk without leaning. Build it up: light and short → heavier → heavy for short distances → add turns and uneven ground.",
 targets:"Side hip and trunk at once — very efficient pick if you are short on time"},
{id:"hip-stab-curtsy-lunge", region:"hip", type:"stability", level:2,
 name:"Curtsy Lunge", rx:"3 x 10 each side",
 desc:"Step one leg back and across behind the other, then lower. Build it up: bodyweight → hold a weight at the chest → add an opposite hand reach.",
 targets:"Hip control in twisted, crossed-over positions"},
{id:"hip-stab-single-leg-squat-to-box", region:"hip", alsoRegion:"knee", type:"stability", level:2,
 name:"Single Leg Squat to Box", rx:"3 x 6 each side",
 desc:"Stand on one leg, sit back to touch a box, stand back up. Build it up: high box → mid box → low box → no box with arms held out as a counterbalance.",
 targets:"Single leg strength and knee control under depth"},
{id:"hip-stab-lateral-resisted-walk", region:"hip", type:"stability", level:2,
 name:"Lateral Resisted Walk", rx:"4 x 15m each direction",
 desc:"Band or cable around the waist pulling sideways, shuffle against it in an athletic stance. Build it up: band → sled → holding a racquet in the ready position.",
 targets:"Sport-speed lateral push against resistance"},
{id:"hip-stab-half-kneeling-pallof-press", region:"hip", type:"stability", level:1,
 name:"Half-Kneeling Pallof Press", rx:"3 x 8 each side, 3s hold",
 desc:"Half-kneel side-on to a band, press it straight out from the chest and resist being twisted. Build it up: tall kneeling → half kneeling → split stance → standing.",
 targets:"Hip and anti-twist trunk control together"},
/* ---------- LUMBAR MOBILITY ---------- */
{id:"lumbar-mob-cat-cow", region:"lumbar", type:"mobility", level:1,
 name:"Cat-Cow", rx:"2 x 10 slow",
 desc:"On hands and knees, round and arch the spine. Build it up: whole spine together → move it one segment at a time from the top down → then bottom up → match it to slow breathing.",
 targets:"Gentle segment-by-segment low back movement and body awareness"},
{id:"lumbar-mob-pelvic-tilts", region:"lumbar", type:"mobility", level:1,
 name:"Pelvic Tilts", rx:"2 x 12",
 desc:"Tip the pelvis forward and back, finding the middle. Build it up: on your back → hands and knees → sitting on a ball → standing → standing with a racquet in hand.",
 targets:"The foundation for every bracing cue later — worth not skipping"},
{id:"lumbar-mob-supine-lower-trunk-rotation", region:"lumbar", type:"mobility", level:1,
 name:"Supine Lower Trunk Rotation", rx:"2 x 10 each side",
 desc:"On your back, let the knees fall to one side and back. Build it up: feet on the floor with a small arc → knees at 90 degrees, controlled → legs straight (biggest arc, go carefully).",
 targets:"Low back rotation, controlled"},
{id:"lumbar-mob-childs-pose-lateral-reach", region:"lumbar", type:"mobility", level:1,
 name:"Child's Pose Lateral Reach", rx:"30s each side",
 desc:"From child's pose, walk both hands to one side. Build it up: walk and hold 30s → add pushing the opposite hip back away from the hands.",
 targets:"Side bending of the low back and the lats"},
{id:"lumbar-mob-prone-press-up", region:"lumbar", type:"mobility", level:1,
 name:"Prone Press-Up", rx:"2 x 10",
 desc:"Lie face down and press the chest up while the hips stay down. Build it up: just lying face down → up on elbows → partial press-up → full press-up → press-up with the hips shifted to one side.",
 targets:"Low back extension range and tolerance"},
{id:"lumbar-mob-sphinx-to-cobra", region:"lumbar", type:"mobility", level:1,
 name:"Sphinx to Cobra", rx:"60s then 2 x 8",
 desc:"Rest on your elbows, chest up, hips heavy. Build it up: hold 60s → rock gently forward and back → press up to full cobra → cobra while looking over one shoulder.",
 targets:"Sustained extension — the counter to a desk-bound 18 months"},
{id:"lumbar-mob-standing-lateral-flexion-with-reach", region:"lumbar", type:"mobility", level:1,
 name:"Standing Lateral Flexion with Reach", rx:"2 x 8 each side",
 desc:"Standing, bend directly sideways without rotating. Build it up: slide the hand down the thigh → reach the opposite arm overhead → hold a light weight in the low hand.",
 targets:"Side bending, standing up"},
{id:"lumbar-mob-segmental-bridge", region:"lumbar", type:"mobility", level:1,
 name:"Segmental Bridge", rx:"2 x 8",
 desc:"Peel the spine off the floor one vertebra at a time, then lay it back down the same way. Build it up: two legs → slower with a pause at the top → one leg.",
 targets:"Half mobility, half control — teaches him to move the low back on purpose"},
{id:"lumbar-mob-quadruped-rock-back", region:"lumbar", type:"mobility", level:1,
 name:"Quadruped Rock Back", rx:"2 x 10",
 desc:"Hands and knees, rock the hips back toward the heels. Build it up: stop at a neutral spine → allow a little rounding at the end → add a reach-through rotation.",
 targets:"Low back flexion range, unloaded"},
{id:"lumbar-mob-seated-ball-rotation", region:"lumbar", type:"mobility", level:1,
 name:"Seated Ball Rotation", rx:"2 x 10 each side",
 desc:"Sit on a ball with feet planted and rotate side to side. Build it up: small arcs → hands crossed on the chest → arms crossed at the shoulders → hands overhead.",
 targets:"Controlled seated rotation — an easy daily option he can do anywhere"},
/* ---------- LUMBAR STABILITY ---------- */
{id:"lumbar-stab-dead-bug", region:"lumbar", type:"stability", level:1,
 name:"Dead Bug", rx:"3 x 8 each side",
 desc:"On your back, low back pressed flat, lower opposite arm and leg. Build it up: arms only → legs only → opposite arm and leg → with a 3s hold at the bottom → holding a band anchored overhead → heels sliding along the floor → pressing a weight or ball.",
 targets:"Stops the low back arching while the arms and legs move — the serve position"},
{id:"lumbar-stab-bird-dog", region:"lumbar", type:"stability", level:1,
 name:"Bird Dog", rx:"3 x 8 each side, 5s hold",
 desc:"Hands and knees, reach opposite arm and leg out long without tipping. Build it up: arm only → leg only → opposite arm and leg → hold 5s → draw elbow to knee and back out → add a band row → hold a light weight.",
 targets:"Trunk control against twisting while the limbs work"},
{id:"lumbar-stab-mcgill-curl-up", region:"lumbar", type:"stability", level:1,
 name:"McGill Curl-Up", rx:"3 sets: 10s, 8s, 6s holds",
 desc:"Lie on your back, hands under the low back, one knee bent, lift the head and shoulders just an inch. Build it up: 10 second holds, then descending sets of 10-8-6.",
 targets:"Front trunk endurance without loading the low back into flexion"},
{id:"lumbar-stab-side-plank", region:"lumbar", type:"stability", level:1,
 name:"Side Plank", rx:"3 x 30-45s each side",
 desc:"Elbow under the shoulder, body in a straight line. Build it up: knees down → feet stacked → lift the top leg → thread the top arm under and rotate → add a band row.",
 targets:"Side trunk endurance — a key marker for return to sport"},
{id:"lumbar-stab-front-plank-to-rkc-plank", region:"lumbar", type:"stability", level:1,
 name:"Front Plank to RKC Plank", rx:"3 x 20-40s",
 desc:"Standard plank, then make it harder by squeezing everything maximally. Build it up: normal hold → RKC (all-out tension for 10s) → alternating arm reach → body saw rocking forward and back.",
 targets:"Stops the low back sagging under effort"},
{id:"lumbar-stab-pallof-press", region:"lumbar", type:"stability", level:1,
 name:"Pallof Press", rx:"3 x 8 each side, 3s hold",
 desc:"Side-on to a band at chest height, press out and resist the twist. Build it up: tall kneeling → half kneeling → split stance → standing athletic → with a lateral step out → adding a rotation at the end.",
 targets:"The anchor anti-twist drill — should appear in some form in all three blocks"},
{id:"lumbar-stab-half-kneeling-chop", region:"lumbar", type:"stability", level:2,
 name:"Half-Kneeling Chop", rx:"3 x 10 each side",
 desc:"Half-kneel, pull a high cable or band down and across the body. Build it up: band → cable → add a full rotation follow-through.",
 targets:"Diagonal force transfer — the groundstroke pattern"},
{id:"lumbar-stab-half-kneeling-lift", region:"lumbar", type:"stability", level:2,
 name:"Half-Kneeling Lift", rx:"3 x 10 each side",
 desc:"The mirror of the chop — drive a low cable or band up and across. Build it up: band → cable → add rotation and a bigger finish.",
 targets:"Upward diagonal transfer — maps directly onto the serve"},
{id:"lumbar-stab-farmer-suitcase-carry", region:"lumbar", type:"stability", level:2,
 name:"Farmer / Suitcase Carry", rx:"4 x 30-40m",
 desc:"Walk holding heavy weight. Build it up: both hands → one hand only → one hand overhead → one racked at the shoulder and one hanging.",
 targets:"Trunk stiffness while walking and turning under load"},
{id:"lumbar-stab-bear-crawl", region:"lumbar", type:"stability", level:1,
 name:"Bear Crawl", rx:"3 x 20s or 10m",
 desc:"Hands and toes, knees hovering an inch off the floor. Build it up: hold still 20s → shoulder taps → crawl forward and back → crawl sideways.",
 targets:"Trunk control against twisting while moving on all fours"},
{id:"lumbar-stab-stir-the-pot", region:"lumbar", type:"stability", level:2,
 name:"Stir the Pot", rx:"3 x 8 circles each way",
 desc:"Forearms on a stability ball in a plank, draw circles with the elbows. Build it up: small circles → wider circles → figure-8 → one arm.",
 targets:"Trunk control under a moving, unstable load"},
{id:"lumbar-stab-hollow-body-hold", region:"lumbar", type:"stability", level:2,
 name:"Hollow Body Hold", rx:"3 x 20-30s",
 desc:"On your back, low back pressed flat, arms and legs lifted. Build it up: knees tucked → one leg out → full hollow → hollow rocking.",
 targets:"Whole-front trunk tension"},
{id:"lumbar-stab-landmine-anti-rotation-press", region:"lumbar", type:"stability", level:2,
 name:"Landmine Anti-Rotation Press", rx:"3 x 8 each side",
 desc:"Bar in a landmine, press it away from one shoulder without letting the trunk twist. Build it up: tall kneeling → half kneeling → standing → standing with a rotation and step.",
 targets:"Pressing strength while the trunk refuses to give up rotation"},
{id:"lumbar-stab-renegade-row", region:"lumbar", type:"stability", level:3,
 name:"Renegade Row", rx:"3 x 8 each side",
 desc:"Plank on two dumbbells, row one at a time without the hips rocking. Build it up: from the knees → feet wide → feet narrow → add a push-up between rows.",
 targets:"Anti-twist under real load"},
{id:"lumbar-stab-glute-bridge-march", region:"lumbar", type:"stability", level:1,
 name:"Glute Bridge March", rx:"3 x 10 each side",
 desc:"Hold a bridge and lift one knee at a time with zero drop in the hips. Build it up: slow marching → add a band around the knees → add ankle weight.",
 targets:"Keeping the pelvis level while one leg unloads — the single leg stance moment"},
{id:"lumbar-stab-standing-banded-overhead-press", region:"lumbar", type:"stability", level:2,
 name:"Standing Banded Overhead Press", rx:"3 x 10",
 desc:"Press a band overhead without the ribs flaring or the back arching. Build it up: light band, slow → heavier band → single arm.",
 targets:"Rehearses the serve trunk position under safe load"},
{id:"lumbar-stab-ab-wheel-ball-rollout", region:"lumbar", type:"stability", level:3,
 name:"Ab Wheel / Ball Rollout", rx:"3 x 8",
 desc:"Roll out and back without the low back arching. Build it up: rolling up a wall → from the knees, short range → from the knees, full range → from the feet.",
 targets:"Top-end resistance to arching"},
{id:"lumbar-stab-plank-shoulder-taps", region:"lumbar", type:"stability", level:1,
 name:"Plank Shoulder Taps", rx:"3 x 10 each side",
 desc:"Plank on hands, tap one hand to the opposite shoulder with no hip rock. Build it up: feet wide → feet narrow → feet elevated.",
 targets:"Anti-twist with a shifting base"},
{id:"lumbar-stab-med-ball-rotational-throw", region:"lumbar", type:"stability", level:3,
 name:"Med Ball Rotational Throw", rx:"4 x 6 each side",
 desc:"Throw a medicine ball rotationally into a wall. Build it up: half-kneeling scoop toss → standing scoop → standing side throw → step-in rotational throw → overhead slam.",
 targets:"Where mobility and stability finally become power — the Stage 3 gate drill"},
{id:"lumbar-stab-offset-uneven-carry", region:"lumbar", type:"stability", level:2,
 name:"Offset / Uneven Carry", rx:"4 x 30m each way",
 desc:"Carry two different weights, or one racked at the shoulder and one hanging. Build it up: small difference → bigger difference → add turns and direction changes.",
 targets:"Trunk control under uneven load — closer to real sport than a symmetrical carry"},
/* ---------- THORACIC MOBILITY ---------- */
{id:"thoracic-mob-open-book", region:"thoracic", type:"mobility", level:1,
 name:"Open Book", rx:"2 x 8 each side",
 desc:"Side lying, knees stacked and bent, open the top arm across the body and follow it with the eyes. Build it up: knees on the floor → knees on a foam roller → trace the arm all the way overhead → hold for 3 breaths at the end.",
 targets:"Upper back rotation with the low back locked out"},
{id:"thoracic-mob-thread-the-needle", region:"thoracic", type:"mobility", level:1,
 name:"Thread the Needle", rx:"5 breaths each side",
 desc:"On hands and knees, slide one arm under the body, then open it to the ceiling. Build it up: reach through and hold → reach through then open to the ceiling → hold 5 breaths at each end.",
 targets:"Upper back rotation and shoulder blade movement"},
{id:"thoracic-mob-quadruped-rotation", region:"thoracic", type:"mobility", level:1,
 name:"Quadruped Rotation (hand behind head)", rx:"2 x 8 each side",
 desc:"Hands and knees, one hand behind the head, rotate the elbow up to the ceiling. Build it up: hand behind head → hand on the low back (harder, more isolated) → same but rocked back onto the heels.",
 targets:"Upper back rotation without the low back joining in"},
{id:"thoracic-mob-half-kneeling-rotation-with-dowel", region:"thoracic", type:"mobility", level:2,
 name:"Half-Kneeling Rotation with Dowel", rx:"2 x 8 each side",
 desc:"Half-kneel with a dowel across the shoulders and rotate. Build it up: dowel across the shoulders → dowel held overhead → add a reach at the end of range.",
 targets:"Half-kneeling locks the pelvis, so all rotation has to come from the upper back"},
{id:"thoracic-mob-seated-9090-rotation", region:"thoracic", type:"mobility", level:1,
 name:"Seated 90/90 Rotation", rx:"2 x 10 each side",
 desc:"Sit tall with a ball squeezed between the knees and rotate. Build it up: arms crossed on the chest → arms crossed at the shoulders → hands overhead.",
 targets:"Isolated seated rotation with the legs held still"},
{id:"thoracic-mob-foam-roller-extension", region:"thoracic", type:"mobility", level:1,
 name:"Foam Roller Thoracic Extension", rx:"3 breaths x 4-5 levels",
 desc:"Roller across the mid-back, support the head, arch backward over it. Build it up: work one level at a time, 3 breaths each, moving up and down the spine.",
 targets:"Upper back extension, segment by segment"},
{id:"thoracic-mob-peanut-segmental-extension", region:"thoracic", type:"mobility", level:1,
 name:"Peanut Segmental Extension", rx:"3 breaths x 4-5 levels",
 desc:"Two balls taped together either side of the spine, extend over them level by level. Build it up: extend only → add an overhead arm reach at each level.",
 targets:"More targeted version of the roller — good for a specific stiff segment"},
{id:"thoracic-mob-wall-angels", region:"thoracic", type:"mobility", level:1,
 name:"Wall Angels", rx:"2 x 10",
 desc:"Back to a wall, ribs down, slide the arms up and overhead keeping contact. Build it up: partial range → full overhead → add a band → do it in a half squat.",
 targets:"Upper back extension plus overhead shoulder range — the serve position"},
{id:"thoracic-mob-bench-extension", region:"thoracic", type:"mobility", level:1,
 name:"Bench Thoracic Extension", rx:"3 x 45s",
 desc:"Kneel with elbows on a bench and sink the chest toward the floor. Build it up: elbows on bench → hold a dowel overhead → add a rotation to one side.",
 targets:"Overhead reach and upper back extension together"},
{id:"thoracic-mob-childs-pose-rotation-reach-through", region:"thoracic", type:"mobility", level:1,
 name:"Child's Pose Rotation Reach-Through", rx:"5 breaths each side",
 desc:"From child's pose, reach one arm under and through, then open it up. Build it up: reach through → open to the ceiling → 5 slow breaths at each end.",
 targets:"Gentle rotation with the hips fully parked"},
{id:"thoracic-mob-bretzel-1", region:"thoracic", type:"mobility", level:1,
 name:"Bretzel 1", rx:"5 breaths each side",
 desc:"Side lying, top knee resting on a roller held by the bottom hand, rotate the chest away. Build it up: hold 5 breaths → build the hold time → add a deeper exhale into range.",
 targets:"Rotation with both the hip and the low back locked out"},
{id:"thoracic-mob-bretzel-2", region:"thoracic", type:"mobility", level:2,
 name:"Bretzel 2", rx:"5 breaths each side",
 desc:"As Bretzel 1 but also holding the bottom foot behind you to add a quad stretch.",
 targets:"Rotation plus front-of-hip length in one position"},
{id:"thoracic-mob-side-lying-windmill", region:"thoracic", type:"mobility", level:1,
 name:"Side-Lying Windmill", rx:"2 x 8 each side",
 desc:"Side lying, knees bent, sweep the top arm in a big arc from floor to floor. Build it up: bent arm → straight arm → follow with the head and eyes → hold a light weight.",
 targets:"Big-arc rotation combined with shoulder range"},
{id:"thoracic-mob-standing-wall-rotation", region:"thoracic", type:"mobility", level:2,
 name:"Standing Wall Rotation (ball between knees)", rx:"2 x 10 each side",
 desc:"Stand facing away from a wall with a ball squeezed between the knees, rotate to touch the wall behind. Build it up: hands on chest → hands overhead → add a hold at the end.",
 targets:"The ball kills any hip or low back contribution — rotation is pure upper back"},
{id:"thoracic-mob-rock-back-with-rotation", region:"thoracic", type:"mobility", level:1,
 name:"Rock Back with Rotation", rx:"2 x 8 each side",
 desc:"On hands and knees, rock the hips back to the heels then rotate. Build it up: rock then rotate → hold at the end → add an overhead reach.",
 targets:"Hip flexion parks the pelvis so the rotation is clean"},
{id:"thoracic-mob-rib-roll-breathing", region:"thoracic", type:"mobility", level:1,
 name:"Rib Roll Breathing", rx:"6 breaths each side",
 desc:"Side lying, one hand on the ribs, breathe all the way out then rotate open on the exhale. Build it up: 6 slow breaths per side, letting range come from the exhale rather than force.",
 targets:"Ribcage expansion — if the ribs don't move, upper back rotation stays capped"},
{id:"thoracic-mob-sphinx-with-rotation", region:"thoracic", type:"mobility", level:1,
 name:"Sphinx with Rotation", rx:"2 x 8 each side",
 desc:"From sphinx, reach one arm up and overhead, rotating the chest open. Build it up: small reach → full overhead reach → hold at the end of range.",
 targets:"Extension and rotation together, unloaded"},
{id:"thoracic-mob-bench-rotation-with-overhead-dowel", region:"thoracic", type:"mobility", level:2,
 name:"Bench Rotation with Overhead Dowel", rx:"2 x 8 each side",
 desc:"Chest supported on an incline bench, dowel held overhead, rotate side to side. Build it up: light dowel → longer lever → pause at the end of range.",
 targets:"Loaded end-range rotation with the trunk supported"},
{id:"thoracic-mob-half-kneeling-adductor-rotation-combo", region:"thoracic", type:"mobility", level:2,
 name:"Half-Kneeling Adductor + Rotation Combo", rx:"2 x 8 each side",
 desc:"Half-kneel with the front leg out wide to the side, then rotate the chest toward the front leg. Build it up: rotate only → add an overhead reach → hold 3 breaths at the end.",
 targets:"Hip and upper back at once — efficient when session time is short"},
{id:"thoracic-mob-seated-on-heels-rotation", region:"thoracic", type:"mobility", level:1,
 name:"Seated-on-Heels Rotation", rx:"2 x 10 each side",
 desc:"Sit back on the heels and rotate the chest. Build it up: hands on the chest → hands behind the head → hands overhead.",
 targets:"The cleanest upper back isolation available — the pelvis simply cannot move"},
/* ---------- THORACIC STABILITY ---------- */
{id:"thoracic-stab-prone-ytwi", region:"thoracic", alsoRegion:"shoulder", type:"stability", level:1,
 name:"Prone Y-T-W-I", rx:"2 x 8 each position",
 desc:"Face down, lift the arms in four different shapes. Build it up: no weight → 2s hold at the top → light plates → face down on an incline bench.",
 targets:"Mid-back and shoulder blade endurance"},
{id:"thoracic-stab-band-pull-apart", region:"thoracic", alsoRegion:"shoulder", type:"stability", level:1,
 name:"Band Pull-Apart", rx:"3 x 15",
 desc:"Pull a band apart with straight arms. Build it up: at chest height → at 45 degrees → overhead → add a 2s hold.",
 targets:"Mid-back strength — the direct counter to a rounded desk posture"},
{id:"thoracic-stab-face-pull", region:"thoracic", alsoRegion:"shoulder", type:"stability", level:1,
 name:"Face Pull", rx:"3 x 15",
 desc:"Pull a band or cable toward the face with the elbows high. Build it up: band → cable → add external rotation at the end → half kneeling.",
 targets:"Rear shoulder and mid-back — protects the shoulder over a long serving season"},
{id:"thoracic-stab-prone-swimmers", region:"thoracic", alsoRegion:"shoulder", type:"stability", level:1,
 name:"Prone Swimmers", rx:"2 x 6 full circuits",
 desc:"Face down, sweep the arms in a slow arc from overhead to the low back and reverse. Build it up: slow and continuous → pause at each position → add light weight.",
 targets:"Shoulder blade control through a full arc"},
{id:"thoracic-stab-banded-wall-slide", region:"thoracic", alsoRegion:"shoulder", type:"stability", level:1,
 name:"Banded Wall Slide", rx:"3 x 10",
 desc:"Band around the wrists, forearms on a wall, slide up while pushing out against the band. Build it up: short range → full overhead → add a 3s hold at the top.",
 targets:"Overhead shoulder blade control — the serve arm path"},
{id:"thoracic-stab-scap-push-up", region:"thoracic", alsoRegion:"shoulder", type:"stability", level:1,
 name:"Scap Push-Up", rx:"3 x 12",
 desc:"Plank position, arms locked, only the shoulder blades move together and apart. Build it up: against a wall → on an incline → on the floor → feet elevated.",
 targets:"Serratus and shoulder blade control on the ribcage"},
{id:"thoracic-stab-single-arm-row", region:"thoracic", alsoRegion:"shoulder", type:"stability", level:1,
 name:"Single Arm Row", rx:"3 x 10 each side",
 desc:"Row a weight to the hip without letting the trunk twist toward it. Build it up: supported on a bench → free standing in a split stance → standing on one leg.",
 targets:"Pulling strength while the trunk resists rotation"},
{id:"thoracic-stab-landmine-press", region:"thoracic", alsoRegion:"shoulder", type:"stability", level:2,
 name:"Landmine Press", rx:"3 x 8 each side",
 desc:"Press a landmine bar up and away at an angle. Build it up: tall kneeling → half kneeling → standing → standing with a rotation.",
 targets:"Overhead pressing at an angle the shoulder tolerates well"},
{id:"thoracic-stab-half-kneeling-single-arm-press", region:"thoracic", alsoRegion:"shoulder", type:"stability", level:2,
 name:"Half-Kneeling Single Arm Press", rx:"3 x 8 each side",
 desc:"Half-kneel and press a dumbbell overhead with the ribs staying down. Build it up: light and slow → heavier → add a pause overhead.",
 targets:"Direct rehearsal of the trunk position at the top of the serve"},
{id:"thoracic-stab-serratus-wall-slide", region:"thoracic", alsoRegion:"shoulder", type:"stability", level:1,
 name:"Serratus Wall Slide", rx:"3 x 10",
 desc:"Forearms on a wall, push into the wall and slide up, reaching long at the top. Build it up: short range → full reach → add a band around the wrists.",
 targets:"Serratus — the muscle that lets the arm get truly overhead"},
{id:"thoracic-stab-bear-position-shoulder-taps", region:"thoracic", type:"stability", level:1,
 name:"Bear Position Shoulder Taps", rx:"3 x 10 each side",
 desc:"Knees hovering off the floor, tap one hand to the opposite shoulder. Build it up: feet wide → feet narrow → slow down the tempo.",
 targets:"Shoulder and trunk control together on an unstable base"},
{id:"thoracic-stab-turkish-get-up", region:"thoracic", type:"stability", level:2,
 name:"Turkish Get-Up", rx:"3 x 3 each side",
 desc:"Move from lying to standing while holding a weight overhead, then reverse it. Build it up: to the elbow → to the hand → to half kneeling → all the way up → heavier.",
 targets:"The best single integrator here — hip, low back and upper back in one pattern"},
{id:"thoracic-stab-isometric-rotation-hold", region:"thoracic", type:"stability", level:2,
 name:"Isometric Rotation Hold", rx:"3 x 20s each side",
 desc:"Rotate to the end of your range and hold there against a band pulling you back. Build it up: 10s → 20s → heavier band.",
 targets:"Builds strength inside the new range so it doesn't get lost again"},
{id:"thoracic-stab-med-ball-scoop-toss", region:"thoracic", type:"stability", level:3,
 name:"Med Ball Scoop Toss", rx:"4 x 6 each side",
 desc:"Throw a medicine ball across the body into a wall. Build it up: half kneeling → standing → with a step in → catching the rebound and throwing straight back.",
 targets:"Rotational power with a reactive catch"},
{id:"thoracic-stab-chop-and-lift-complex", region:"thoracic", type:"stability", level:2,
 name:"Chop and Lift Complex", rx:"3 x 8 each direction",
 desc:"Run the chop and the lift back to back in both directions. Build it up: controlled tempo → faster → full sport speed.",
 targets:"The complete diagonal pattern, both groundstroke and serve directions"},

/* ---------- CERVICAL MOBILITY ---------- */
{id:"cervical-mob-chin-nod", region:"cervical", type:"mobility", level:1,
 name:"Chin Nod", rx:"2 x 10, slow",
 desc:"Lying on your back or sitting tall, make a small nodding movement as if saying a quiet yes — the movement happens at the very top of the neck, just under the skull. The rest of the neck stays completely still. Build it up: lying down → sitting → standing against a wall.",
 targets:"Movement at the top two neck joints, separate from the rest of the neck"},
{id:"cervical-mob-rotation", region:"cervical", type:"mobility", level:1,
 name:"Neck Rotation", rx:"2 x 8 each side",
 desc:"Sitting tall, turn the head slowly to look over one shoulder, then the other. Keep the chin level — no tipping up or down. Build it up: small comfortable range → full range → pause 2-3 seconds at the end → add a gentle breath out at the end range.",
 targets:"Overall neck rotation"},
{id:"cervical-mob-rotation-in-flexion", region:"cervical", type:"mobility", level:2,
 name:"Rotation in Flexion", rx:"2 x 8 each side",
 desc:"Drop the chin fully to the chest and hold it there, then turn the head to each side. Bending the neck forward first locks the lower joints, so the rotation comes from the very top of the neck only. Range will feel much smaller than normal rotation — that is expected.",
 targets:"Rotation at the top of the neck specifically, where it is often lost first"},
{id:"cervical-mob-side-bend", region:"cervical", type:"mobility", level:1,
 name:"Neck Side Bend", rx:"2 x 8 each side",
 desc:"Sitting tall, tip one ear toward the shoulder without turning the head or lifting the shoulder up. Build it up: unassisted → let the hand rest on the head for a light assist → hold the opposite side of the chair to anchor the shoulder down.",
 targets:"Sideways neck movement"},
{id:"cervical-mob-retraction", region:"cervical", type:"mobility", level:1,
 name:"Chin Retraction", rx:"2 x 10, 2s hold",
 desc:"Draw the head straight backward over the shoulders, making a double chin, without tipping the head up or down. Think of sliding the head back along a shelf. Build it up: sitting → against a wall → lying on your back → holding 5 seconds.",
 targets:"Resetting head position over the shoulders"},
{id:"cervical-mob-retraction-extension", region:"cervical", type:"mobility", level:2,
 name:"Retraction with Extension", rx:"2 x 8",
 desc:"Draw the chin back first, then from that position look up toward the ceiling. Come back down before releasing the chin tuck. The order matters — tucking first protects the joints as you extend. Go only as far as comfortable and never hold at the top.",
 targets:"Backward neck movement, sequenced safely"},
{id:"cervical-mob-suboccipital-stretch", region:"cervical", type:"mobility", level:1,
 name:"Sub-occipital Stretch", rx:"3 x 30s",
 desc:"Sitting or lying, tuck the chin gently and place both hands on the back of the head, letting the weight of the hands draw the head forward. The stretch should be felt right at the base of the skull, not down the middle of the neck.",
 targets:"The small muscles under the base of the skull — a common source of headache"},
{id:"cervical-mob-levator-stretch", region:"cervical", type:"mobility", level:1,
 name:"Levator Scapulae Stretch", rx:"3 x 30s each side",
 desc:"Turn the head about 45 degrees away from the tight side, then drop the nose toward the armpit. Reach the same-side hand down and behind you, or hold the chair, to keep that shoulder from riding up. Build it up: hand on the chair → hand behind the back → light overpressure from the other hand.",
 targets:"Levator scapulae — the ropey band from the neck to the top of the shoulder blade"},
{id:"cervical-mob-upper-trap-stretch", region:"cervical", type:"mobility", level:1,
 name:"Upper Trapezius Stretch", rx:"3 x 30s each side",
 desc:"Tip one ear toward the shoulder while keeping the nose facing forward. Anchor the opposite shoulder down by sitting on that hand or holding the chair. Build it up: unassisted → light hand assist on the head → add a slow breath out at the end range.",
 targets:"Upper trapezius — the sloping muscle from neck to shoulder"},
{id:"cervical-mob-scalene-stretch", region:"cervical", type:"mobility", level:1,
 name:"Scalene Stretch", rx:"3 x 30s each side",
 desc:"Anchor the collarbone down with the opposite hand. Tip the ear away, then turn the nose slightly toward the tight side and lift the chin a little. Small adjustments change which part you feel — hunt for the version that gives a clear, tolerable stretch at the side of the neck.",
 targets:"Scalenes — often involved where neck tightness comes with arm symptoms"},
{id:"cervical-mob-scm-stretch", region:"cervical", type:"mobility", level:2,
 name:"Sternocleidomastoid Stretch", rx:"2 x 30s each side",
 desc:"Anchor just below the collarbone on the tight side. Tip the ear away, turn the nose toward the tight side, then gently lift the chin. Go carefully — this one reaches end range quickly and should never be forced.",
 targets:"Sternocleidomastoid — the prominent strap at the front of the neck"},
{id:"cervical-mob-suboccipital-release", region:"cervical", type:"mobility", level:1,
 name:"Sub-occipital Release", rx:"90-120s",
 desc:"Lie on your back with two balls in a sock, or a rolled towel, placed just under the base of the skull either side of the middle. Let the head rest and breathe. Build it up: rest still → slow small nods → slow rotation across the balls.",
 targets:"Tension at the base of the skull — pairs well with hands-on work between visits"},
{id:"cervical-mob-cars", region:"cervical", type:"mobility", level:2,
 name:"Neck CARs", rx:"2 slow circles each direction",
 desc:"Sitting tall, trace the largest slow circle you can with the top of the head — forward, around to one side, back, and around. Keep the shoulders completely still and the movement continuous. Build it up: small circle → full range → 20 seconds per circle.",
 targets:"Full neck range in every direction, and a good weekly self-check"},
{id:"cervical-mob-ct-junction-extension", region:"cervical", type:"mobility", level:1,
 name:"Cervicothoracic Junction Extension", rx:"3 breaths x 3 levels",
 desc:"Lie with a foam roller across the very top of the upper back, just below the neck, supporting your head with your hands. Let the upper back arch back over the roller and breathe. Build it up: one level at a time, working down a few segments.",
 targets:"The stiff junction where the neck meets the upper back — usually the real restriction when the neck feels tight"},
{id:"cervical-mob-axial-elongation", region:"cervical", type:"mobility", level:1,
 name:"Axial Elongation", rx:"2 x 8, 5s hold",
 desc:"Sitting tall, imagine the crown of the head being drawn straight up toward the ceiling while the shoulders stay heavy. The chin stays level and slightly tucked. This should feel like lengthening, not lifting the chin.",
 targets:"Postural reset — a useful cue to give someone at a desk"},
{id:"cervical-mob-first-rib-mob", region:"cervical", type:"mobility", level:2,
 name:"First Rib Self-Mobilization", rx:"2 x 10 each side",
 desc:"Loop a strap or belt over the top of the shoulder near the neck, holding the ends across the opposite hip. Pull down and forward on the strap, then tip the ear away and breathe out. Release on the breath in.",
 targets:"First rib position — relevant where neck tightness comes with symptoms into the arm"},
{id:"cervical-mob-rotation-overpressure", region:"cervical", type:"mobility", level:2,
 name:"Rotation with Self Overpressure", rx:"2 x 6 each side",
 desc:"Turn the head as far as comfortable, then use the fingertips on the chin to add a small amount of extra rotation. Hold 3 seconds and release. Very light pressure only — a few extra degrees, not a wrench.",
 targets:"End-range rotation, gently loaded"},
{id:"cervical-mob-prone-on-elbows", region:"cervical", type:"mobility", level:2,
 name:"Prone on Elbows Retraction", rx:"2 x 10",
 desc:"Lie face down propped on your elbows. From there, draw the chin straight back and hold 3 seconds. Build it up: hold the position 60 seconds first, then add the chin tucks, then add looking gently up between tucks.",
 targets:"Neck retraction with the upper back already extended"},
{id:"cervical-mob-wall-chin-tuck-slide", region:"cervical", type:"mobility", level:1,
 name:"Wall Chin Tuck Slide", rx:"2 x 10",
 desc:"Stand with the back of the head, upper back and tailbone against a wall. Draw the chin back to press the head into the wall, hold 3 seconds, release. Build it up: heels a few inches out → heels touching the wall → add slow arm slides overhead.",
 targets:"Neck position with a clear reference point behind you"},
{id:"cervical-mob-eye-led-rotation", region:"cervical", type:"mobility", level:1,
 name:"Eye-Led Rotation", rx:"2 x 6 each side",
 desc:"Keep the head still and move the eyes to look as far as comfortable to one side. Then let the head follow the eyes around. Reverse to come back. The eyes always lead.",
 targets:"Coordination between eye and neck movement — often disrupted after whiplash or long periods of guarded movement"},
{id:"cervical-mob-segmental-rotation", region:"cervical", type:"mobility", level:3,
 name:"Segmental Rotation", rx:"2 x 6 each side",
 desc:"Place a fingertip on the side of one neck bone to block it, then rotate the head toward the opposite side. The block localises the movement to the joints above your finger. Build it up: work one level at a time, starting high and moving down.",
 targets:"Rotation at a specific level rather than the neck as a whole"},
{id:"cervical-mob-flexion-glide", region:"cervical", type:"mobility", level:1,
 name:"Neck Flexion", rx:"2 x 8",
 desc:"Sitting tall, drop the chin toward the chest, letting the neck curl from the top down. Build it up: unassisted → light hand weight on the back of the head → add a slow breath out at the end.",
 targets:"Forward neck bending, which is often guarded after an irritable episode"},

/* ---------- CERVICAL STABILITY ---------- */
{id:"cervical-stab-ccf", region:"cervical", type:"stability", level:1,
 name:"Cranio-cervical Flexion", rx:"10 x 10s holds",
 desc:"Lying on your back with a folded towel under the head, make a small nod as if saying yes and hold it — without lifting the head off the towel and without the front neck muscles standing out. Build it up: 5 second holds → 10 seconds → 10 repetitions of 10 seconds.",
 targets:"The deep neck flexors, which are usually weak and are what actually hold the head up"},
{id:"cervical-stab-chin-tuck-head-lift", region:"cervical", type:"stability", level:2,
 name:"Chin Tuck Head Lift", rx:"3 x 8, 3s hold",
 desc:"Lying on your back, tuck the chin first, then lift the head an inch off the surface keeping the tuck. Lower with the tuck still held. The moment the chin pokes forward, stop the set. Build it up: 3 second holds → 5 seconds → more repetitions.",
 targets:"Deep neck flexor strength against the weight of the head"},
{id:"cervical-stab-head-hover", region:"cervical", type:"stability", level:2,
 name:"Head Hover Hold", rx:"3 x 15-30s",
 desc:"Lying on your back, tuck the chin and hover the head just off the surface. Hold. Build it up: 10 seconds → 30 seconds → knees straight instead of bent.",
 targets:"Deep neck flexor endurance — the thing that fails by mid-afternoon at a desk"},
{id:"cervical-stab-prone-extension", region:"cervical", type:"stability", level:2,
 name:"Prone Neck Extension", rx:"3 x 8, 3s hold",
 desc:"Lie face down with the forehead resting on a towel. Tuck the chin slightly, then lift the head just off the towel keeping the chin tucked. Small range only — this is not looking up.",
 targets:"Deep neck extensors at the back of the neck"},
{id:"cervical-stab-quadruped-hold", region:"cervical", type:"stability", level:1,
 name:"Quadruped Neutral Hold", rx:"3 x 30s",
 desc:"On hands and knees, set the neck so the head continues the line of the spine — not hanging down, not craned up. Hold and breathe. Build it up: 30 seconds → 60 seconds → add slow arm reaches.",
 targets:"Holding neck position against gravity, which is where most people lose it"},
{id:"cervical-stab-iso-flexion", region:"cervical", type:"stability", level:1,
 name:"Isometric Flexion", rx:"3 x 10s, 30-50% effort",
 desc:"Place a hand on the forehead and press the head gently forward into it. Nothing moves. Build it up: 30% effort → 50% → 10 second holds. Never go to maximum.",
 targets:"Front neck strength without any movement — safe when the neck is irritable"},
{id:"cervical-stab-iso-extension", region:"cervical", type:"stability", level:1,
 name:"Isometric Extension", rx:"3 x 10s, 30-50% effort",
 desc:"Place both hands on the back of the head and press the head gently backward into them. Nothing moves. Keep the chin lightly tucked throughout.",
 targets:"Back of neck strength without movement"},
{id:"cervical-stab-iso-side-bend", region:"cervical", type:"stability", level:1,
 name:"Isometric Side Bend", rx:"3 x 10s each side",
 desc:"Place a hand on the side of the head and press the head gently into it, as if tipping the ear toward the shoulder. Nothing moves. Keep both shoulders level.",
 targets:"Side neck strength without movement"},
{id:"cervical-stab-iso-rotation", region:"cervical", type:"stability", level:1,
 name:"Isometric Rotation", rx:"3 x 10s each side",
 desc:"Place a hand against the side of the forehead and press as if turning to look that way. Nothing moves. Build it up: from a neutral head position → from a partly turned position.",
 targets:"Rotational neck strength without movement"},
{id:"cervical-stab-iso-circuit", region:"cervical", type:"stability", level:2,
 name:"Multi-direction Isometric Circuit", rx:"2 rounds of 4 x 10s",
 desc:"Cycle through all four isometric directions — forward, back, and each side — 10 seconds each with no rest between. Build it up: one round → two rounds → add rotation as a fifth and sixth position.",
 targets:"Whole-neck endurance in every direction, efficiently"},
{id:"cervical-stab-wall-ball-hold", region:"cervical", type:"stability", level:2,
 name:"Wall Ball Isometric Hold", rx:"3 x 20-30s each position",
 desc:"Place a small ball between your forehead and a wall and lean in gently to hold it there. Build it up: forehead → back of head against the wall behind you → side of head.",
 targets:"Sustained neck holding in a functional standing position"},
{id:"cervical-stab-wall-ball-circles", region:"cervical", type:"stability", level:3,
 name:"Wall Ball Circles", rx:"3 x 5 circles each direction",
 desc:"With the ball held between the head and the wall, trace slow circles by moving the head, keeping steady pressure so the ball never drops. Build it up: small circles → larger circles → figure-8 → write the alphabet.",
 targets:"Neck control through range while under load"},
{id:"cervical-stab-chin-tuck-row", region:"cervical", type:"stability", level:2,
 name:"Chin Tuck with Band Row", rx:"3 x 12",
 desc:"Set and hold a chin tuck, then row a band to the ribs without the chin poking forward. The neck position is the exercise; the row is just the challenge to it.",
 targets:"Keeping neck position while the arms work — the actual demand of daily life"},
{id:"cervical-stab-roller-nod", region:"cervical", type:"stability", level:2,
 name:"Supine Nod on Foam Roller", rx:"3 x 10",
 desc:"Lie lengthways along a foam roller, head supported at the top. Perform slow chin nods. The unstable base means the neck has to control side-to-side as well as the nod itself.",
 targets:"Neck control on an unstable surface"},
{id:"cervical-stab-rotation-iso-range", region:"cervical", type:"stability", level:3,
 name:"Rotation Isometrics Through Range", rx:"3 x 5s at 3 positions each side",
 desc:"Turn the head partway to one side and hold an isometric there against your hand. Then turn further and repeat, and once more near end range. Build strength at each point rather than only in the middle.",
 targets:"Neck strength at the end of range, not just in neutral"},
{id:"cervical-stab-gaze-stabilization", region:"cervical", type:"stability", level:2,
 name:"Gaze Stabilization", rx:"3 x 20s each direction",
 desc:"Fix your eyes on a target on the wall and keep looking at it while turning the head slowly side to side, then up and down. The eyes stay locked on the target the whole time. Stop if it makes you dizzy.",
 targets:"Eye and neck coordination — often the missing piece where neck problems come with dizziness or visual strain"},
{id:"cervical-stab-eye-head-sequencing", region:"cervical", type:"stability", level:2,
 name:"Eye-Head Sequencing", rx:"3 x 6 each side",
 desc:"Look toward a target with the eyes only, hold the gaze, then bring the head around to line up with the eyes. Return the same way. Build it up: 45 degrees → full range → faster.",
 targets:"Restoring the normal order of eye-then-head movement"},
{id:"cervical-stab-head-repositioning", region:"cervical", type:"stability", level:2,
 name:"Head Repositioning", rx:"3 x 6 each direction",
 desc:"Sitting facing a wall, note your neutral head position. Close your eyes, turn the head to one side, then return to what you believe is neutral. Open your eyes and check. Build it up: rotation → side bend → forward and back.",
 targets:"Your sense of where the head actually is — measurably poor after neck injury and trainable"},
{id:"cervical-stab-quadruped-arm-lift", region:"cervical", type:"stability", level:3,
 name:"Quadruped Chin Tuck with Arm Lift", rx:"3 x 8 each side",
 desc:"On hands and knees with the neck set neutral, reach one arm forward without the head dropping or the chin poking. Build it up: arm reach → arm and opposite leg → hold 5 seconds.",
 targets:"Neck position held while the body is loaded and moving"},
{id:"cervical-stab-bear-hold", region:"cervical", type:"stability", level:3,
 name:"Bear Position Neck Hold", rx:"3 x 20s",
 desc:"Hands and toes with the knees hovering an inch off the floor, neck held in line with the spine. Hold and breathe. Build it up: 20 seconds → add slow shoulder taps.",
 targets:"Neck control under whole-body effort, where it is usually the first thing to go"},
{id:"cervical-stab-wall-angel-tuck", region:"cervical", type:"stability", level:2,
 name:"Wall Angel with Chin Tuck", rx:"3 x 10",
 desc:"Back against a wall, chin tucked so the head stays in contact. Slide the arms up and overhead keeping the head, arms and back on the wall. If the head lifts away, you have gone too far — stop there.",
 targets:"Neck and shoulder blade control together, in the overhead position"},
{id:"cervical-stab-submax-mid-range", region:"cervical", type:"stability", level:1,
 name:"Sub-maximal Mid-range Holds", rx:"5 x 5s, 20-30% effort",
 desc:"Very light isometric holds, around a quarter of your maximum, in the middle of your comfortable range. Deliberately easy. Build it up: 20% effort → 30% → longer holds, over weeks not days.",
 targets:"A safe entry point for a neck too irritable for anything else"},

/* ---------- SHOULDER MOBILITY ---------- */
{id:"shoulder-mob-cars", region:"shoulder", type:"mobility", level:2,
 name:"Shoulder CARs", rx:"3 slow circles each direction, each side",
 desc:"Trace the largest slow circle you can with the arm, keeping the ribs down and the rest of the body completely still. Build it up: standing with a small circle → full range → lying on your back so the floor stops you cheating → 30 seconds per circle.",
 targets:"Full shoulder range in every direction, and a good weekly self-check"},
{id:"shoulder-mob-pendulum", region:"shoulder", type:"mobility", level:1,
 name:"Pendulum Swings", rx:"2 x 30s each direction",
 desc:"Lean forward with the good hand on a table and let the sore arm hang completely loose. Shift your weight to swing the arm — forward and back, side to side, then circles. The arm muscles do nothing; your body creates the movement.",
 targets:"Gentle shoulder movement when the joint is too irritable for anything active"},
{id:"shoulder-mob-wall-walk", region:"shoulder", type:"mobility", level:1,
 name:"Wall Walk", rx:"2 x 8",
 desc:"Face a wall and walk the fingers up it as high as comfortable, then walk back down under control. Build it up: facing the wall → standing side-on to walk the arm out sideways → mark your height and chase it week to week.",
 targets:"Overhead reach, with the wall taking most of the arm's weight"},
{id:"shoulder-mob-sleeper-stretch", region:"shoulder", type:"mobility", level:2,
 name:"Sleeper Stretch", rx:"3 x 30s each side",
 desc:"Lie on the side to be stretched with that arm out in front at shoulder height and the elbow bent to 90 degrees. Use the top hand to press the forearm down toward the floor. Stop well short of any pinch at the front of the shoulder.",
 targets:"The back of the shoulder capsule — usually tight in anyone who throws or serves"},
{id:"shoulder-mob-cross-body", region:"shoulder", type:"mobility", level:1,
 name:"Cross-Body Stretch", rx:"3 x 30s each side",
 desc:"Bring one arm straight across the chest and use the other forearm to draw it closer. Keep the shoulder pressed down rather than letting it shrug toward the ear — that shrug is what makes this stretch feel like nothing.",
 targets:"Back of the shoulder and the outside of the shoulder blade"},
{id:"shoulder-mob-doorway-pec", region:"shoulder", type:"mobility", level:1,
 name:"Doorway Pec Stretch", rx:"3 x 30s at each height",
 desc:"Forearm on a doorframe, step through gently until you feel a stretch across the front of the chest. Do it at three elbow heights — below shoulder, at shoulder, and above shoulder — as each one targets a different part of the muscle.",
 targets:"Pectorals — the front-of-chest tightness that pulls the shoulders forward"},
{id:"shoulder-mob-lat-stretch", region:"shoulder", type:"mobility", level:1,
 name:"Kneeling Lat Stretch", rx:"3 x 45s",
 desc:"Kneel with forearms on a bench or chair, thumbs up, and sink the chest toward the floor. Build it up: both arms → one arm at a time → add a gentle side bend away from the arm → add a slow breath out at the end.",
 targets:"Lats — a major limiter of overhead reach that is often mistaken for a stiff shoulder"},
{id:"shoulder-mob-dowel-flexion", region:"shoulder", type:"mobility", level:1,
 name:"Dowel-Assisted Flexion", rx:"2 x 10",
 desc:"Lying on your back holding a dowel or broomstick in both hands, use the good arm to push the sore arm up overhead. Build it up: lying down → seated → standing → holding 5 seconds at the top.",
 targets:"Overhead range with the good arm doing the work — useful early or after surgery"},
{id:"shoulder-mob-dowel-er", region:"shoulder", type:"mobility", level:1,
 name:"Dowel-Assisted External Rotation", rx:"2 x 10 each side",
 desc:"Lying on your back, elbow tucked at your side and bent to 90 degrees, hold a dowel and use the good arm to push the sore forearm outward. Keep a rolled towel under the elbow so it stays at your side.",
 targets:"Outward shoulder rotation, assisted"},
{id:"shoulder-mob-towel-ir", region:"shoulder", type:"mobility", level:2,
 name:"Towel Internal Rotation Stretch", rx:"3 x 30s each side",
 desc:"Hold a towel behind your back, top hand over the shoulder and bottom hand at the low back. Use the top hand to draw the bottom hand gently up the spine. Build it up: mark where the bottom hand reaches and chase it over weeks.",
