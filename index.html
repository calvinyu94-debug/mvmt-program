/* ============================ STATE ============================ */
const LEVELS = {1:"Foundational", 2:"Intermediate", 3:"Advanced"};

/* Phase naming presets offered at setup. Names are editable afterwards. */
const PHASE_WORDS = {phase:"Phase", stage:"Stage", visit:"Visit", week:"Week"};

/* Frequency is a fixed list so nobody can type "daily" into a field that then
   renders "daily per week". */
const FREQ_OPTIONS = ["1x","2x","3x","4x","5x","6x","Daily","As needed"];

const clone = o => JSON.parse(JSON.stringify(o));

function uuid(){
  try{ if(window.crypto && crypto.randomUUID) return crypto.randomUUID(); }catch(err){}
  return "p-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,10);
}

function blankPhase(name){
  return {name:name||"Phase", timeframe:"", level:null, items:[], patientNote:"", dailyMods:"", practitionerNote:""};
}

function makeProgram(o){
  return {
    schemaVersion:2,
    id:uuid(),
    patient:o.patient||"",
    practitioner:o.practitioner||"",
    startDate:o.startDate||"",
    structure:o.structure==="single"?"single":"phased",
    phases:(o.names||["Phase 1"]).map(blankPhase),
    updatedAt:new Date().toISOString()
  };
}

/* The program being edited — null when none is open. */
let S = null;
/* View state. Deliberately kept off the program object so it never lands in a
   saved record or an export. */
let U = {view:"list", active:0};
/* maxLevel is the soft filter a phase's own level applies. It is a convenience,
   not a restriction, and any click on the Level chips clears it. */
let F = {region:"all", type:"all", level:"all", source:"all", q:"", maxLevel:null};
let listQuery = "";

/* The library the app actually works from is the built-in EX plus whatever the
   user has authored. EX itself is never touched — customs are a separate array
   merged on top of it, so nothing a user types can reach the shipped content.
   Everything downstream (filters, grouping, handout, both safety callouts)
   reads ALL and byId, never EX, so a custom entry behaves exactly like a
   built-in one without any of them knowing the difference. */
let CUSTOM = [];
let ALL = EX.slice();
const byId = {}; ALL.forEach(e=>byId[e.id]=e);
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const phase = ()=>S.phases[U.active];
const typeName = k=>(TYPES.find(t=>t.k===k)||{}).name || k;

/* A few drills belong to two regions at once — the scapular work is filed under
   thoracic but is shoulder-girdle material. alsoRegion cross-lists them without
   changing their id, so no migration is needed. */
/* alsoRegion takes one region or several — single leg balance is genuinely a
   knee and an ankle drill as well as a hip one. */
const regionsOf = x => x.alsoRegion
  ? [x.region].concat(Array.isArray(x.alsoRegion) ? x.alsoRegion : [x.alsoRegion])
  : [x.region];
/* Which region heading an exercise sits under right now. With no region filter
   it stays under its primary region, so nothing is ever listed twice. */
const displayRegion = x =>
  (F.region !== "all" && x.region !== F.region && regionsOf(x).indexOf(F.region) >= 0)
    ? F.region : x.region;
const regionLabel = k => (REGIONS.find(r=>r.k===k)||{}).name || k;
/* Cross-listings not already accounted for by the heading this row sits under. */
const alsoTag = x => {
  const extra = regionsOf(x).slice(1).filter(k => k !== displayRegion(x));
  return extra.length ? `<span class="tag">Also ${esc(extra.map(regionLabel).join(" / "))}</span>` : "";
};
const isSingle = ()=>!!S && S.structure==="single";

/* ============================ DATES & FORMATTING ============================ */
/* Everything here works on local calendar parts. Going through Date.toISOString
   would shift the day backwards for anyone west of UTC. */
const pad = n=>String(n).padStart(2,"0");
const MONTHS = ["January","February","March","April","May","June","July","August",
                "September","October","November","December"];

function isoLocal(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }

/* v1 stored the start date as free text. Anything a browser can parse becomes a
   real ISO date; anything it can't is reported rather than silently binned. */
function normalizeDate(v){
  const s = String(v==null?"":v).trim();
  if(!s) return "";
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d = new Date(s);
  if(isNaN(d.getTime())){ lostDate = s; return ""; }
  return isoLocal(d);
}

function prettyDate(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||"");
  if(!m) return "";
  return Number(m[3]) + " " + MONTHS[Number(m[2])-1] + " " + m[1];
}

function relTime(iso){
  const t = Date.parse(iso||"");
  if(isNaN(t)) return "";
  const secs = Math.max(0, (Date.now()-t)/1000);
  if(secs < 45) return "just now";
  const mins = secs/60;
  if(mins < 60){ const n=Math.round(mins); return n+(n===1?" min ago":" mins ago"); }
  const hrs = mins/60;
  if(hrs < 24){ const n=Math.round(hrs); return n+(n===1?" hour ago":" hours ago"); }
  const days = hrs/24;
  if(days < 30){ const n=Math.round(days); return n+(n===1?" day ago":" days ago"); }
  return prettyDate(isoLocal(new Date(t)));
}

function normalizeFreq(v){
  const s = String(v==null?"":v).trim();
  if(!s) return "";
  const m = s.match(/^([1-6])\s*x?$/i);
  if(m) return m[1]+"x";
  if(/^daily$/i.test(s)) return "Daily";
  if(/^as\s*needed$/i.test(s)) return "As needed";
  return s;   // unrecognised — kept verbatim rather than thrown away
}

function renderFreq(v){
  if(!v) return "";
  return /^[1-6]x$/.test(v) ? v+" per week" : v;
}

/* ============================ SCHEMA MIGRATION ============================ */
/* v1 kept a single program under rtt:program, using block/np/nr field names and
   short exercise ids. v2 keeps an array of programs under homecare:programs.
   Anything still speaking v1 — an old saved blob, or a .json exported by an
   earlier build — comes through migrate() first. */

let droppedOnMigrate = 0;
let lostDate = "";

function migrateItems(items){
  const out = [];
  (items||[]).forEach(it=>{
    if(!it) return;
    const raw = it.exerciseId || it.id;
    const id = LEGACY_ID_MAP[raw] || raw;
    /* An id we no longer recognise is dropped rather than left to blow up the
       renderer. The count is surfaced to the user, never swallowed. */
    if(!id || !byId[id]){ droppedOnMigrate++; return; }
    out.push({exerciseId:id, rx:it.rx||"", freq:normalizeFreq(it.freq), note:it.note||""});
  });
  return out;
}

/* Reshape a v1 program. Exercise ids are left alone here — normalize() remaps
   them, so exactly one place knows about LEGACY_ID_MAP. */
function fromV1(d){
  return {
    id: uuid(),
    patient: d.patient || "",
    practitioner: d.prac || "",
    startDate: d.date || "",
    structure: "phased",
    phases: (d.blocks||[]).map(b=>({
      name: b.name,
      timeframe: b.weeks,
      level: b.stage,
      items: b.items,
      patientNote: b.np,
      practitionerNote: b.nr
    }))
  };
}

function normalize(d){
  const p = {
    schemaVersion: 2,
    id: d.id || uuid(),
    patient: d.patient || "",
    practitioner: d.practitioner || "",
    startDate: normalizeDate(d.startDate),
    structure: d.structure === "single" ? "single" : "phased",
    phases: (Array.isArray(d.phases) ? d.phases : []).map((ph,i)=>({
      name: (ph && ph.name) || ("Phase " + (i+1)),
      timeframe: (ph && ph.timeframe) || "",
      /* level is optional now — only 1, 2 or 3 count as set. */
      level: [1,2,3].indexOf(Number(ph && ph.level)) >= 0 ? Number(ph.level) : null,
      items: migrateItems(ph && ph.items),
      patientNote: (ph && ph.patientNote) || "",
      dailyMods: (ph && ph.dailyMods) || "",
      practitionerNote: (ph && ph.practitionerNote) || ""
    })),
    updatedAt: d.updatedAt || new Date().toISOString()
  };
  if(!p.phases.length) p.phases = [blankPhase("Phase 1")];
  if(p.structure === "single") p.phases = p.phases.slice(0,1);
  return p;
}

/* Returns a v2 program, or null if this isn't a program at all. */
function migrate(d){
  droppedOnMigrate = 0;
  lostDate = "";
  if(!d || typeof d !== "object") return null;
  if(Array.isArray(d.phases)) return normalize(d);          // already v2
  if(Array.isArray(d.blocks)) return normalize(fromV1(d));  // v1
  return null;
}

function reportMigration(){
  if(droppedOnMigrate){
    toast(droppedOnMigrate===1
      ? "1 exercise in that program is no longer in the library and was left out."
      : droppedOnMigrate + " exercises in that program are no longer in the library and were left out.");
  }else if(lostDate){
    toast("Start date “"+lostDate+"” wasn't a date we could read, so it was left blank.");
  }
  return droppedOnMigrate || lostDate;
}

/* ============================ STORAGE ============================ */
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2600);
}

const KEYS = {
  programs: "homecare:programs",
  custom:   "homecare:custom",
  settings: "homecare:settings"
};
const LEGACY_KEY = "rtt:program";

/* Persistence. Plain localStorage — reading or writing it throws in private
   mode or when the quota is full, and every caller below treats that as
   "couldn't save" rather than letting it break the page. */
const storage = {
  set(key, value){
    localStorage.setItem(key, value);
    return true;
  },
  get(key){
    const value = localStorage.getItem(key);
    return value === null ? null : {value};
  }
};

function readJSON(key, fallback){
  try{
    const r = storage.get(key);
    if(!r || !r.value) return fallback;
    const d = JSON.parse(r.value);
    return d == null ? fallback : d;
  }catch(err){ return fallback; }
}
function writeJSON(key, value){
  try{ return storage.set(key, JSON.stringify(value)); }
  catch(err){ return false; }
}

function readPrograms(){
  const a = readJSON(KEYS.programs, []);
  return Array.isArray(a) ? a.filter(p=>p && p.id) : [];
}
function writePrograms(list){ return writeJSON(KEYS.programs, list); }
function readSettings(){
  const s = readJSON(KEYS.settings, {});
  return (s && typeof s === "object" && !Array.isArray(s)) ? s : {};
}
function writeSettings(patch){
  const st = Object.assign(readSettings(), patch);
  return writeJSON(KEYS.settings, st);
}

/* ---- autosave ---- */
let saveTimer = null;
let saveFailed = false;

/* Called after any edit. Debounced so typing doesn't hammer localStorage. */
function touch(){
  if(!S) return;
  S.updatedAt = new Date().toISOString();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ saveTimer=null; persist(false); }, 800);
  renderSaved();
}

function persist(announce){
  if(!S) return true;
  const list = readPrograms();
  const i = list.findIndex(p=>p.id===S.id);
  if(i>=0) list[i] = S; else list.push(S);

  const ok = writePrograms(list) && writeSettings({
    lastProgramId: S.id,
    practitioner: S.practitioner || readSettings().practitioner || ""
  });

  saveFailed = !ok;
  renderSaved();
  if(announce) toast(ok ? "Saved. It'll be here next time you open this."
                        : "Couldn't save in the browser — use Save file (.json) instead.");
  return ok;
}

/* A pending debounce must not be lost when the tab goes away. */
function flushSave(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; persist(false); }
}
window.addEventListener("pagehide", flushSave);
window.addEventListener("beforeunload", flushSave);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") flushSave(); });

function renderSaved(){
  const el = $("#savedAt");
  if(!S){ el.textContent=""; el.classList.remove("warn"); return; }
  if(saveFailed){ el.textContent="Not saved"; el.classList.add("warn"); return; }
  el.classList.remove("warn");
  el.textContent = saveTimer ? "Saving…" : "Saved · " + relTime(S.updatedAt);
}
setInterval(()=>{ if(S && !saveTimer && !saveFailed) renderSaved(); }, 30000);

/* ============================ CUSTOM EXERCISES ============================ */
/* Exercises the practitioner writes themselves. They are clinical IP, so they
   are held to the same durability bar as programs: stored under their own key,
   carried inside program exports, and exportable on their own. */

const TYPE_ABBR = {mobility:"mob", stability:"stab", nerve:"nrv"};
/* The library writes progressions as a "Build it up:" sentence inside desc, and
   the closing guidance gates its Progressing line on finding one. Assembling it
   here rather than asking the user to type it is the whole point of the
   separate Progression field — see the note in CLAUDE.md. */
const BUILD_SEP = "\nBuild it up: ";

function readCustom(){
  const a = readJSON(KEYS.custom, []);
  return Array.isArray(a) ? a.filter(isCustomExercise) : [];
}
function writeCustom(list){ return writeJSON(KEYS.custom, list); }

/* A record missing any field the renderers assume is not a usable exercise.
   Rejecting it here keeps a truncated or hand-edited blob out of byId. */
function isCustomExercise(x){
  return !!x && typeof x === "object"
    && typeof x.id === "string" && !!x.id
    && REGIONS.some(r=>r.k === x.region)
    && TYPES.some(t=>t.k === x.type)
    && [1,2,3].indexOf(Number(x.level)) >= 0
    && typeof x.name === "string" && !!x.name.trim()
    && typeof x.desc === "string" && !!x.desc.trim()
    && typeof x.targets === "string" && !!x.targets.trim();
}

/* Rebuilds the merged view after any change to the custom library. byId is
   repopulated in place because closures all over the file already hold it. */
function rebuildLibrary(){
  CUSTOM = readCustom();
  ALL = EX.concat(CUSTOM);
  Object.keys(byId).forEach(k=>delete byId[k]);
  ALL.forEach(e=>byId[e.id]=e);
}

/* desc is stored assembled so nothing downstream needs to know a custom entry
   is different. A blank progression writes no sentence, so the entry correctly
   does not count toward the Progressing line. */
function assembleDesc(description, progression){
  const d = String(description==null?"":description).trim();
  const p = String(progression==null?"":progression).trim();
  return p ? d + BUILD_SEP + p : d;
}
/* And back apart again, so the edit form round-trips. */
function splitDesc(desc){
  const s = String(desc==null?"":desc);
  const i = s.indexOf(BUILD_SEP);
  return i < 0 ? {description:s, progression:""}
               : {description:s.slice(0,i), progression:s.slice(i + BUILD_SEP.length)};
}

/* Ids go into HTML attributes and into saved programs, so anything arriving
   from a file is reduced to the characters a slug can contain. */
function safeId(v){
  return String(v==null?"":v).trim().replace(/[^\w-]/g,"").slice(0,120);
}
/* custom- prefixed and randomly suffixed: a user-typed name can never collide
   with a built-in id, nor with another custom entry of the same name. */
function customId(region, type, name){
  const stem = "custom-" + region + "-" + (TYPE_ABBR[type]||"ex") + "-" + (slug(name) || "exercise");
  return suffixId(stem, byId);
}
function suffixId(stem, taken){
  let out;
  do { out = stem + "-" + Math.random().toString(36).slice(2,6); } while(taken[out]);
  return out;
}

/* An alsoRegion of the primary region, or of something that isn't a region at
   all, is noise — drop it rather than let it reach regionsOf(). */
function normalizeAlso(v, primary){
  const out = [];
  (Array.isArray(v) ? v : [v]).forEach(k=>{
    const key = String(k==null?"":k).trim();
    if(!key || key === primary) return;
    if(!REGIONS.some(r=>r.k === key)) return;
    if(out.indexOf(key) < 0) out.push(key);
  });
  return out.length ? (out.length === 1 ? out[0] : out) : null;
}

/* Everything arriving from a file is rebuilt field by field rather than trusted
   wholesale, so an imported blob can't smuggle extra keys into the library the
   renderers read. Returns null for anything that isn't a usable exercise. */
function sanitizeCustom(raw){
  if(!raw || typeof raw !== "object") return null;
  const region = REGIONS.some(r=>r.k === raw.region) ? raw.region : "";
  const type   = TYPES.some(t=>t.k === raw.type) ? raw.type : "";
  const level  = [1,2,3].indexOf(Number(raw.level)) >= 0 ? Number(raw.level) : 0;
  const name    = String(raw.name==null?"":raw.name).trim();
  const targets = String(raw.targets==null?"":raw.targets).trim();
  let description = String(raw.description==null?"":raw.description).trim();
  let progression = String(raw.progression==null?"":raw.progression).trim();
  /* A file written by hand, or by an older build, may carry only the assembled
     desc. Split it so the two halves are editable again. */
  if(!description){
    const halves = splitDesc(String(raw.desc==null?"":raw.desc).trim());
    description = halves.description;
    if(!progression) progression = halves.progression;
  }
  const desc = assembleDesc(description, progression);
  if(!region || !type || !level || !name || !targets || !desc) return null;
  const x = {
    id: safeId(raw.id) || customId(region, type, name),
    region: region, type: type, level: level, name: name,
    desc: desc,
    description: description,
    progression: progression,
    targets: targets,
    rx: String(raw.rx==null?"":raw.rx).trim(),
    custom: true,
    createdAt: String(raw.createdAt||"") || new Date().toISOString(),
    updatedAt: String(raw.updatedAt||"") || new Date().toISOString()
  };
  const also = normalizeAlso(raw.alsoRegion, region);
  if(also) x.alsoRegion = also;
  return x;
}

const SAME_FIELDS = ["name","region","type","level","desc","targets","rx"];
function sameExercise(a, b){
  return SAME_FIELDS.every(f=>String(a[f]==null?"":a[f]) === String(b[f]==null?"":b[f]))
      && regionsOf(a).join("|") === regionsOf(b).join("|");
}

/* Merge incoming exercises into the custom library. An id already in use is
   never overwritten — the incoming entry is kept under a fresh id, and the
   caller remaps every reference to it. Re-importing a file you exported earlier
   is the common case and must not breed duplicates, so an identical entry under
   the same id is recognised as the same entry and skipped.
   Returns {added, renamed, skipped, map} — or null if the write failed. */
function mergeCustom(incoming){
  const list = readCustom();
  const taken = {};
  ALL.forEach(e=>taken[e.id] = true);
  list.forEach(e=>taken[e.id] = true);
  const map = {};
  let added = 0, renamed = 0, skipped = 0;
  (Array.isArray(incoming) ? incoming : []).forEach(raw=>{
    const x = sanitizeCustom(raw);
    if(!x) return;
    if(taken[x.id]){
      const existing = list.find(e=>e.id === x.id) || byId[x.id];
      if(existing && sameExercise(existing, x)){ skipped++; return; }
      const fresh = suffixId(x.id, taken);
      map[x.id] = fresh;
      x.id = fresh;
      renamed++;
    }
    taken[x.id] = true;
    list.push(x);
    added++;
  });
  if(added && !writeCustom(list)) return null;
  if(added) rebuildLibrary();
  return {added:added, renamed:renamed, skipped:skipped, map:map};
}

/* Applied to a file before migrate() sees it, so a suffixed import still points
   at the entry it arrived with. Handles both the v2 and the v1 item shapes. */
function remapIds(d, map){
  if(!d || typeof d !== "object" || !Object.keys(map).length) return d;
  const lists = [];
  (Array.isArray(d.phases) ? d.phases : []).forEach(ph=>{
    if(ph && Array.isArray(ph.items)) lists.push(ph.items);
  });
  (Array.isArray(d.blocks) ? d.blocks : []).forEach(b=>{
    if(b && Array.isArray(b.items)) lists.push(b.items);
  });
  lists.forEach(items=>items.forEach(it=>{
    if(!it) return;
    if(it.exerciseId && map[it.exerciseId]) it.exerciseId = map[it.exerciseId];
    else if(it.id && map[it.id]) it.id = map[it.id];
  }));
  return d;
}

/* The custom exercises a program references, so an export can carry them and
   land intact on a machine that has never seen them. */
function customUsedBy(p){
  const used = {};
  (Array.isArray(p && p.phases) ? p.phases : []).forEach(ph=>{
    (((ph && ph.items) || [])).forEach(it=>{ if(it && it.exerciseId) used[it.exerciseId] = true; });
  });
  return CUSTOM.filter(x=>used[x.id]);
}

/* Saved programs referencing an exercise, by patient name. Callers flushSave()
   first, or the open program's newest edits aren't counted. */
function programsUsing(id){
  return readPrograms().filter(p=>
    (Array.isArray(p.phases) ? p.phases : []).some(ph=>
      (((ph && ph.items) || [])).some(it=>it && (it.exerciseId || it.id) === id)))
    .map(p=>p.patient || "Unnamed patient");
}

function listNames(names){
  const q = names.map(n=>"“" + n + "”");
  if(q.length <= 2) return q.join(" and ");
  if(q.length === 3) return q.slice(0,2).join(", ") + " and " + q[2];
  return q.slice(0,2).join(", ") + " and " + (q.length-2) + " others";
}

/* ---- the add / edit form ---- */
function customForm(x){
  const val = f => esc(x ? (x[f]==null ? "" : x[f]) : "");
  const halves = x ? splitDesc(x.desc) : {description:"", progression:""};
  const description = x ? (x.description || halves.description) : "";
  const progression = x ? (x.progression || halves.progression) : "";
  const also = x ? ([].concat(x.alsoRegion || []).filter(Boolean)[0] || "") : "";
  const regionOptions = sel => REGIONS.map(r=>
    `<option value="${r.k}"${sel === r.k ? " selected" : ""}>${esc(r.name)}</option>`).join("");
  return `
    <p class="ferr" id="cxErr" hidden></p>
    <label><span class="lbl">Name</span>
      <input id="cxName" autocomplete="off" value="${val("name")}" placeholder="e.g. Scapular Wall Crawl"></label>
    <label><span class="lbl">Region</span>
      <select id="cxRegion">
        <option value="">Choose a region…</option>
        ${regionOptions(x ? x.region : "")}
      </select></label>
    <label><span class="lbl">Also region</span>
      <select id="cxAlso"><option value="">None</option>${regionOptions(also)}</select>
      <span class="fhint">Cross-lists it under a second region filter. Choosing Cervical will add the neck safety guidance to the patient's handout.</span></label>
    <label><span class="lbl">Type</span>
      <select id="cxType">${TYPES.map(t=>
        `<option value="${t.k}"${x && x.type === t.k ? " selected" : ""}>${esc(t.name)}</option>`).join("")}</select></label>
    <label><span class="lbl">Level</span>
      <select id="cxLevel">${[1,2,3].map(n=>
        `<option value="${n}"${x && Number(x.level) === n ? " selected" : ""}>${esc(LEVELS[n])}</option>`).join("")}</select></label>
    <label><span class="lbl">Description</span>
      <textarea id="cxDesc" placeholder="How the patient performs it. This is what they read on the handout.">${esc(description)}</textarea></label>
    <label><span class="lbl">Progression — optional</span>
      <textarea id="cxProg" placeholder="e.g. hold 10 seconds → hold 20 → add a band">${esc(progression)}</textarea>
      <span class="fhint">Prints as the exercise's stages, the same way the built-in library writes them. Leave it blank if there isn't a progression.</span></label>
    <label><span class="lbl">What it targets</span>
      <input id="cxTargets" autocomplete="off" value="${val("targets")}" placeholder="Prints as “What it's for:” on the handout"></label>
    <label><span class="lbl">Default sets &amp; reps — optional</span>
      <input id="cxRx" autocomplete="off" value="${val("rx")}" placeholder="e.g. 2 x 8 each side, slow"></label>`;
}

function readCustomForm(){
  return {
    name: $("#cxName").value.trim(),
    region: $("#cxRegion").value,
    also: $("#cxAlso").value,
    type: $("#cxType").value,
    level: Number($("#cxLevel").value),
    description: $("#cxDesc").value.trim(),
    progression: $("#cxProg").value.trim(),
    targets: $("#cxTargets").value.trim(),
    rx: $("#cxRx").value.trim()
  };
}

/* Checked in the order the fields appear, so the message points at the first
   thing the user needs to go back to. */
function customFormError(f){
  if(!f.name) return "Give the exercise a name.";
  if(!f.region) return "Choose a region — it decides where the exercise files and which safety guidance applies.";
  if(!f.description) return "Add a description. It's what the patient reads on the handout.";
  if(!f.targets) return "Add what it targets. It prints as “What it's for:” on the handout.";
  return "";
}
function showCustomError(msg){
  const el = $("#cxErr");
  if(!el) return;
  el.textContent = msg;
  el.hidden = !msg;
}

function addCustomFlow(){
  openModal("Add your own exercise", customForm(null), ()=>{
    const f = readCustomForm();
    const err = customFormError(f);
    if(err){ showCustomError(err); return false; }

    const x = {
      id: customId(f.region, f.type, f.name),
      region: f.region, type: f.type, level: f.level, name: f.name,
      desc: assembleDesc(f.description, f.progression),
      description: f.description, progression: f.progression,
      targets: f.targets, rx: f.rx,
      custom: true,
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };
    const also = normalizeAlso(f.also, f.region);
    if(also) x.alsoRegion = also;

    const list = readCustom();
    list.push(x);
    if(!writeCustom(list)){
      showCustomError("Couldn't save it in this browser. Export your exercises to a file instead.");
      return false;
    }
    rebuildLibrary();
    renderFilterChips();
    /* The reason anyone opens this form is that they want the exercise on the
       sheet in front of them, so put it there. */
    let placed = false;
    if(S && !phase().items.some(i=>i.exerciseId === x.id)){
      phase().items.push({exerciseId:x.id, rx:x.rx, freq:"", note:""});
      touch();
      placed = true;
    }
    renderAll();
    toast("Added “" + x.name + "” to your library"
      + (placed ? " and to this " + (isSingle() ? "handout" : "phase") : "") + ".");
  }, "Add exercise");
}

function editCustomFlow(id){
  const cur = CUSTOM.find(x=>x.id === id);
  if(!cur){ toast("That exercise is no longer in your library."); return; }
  openModal("Edit exercise", customForm(cur), ()=>{
    const f = readCustomForm();
    const err = customFormError(f);
    if(err){ showCustomError(err); return false; }

    const list = readCustom();
    const t = list.find(x=>x.id === id);
    if(!t){ showCustomError("That exercise is no longer in your library."); return false; }
    /* The id is deliberately left alone — saved programs point at it. */
    t.name = f.name; t.region = f.region; t.type = f.type; t.level = f.level;
    t.description = f.description; t.progression = f.progression;
    t.desc = assembleDesc(f.description, f.progression);
    t.targets = f.targets; t.rx = f.rx;
    const also = normalizeAlso(f.also, f.region);
    if(also) t.alsoRegion = also; else delete t.alsoRegion;
    t.updatedAt = new Date().toISOString();

    if(!writeCustom(list)){
      showCustomError("Couldn't save the change in this browser.");
      return false;
    }
    rebuildLibrary();
    renderFilterChips();
    renderAll();
    toast("Updated “" + f.name + "”.");
  }, "Save changes");
}

function deleteCustomFlow(id){
  const cur = CUSTOM.find(x=>x.id === id);
  if(!cur) return;
  /* Land any pending autosave first, or the open program's newest edits are
     missing from the list this warning is built from. */
  flushSave();
  const used = programsUsing(id);
  /* Dropping an unknown id with a toast on the next load is the right fallback,
     but finding out on a handout is not — so name the programs up front. */
  const msg = used.length
    ? "“" + cur.name + "” is used in " + listNames(used) + ". Deleting it takes it off "
      + (used.length === 1 ? "that program's handout" : "those programs' handouts")
      + " — the programs themselves are kept. This can't be undone."
    : "Delete “" + cur.name + "” from your library? This can't be undone.";
  confirmModal("Delete exercise", msg, ()=>{
    const list = readCustom().filter(x=>x.id !== id);
    if(!writeCustom(list)){ toast("Couldn't save that change."); return; }
    rebuildLibrary();
    /* The open program would otherwise hold an item pointing at nothing, which
       is the state migrate() clears on the next load anyway. Clear it now so
       the counts on screen stay honest. */
    if(S){
      let hit = 0;
      S.phases.forEach(ph=>{
        const before = ph.items.length;
        ph.items = ph.items.filter(i=>i.exerciseId !== id);
        hit += before - ph.items.length;
      });
      if(hit) touch();
    }
    /* A filter narrowed to something that no longer has content would show an
       empty library with no obvious way back. */
    if(F.region !== "all" && !ALL.some(x=>regionsOf(x).indexOf(F.region) >= 0)) F.region = "all";
    if(F.type !== "all" && !ALL.some(x=>x.type === F.type)) F.type = "all";
    if(!CUSTOM.length) F.source = "all";
    renderFilterChips();
    renderAll();
    toast("Deleted “" + cur.name + "”.");
  }, "Delete exercise");
}

/* ---- custom library files ---- */
function customAddedMsg(r){
  let m = r.added + (r.added === 1 ? " exercise added." : " exercises added.");
  if(r.renamed) m += " " + r.renamed + (r.renamed === 1
    ? " had an id you were already using and was kept as a separate entry."
    : " had ids you were already using and were kept as separate entries.");
  return m;
}

function importCustomFile(d){
  const list = Array.isArray(d) ? d
             : (d && Array.isArray(d.exercises)) ? d.exercises
             : (d && Array.isArray(d.customExercises)) ? d.customExercises
             : null;
  if(!list){ toast("That file isn't an exercise file."); return false; }
  const r = mergeCustom(list);
  if(!r){ toast("Couldn't save those exercises in this browser."); return false; }
  renderFilterChips();
  if(S && U.view !== "list") renderAll();
  toast(r.added ? customAddedMsg(r)
                : "Nothing new in that file — you already have those exercises.");
  return true;
}

rebuildLibrary();

/* ============================ MODAL ============================ */
let modalOk = null;

function openModal(title, bodyHtml, onOk, okLabel){
  $("#modalTitle").textContent = title;
  $("#modalBody").innerHTML = bodyHtml;
  $("#modalOk").textContent = okLabel || "Save";
  modalOk = onOk;
  $("#modal").hidden = false;
  const first = $("#modalBody").querySelector("input,select");
  if(first) setTimeout(()=>{ first.focus(); if(first.select) first.select(); }, 30);
}
function closeModal(){ $("#modal").hidden = true; modalOk = null; }

$("#modalCancel").onclick = closeModal;
$("#modalOk").onclick = ()=>{ if(modalOk && modalOk() === false) return; closeModal(); };
$("#modal").onclick = e=>{ if(e.target === $("#modal")) closeModal(); };
document.addEventListener("keydown", e=>{
  if(e.key === "Escape" && !$("#modal").hidden) closeModal();
  if(e.key === "Enter" && !$("#modal").hidden && e.target.tagName === "INPUT"){ $("#modalOk").click(); }
});

function confirmModal(title, message, onYes, yesLabel){
  openModal(title, `<p>${esc(message)}</p>`, ()=>{ onYes(); }, yesLabel || "Delete");
}

/* ============================ NEW PROGRAM SETUP ============================ */
function newProgramFlow(){
  const st = readSettings();
  openModal("New program", `
    <label><span class="lbl">Patient name</span><input id="suPatient" autocomplete="off"></label>
    <label><span class="lbl">Practitioner</span><input id="suPrac" value="${esc(st.practitioner||"")}" autocomplete="off"></label>
    <label><span class="lbl">Start date</span><input id="suDate" type="date"></label>
    <label><span class="lbl">Program structure</span>
      <select id="suStruct">
        <option value="single">Single handout</option>
        <option value="phased">Multi-phase program</option>
      </select></label>
    <div id="suPhased" style="display:none">
      <label><span class="lbl">Number of phases</span>
        <select id="suCount">${[2,3,4,5,6,7,8].map(n=>`<option value="${n}">${n}</option>`).join("")}</select></label>
      <label><span class="lbl">Phase naming</span>
        <select id="suNaming">
          <option value="phase">Phase 1, Phase 2, …</option>
          <option value="stage">Stage 1, Stage 2, …</option>
          <option value="visit">Visit 1, Visit 2, …</option>
          <option value="week">Week 1, Week 2, …</option>
          <option value="custom">Custom</option>
        </select></label>
      <div id="suCustom"></div>
    </div>
  `, createFromSetup, "Create program");

  const struct = $("#suStruct"), naming = $("#suNaming"), count = $("#suCount");
  const sync = ()=>{
    $("#suPhased").style.display = struct.value === "phased" ? "" : "none";
    const custom = struct.value === "phased" && naming.value === "custom";
    $("#suCustom").innerHTML = custom
      ? Array.from({length:+count.value}, (_,i)=>
          `<label><span class="lbl">Phase ${i+1} name</span><input class="suName" value="Phase ${i+1}"></label>`).join("")
      : "";
  };
  struct.onchange = sync; naming.onchange = sync; count.onchange = sync;
  sync();
}

function createFromSetup(){
  /* Whatever is open may have an unsaved debounce in flight — land it before
     S is replaced, or that last edit is lost. */
  flushSave();
  const structure = $("#suStruct").value;
  let names;
  if(structure === "single"){
    names = ["Program"];
  }else{
    const n = +$("#suCount").value;
    const naming = $("#suNaming").value;
    names = naming === "custom"
      ? [...document.querySelectorAll("#suCustom .suName")].map((el,i)=>el.value.trim() || ("Phase "+(i+1)))
      : Array.from({length:n}, (_,i)=>PHASE_WORDS[naming]+" "+(i+1));
  }
  S = makeProgram({
    patient: $("#suPatient").value.trim(),
    practitioner: $("#suPrac").value.trim(),
    startDate: $("#suDate").value,
    structure, names
  });
  U.active = 0;
  F.maxLevel = null;
  persist(false);
  syncHeader();
  setView("prac");
}

/* ============================ SAVED PROGRAMS LIST ============================ */
function programStats(p){
  const phases = Array.isArray(p.phases) ? p.phases : [];
  return {
    phases: phases.length,
    exercises: phases.reduce((n,ph)=>n + (((ph&&ph.items)||[]).length), 0)
  };
}

function renderList(){
  const all = readPrograms().slice().sort((a,b)=>
    String(b.updatedAt||"").localeCompare(String(a.updatedAt||"")));
  const q = listQuery.trim().toLowerCase();
  const list = q ? all.filter(p=>String(p.patient||"").toLowerCase().includes(q)) : all;

  $("#lCount").textContent = all.length
    ? (q ? list.length+" of "+all.length : all.length + (all.length===1?" program":" programs"))
    : "";

  if(!all.length){
    $("#plist").innerHTML = `<div class="empty">
      <b>No programs yet</b>Create one to get started.
      <div style="margin-top:14px"><button class="pbtn" id="emptyNew">New program</button></div>
    </div>`;
    $("#emptyNew").onclick = newProgramFlow;
    return;
  }
  if(!list.length){
    $("#plist").innerHTML = `<div class="empty"><b>Nothing matches</b>No patient name contains “${esc(listQuery)}”.</div>`;
    return;
  }

  $("#plist").innerHTML = list.map(p=>{
    const s = programStats(p);
    const open = S && S.id === p.id;
    return `<div class="prow" data-id="${esc(p.id)}">
      <div class="pnm">${p.patient ? esc(p.patient) : `<span class="anon">Unnamed patient</span>`}</div>
      <div class="pmeta">
        <span>${p.structure==="single" ? "Single handout" : s.phases+(s.phases===1?" phase":" phases")}</span>
        <span>${s.exercises} exercise${s.exercises===1?"":"s"}</span>
        <span>${esc(relTime(p.updatedAt))}</span>
        ${open?`<span>· open</span>`:""}
      </div>
      <div class="pacts">
        <button class="pbtn" data-a="open">Open</button>
        <button class="pbtn" data-a="print">Print handout</button>
        <button class="pbtn" data-a="dup">Duplicate</button>
        <button class="pbtn" data-a="ren">Rename</button>
        <button class="pbtn danger" data-a="del">Delete</button>
      </div>
    </div>`;
  }).join("");

  $("#plist").onclick = e=>{
    const btn = e.target.closest("[data-a]"); if(!btn) return;
    const id = e.target.closest(".prow").dataset.id;
    const action = btn.dataset.a;
    if(action === "open")  openProgram(id);
    if(action === "print") printProgram(id);
    if(action === "dup")   duplicateProgram(id);
    if(action === "ren")   renameProgram(id);
    if(action === "del")   deleteProgram(id);
  };
}

function loadProgram(id){
  const raw = readPrograms().find(p=>p.id === id);
  if(!raw) return null;
  const p = migrate(raw);
  if(p) p.id = raw.id;   // migrate() would mint a new id if the record lacked one
  return p;
}

function openProgram(id){
  flushSave();
  const p = loadProgram(id);
  if(!p){ toast("That program couldn't be opened."); return; }
  S = p; U.active = 0; F.maxLevel = null;
  reportMigration();
  writeSettings({lastProgramId: S.id});
  syncHeader();
  setView("prac");
}

function printProgram(id){
  flushSave();
  const p = loadProgram(id);
  if(!p){ toast("That program couldn't be opened."); return; }
  S = p; U.active = 0; F.maxLevel = null;
  syncHeader();
  setView("pat");
  /* Give the handout a paint before the print dialog steals the thread. */
  setTimeout(printCurrent, 80);
}

function duplicateProgram(id){
  flushSave();
  const raw = readPrograms().find(p=>p.id === id);
  if(!raw) return;
  const copy = clone(raw);
  copy.id = uuid();
  copy.patient = (raw.patient ? raw.patient : "Unnamed patient") + " (copy)";
  copy.updatedAt = new Date().toISOString();
  const list = readPrograms();
  list.push(copy);
  if(writePrograms(list)) toast("Duplicated.");
  else toast("Couldn't save the duplicate.");
  renderList();
}

function renameProgram(id){
  flushSave();
  const raw = readPrograms().find(p=>p.id === id);
  if(!raw) return;
  openModal("Rename program",
    `<label><span class="lbl">Patient name</span><input id="rnName" value="${esc(raw.patient||"")}"></label>`,
    ()=>{
      const name = $("#rnName").value.trim();
      const list = readPrograms();
      const t = list.find(p=>p.id === id);
      if(!t) return;
      t.patient = name;
      t.updatedAt = new Date().toISOString();
      writePrograms(list);
      if(S && S.id === id){ S.patient = name; S.updatedAt = t.updatedAt; syncHeader(); }
      renderList();
    }, "Rename");
}

function deleteProgram(id){
  flushSave();
  const raw = readPrograms().find(p=>p.id === id);
  if(!raw) return;
  const label = raw.patient || "this unnamed program";
  confirmModal("Delete program", "Delete " + label + "? This can't be undone.", ()=>{
    const list = readPrograms().filter(p=>p.id !== id);
    writePrograms(list);
    if(S && S.id === id){
      /* The open program just went away — drop back to the list rather than
         editing a record that no longer exists. */
      clearTimeout(saveTimer); saveTimer = null;
      S = null;
      writeSettings({lastProgramId: ""});
      syncHeader();
      setView("list");
    }
    toast("Deleted.");
    renderList();
  });
}

$("#lSearch").oninput = e=>{ listQuery = e.target.value; renderList(); };
$("#bNew").onclick = newProgramFlow;

/* ============================ FILTERS UI ============================ */
function chips(el, opts, key){
  el.innerHTML = opts.map(o=>
    `<button class="chip" data-v="${o.v}" aria-pressed="${F[key]===o.v}">${o.l}</button>`).join("");
  el.onclick = e=>{
    const b=e.target.closest(".chip"); if(!b) return;
    F[key]=b.dataset.v;
    /* Touching the level chips means the user is steering — drop the phase's
       automatic narrowing. */
    if(key === "level") F.maxLevel = null;
    chips(el,opts,key); renderLib();
  };
}
/* Only offer a region or type that actually has something in it, so the regions
   waiting on content show up as nothing rather than as an empty filter. A custom
   exercise can be the thing that puts content into one, so these are recomputed
   whenever the custom library changes rather than fixed at load. */
function regionOptsNow(){
  return [{v:"all",l:"All"}].concat(
    REGIONS.filter(r=>ALL.some(x=>regionsOf(x).indexOf(r.k) >= 0)).map(r=>({v:r.k, l:r.name})));
}
function typeOptsNow(){
  return [{v:"all",l:"All"}].concat(
    TYPES.filter(t=>ALL.some(x=>x.type===t.k)).map(t=>({v:t.k, l:t.name})));
}
const levelOpts = [{v:"all",l:"All"},{v:"1",l:"1"},{v:"2",l:"2"},{v:"3",l:"3"}];

/* The legend mirrors whatever the library actually contains. Hardcoding it meant
   it still listed three regions long after there were eight. */
function renderLegend(){
  $("#legend").innerHTML =
    REGIONS.filter(r=>ALL.some(x=>regionsOf(x).indexOf(r.k) >= 0))
      .map(r=>`<span><i class="dot" style="background:var(--r-${r.k})"></i> ${esc(r.name)}</span>`)
      .join("")
    + `<span>· Level shows the earliest point in a program an exercise is appropriate.</span>`;
}

function renderFilterChips(){
  chips($("#fRegion"), regionOptsNow(), "region");
  chips($("#fType"),   typeOptsNow(), "type");
  chips($("#fLevel"),  levelOpts, "level");
  /* A few custom entries are unfindable among 281 built-ins without this — but
     the filter is noise until there is something to filter down to. */
  $("#fSourceGroup").style.display = CUSTOM.length ? "" : "none";
  chips($("#fSource"), [{v:"all",l:"All"},{v:"custom",l:"Custom only"}], "source");
  renderLegend();
}
renderFilterChips();
$("#fSearch").oninput = e=>{F.q=e.target.value.toLowerCase(); renderLib();};

/* ============================ RENDER: TABS ============================ */
function renderTabs(){
  if(isSingle()) return;
  $("#tabs").innerHTML = S.phases.map((ph,i)=>`
    <button class="blocktab" role="tab" aria-selected="${i===U.active}" data-i="${i}">
      ${ph.level?`<span class="st st${ph.level}">${esc(LEVELS[ph.level])}</span>`:`<span class="st">&nbsp;</span>`}
      <span class="nm">${esc(ph.name)}</span>
      <span class="wk">${esc(ph.timeframe)}</span>
      <span class="ct">${ph.items.length} exercise${ph.items.length===1?"":"s"}</span>
    </button>`).join("")
    + `<button class="addphase" id="addPhase" title="Add a phase">+ Add phase</button>`;

  $("#tabs").onclick = e=>{
    if(e.target.closest("#addPhase")){ addPhase(); return; }
    const t=e.target.closest(".blocktab"); if(!t) return;
    setActivePhase(+t.dataset.i);
  };
}

function setActivePhase(i){
  U.active = i;
  applyPhaseLevel();
  renderAll();
}

/* A phase level pre-narrows the library to that level and below. */
function applyPhaseLevel(){
  F.maxLevel = (S && phase() && phase().level) ? phase().level : null;
  F.level = "all";
  chips($("#fLevel"), levelOpts, "level");
}

function addPhase(){
  S.phases.push(blankPhase("Phase " + (S.phases.length+1)));
  U.active = S.phases.length - 1;
  applyPhaseLevel();
  touch(); renderAll();
}

function deletePhase(i){
  const ph = S.phases[i];
  const go = ()=>{
    S.phases.splice(i,1);
    if(!S.phases.length) S.phases.push(blankPhase("Phase 1"));
    if(U.active >= S.phases.length) U.active = S.phases.length-1;
    applyPhaseLevel();
    touch(); renderAll();
  };
  if(ph.items.length){
    confirmModal("Delete phase",
      "“"+ph.name+"” has "+ph.items.length+" exercise"+(ph.items.length===1?"":"s")+". This can't be undone.",
      go, "Delete phase");
  }else go();
}

function movePhase(i, d){
  const j = i + d;
  if(j < 0 || j >= S.phases.length) return;
  const [x] = S.phases.splice(i,1);
  S.phases.splice(j,0,x);
  U.active = j;
  touch(); renderAll();
}

/* ============================ RENDER: LIBRARY ============================ */
function passes(x){
  if(F.source==="custom" && !x.custom) return false;
  if(F.region!=="all" && regionsOf(x).indexOf(F.region) < 0) return false;
  if(F.type!=="all" && x.type!==F.type) return false;
  if(F.level!=="all" && String(x.level)!==F.level) return false;
  if(F.maxLevel && x.level > F.maxLevel) return false;
  if(F.q && !(x.name+" "+x.targets+" "+x.desc).toLowerCase().includes(F.q)) return false;
  return true;
}

function renderLibHint(){
  const el = $("#libHint");
  if(!F.maxLevel){ el.innerHTML = ""; return; }
  el.innerHTML = `<div class="hintbar">
    Showing ${esc(LEVELS[F.maxLevel])} and below, to match this phase.
    <button id="clearMax">Show all levels</button></div>`;
  $("#clearMax").onclick = ()=>{ F.maxLevel = null; renderLib(); };
}

function renderLib(){
  renderLibHint();
  const chosen = new Set(phase().items.map(i=>i.exerciseId));
  const list = ALL.filter(passes);
  $("#libCount").textContent = list.length + " shown of " + ALL.length;

  let html = "";
  REGIONS.forEach(r=>{
    TYPES.forEach(t=>{
      const g = list.filter(x=>displayRegion(x)===r.k && x.type===t.k);
      if(!g.length) return;
      html += `<div class="grp"><span class="lbl">${esc(r.name)} — ${esc(t.name)} · ${g.length}</span></div>`;
      html += g.map(x=>`
        <label class="ex ${displayRegion(x)} ${chosen.has(x.id)?"on":""}">
          <input type="checkbox" data-id="${esc(x.id)}" ${chosen.has(x.id)?"checked":""}>
          <span class="ex-body">
            <span class="ex-hd">
              <span class="ex-nm">${esc(x.name)}</span>
              <span class="tag stage">${esc(LEVELS[x.level])}</span>
              <span class="tag">${esc(typeName(x.type))}</span>
              ${alsoTag(x)}
              ${x.custom?`<span class="tag custom">Custom</span>
              <span class="ex-acts no-print">
                <button type="button" data-cx="edit" data-id="${esc(x.id)}">Edit</button>
                <button type="button" data-cx="del" class="danger" data-id="${esc(x.id)}">Delete</button>
              </span>`:""}
            </span>
            <span class="ex-d">${esc(x.desc)}</span>
            <span class="ex-t">Targets: ${esc(x.targets)}</span>
          </span>
        </label>`).join("");
    });
  });
  if(!html) html = `<div class="empty"><b>Nothing matches</b>Widen a filter or clear the search box.</div>`;
  $("#lib").innerHTML = html;

  /* The row is a <label>, so a click anywhere in it toggles the checkbox —
     including on these buttons unless the default is stopped. */
  $("#lib").onclick = e=>{
    const b = e.target.closest("[data-cx]"); if(!b) return;
    e.preventDefault(); e.stopPropagation();
    if(b.dataset.cx === "edit") editCustomFlow(b.dataset.id);
    else deleteCustomFlow(b.dataset.id);
  };

  $("#lib").onchange = e=>{
    const cb = e.target; if(cb.type!=="checkbox") return;
    const id = cb.dataset.id, ph = phase();
    if(cb.checked){
      if(!ph.items.some(i=>i.exerciseId===id)) ph.items.push({exerciseId:id, rx:byId[id].rx, freq:"", note:""});
    } else {
      ph.items = ph.items.filter(i=>i.exerciseId!==id);
    }
    touch(); renderAll();
  };
}

/* ============================ RENDER: PHASE META + ASSIGNED ============================ */
function renderMeta(){
  const ph = phase();
  const single = isSingle();
  $("#asgTitle").textContent = single ? "This handout" : "This phase";
  $("#bmeta").innerHTML = `
    ${single?"":`<label><span class="lbl">Phase name</span><input class="nm" id="mName" value="${esc(ph.name)}"></label>`}
    <label><span class="lbl">Timeframe</span><input class="wk" id="mWeeks" value="${esc(ph.timeframe)}" placeholder="e.g. Weeks 1-3"></label>
    <label><span class="lbl">Level</span>
      <select id="mLevel">
        <option value=""${ph.level?"":" selected"}>No level set</option>
        ${[1,2,3].map(n=>`<option value="${n}"${ph.level===n?" selected":""}>${esc(LEVELS[n])}</option>`).join("")}
      </select></label>
    ${single?"":`<div class="pctl">
      <button class="pbtn" id="mLeft" ${U.active===0?"disabled":""} title="Move this phase earlier">← Earlier</button>
      <button class="pbtn" id="mRight" ${U.active===S.phases.length-1?"disabled":""} title="Move this phase later">Later →</button>
      <button class="pbtn danger" id="mDel" title="Delete this phase">Delete phase</button>
    </div>`}`;

  if(!single){
    $("#mName").oninput = e=>{ph.name=e.target.value; touch(); renderTabs();};
    $("#mLeft").onclick  = ()=>movePhase(U.active,-1);
    $("#mRight").onclick = ()=>movePhase(U.active, 1);
    $("#mDel").onclick   = ()=>deletePhase(U.active);
  }
  $("#mWeeks").oninput = e=>{ph.timeframe=e.target.value; touch(); renderTabs();};
  $("#mLevel").onchange = e=>{
    ph.level = e.target.value ? +e.target.value : null;
    applyPhaseLevel();
    touch(); renderAll();
  };

function freqOptionsFor(cur){
  const opts = FREQ_OPTIONS.slice();
  /* Keep an imported value we don't recognise, rather than silently resetting it. */
  if(cur && opts.indexOf(cur) < 0) opts.unshift(cur);
  return opts;
}

function renderAsg(){
  const ph = phase();
  $("#asgCount").textContent = ph.items.length + " selected";
  if(!ph.items.length){
    $("#asg").innerHTML = `<div class="empty"><b>No exercises yet</b>Tick anything in the library to add it${isSingle()?"":" to "+esc(ph.name)}.</div>`;
    return;
  }
  $("#asg").innerHTML = ph.items.map((it,i)=>{
    const x = byId[it.exerciseId];
    if(!x) return "";
    return `<div class="acard ${x.region}">
      <div class="acard-hd">
        <span class="num">${i+1}</span>
        <span class="ex-nm">${esc(x.name)}</span>
        <span class="tag stage">${esc(LEVELS[x.level])}</span>
        <span class="tag">${esc(typeName(x.type))}</span>
        <button class="rm" data-rm="${x.id}">Remove</button>
      </div>
      <div class="rx">
        <label><span class="lbl">Sets &amp; reps</span><input data-f="rx" data-id="${x.id}" value="${esc(it.rx)}"></label>
        <label><span class="lbl">Frequency</span>
          <select data-f="freq" data-id="${x.id}">
            <option value=""></option>
            ${freqOptionsFor(it.freq).map(o=>`<option value="${esc(o)}"${it.freq===o?" selected":""}>${esc(o)}</option>`).join("")}
          </select></label>
        <label class="grow"><span class="lbl">Cue or note for this exercise</span><input class="wide" data-f="note" data-id="${x.id}" value="${esc(it.note)}" placeholder="e.g. keep ribs down, stop if it pinches at the front"></label>
      </div>
    </div>`;
  }).join("");

  $("#asg").onclick = e=>{
    const r = e.target.closest("[data-rm]"); if(!r) return;
    ph.items = ph.items.filter(i=>i.exerciseId!==r.dataset.rm);
    touch(); renderAll();
  };
  const edit = e=>{
    const f = e.target.dataset.f; if(!f) return;
    const it = ph.items.find(i=>i.exerciseId===e.target.dataset.id);
    if(!it) return;
    it[f] = e.target.value;
    touch();
    if(f === "freq") renderTabs();
  };
  $("#asg").oninput = edit;
  $("#asg").onchange = edit;
}

/* ============================ RENDER: PATIENT COPY ============================ */
function renderPatient(){
  const ph = phase();
  const known = ph.items.filter(i=>byId[i.exerciseId]);
  /* Mobility always prints before stability. Nerve glides sit between the two:
     they are low-load and symptom-limited, so they belong before the patient is
     tired from strength work, but after the mobility that opens the range. */
  const mob   = known.filter(i=>byId[i.exerciseId].type==="mobility");
  const nerve = known.filter(i=>byId[i.exerciseId].type==="nerve");
  const stab  = known.filter(i=>byId[i.exerciseId].type==="stability");

  const card = (it,n)=>{
    const x = byId[it.exerciseId];
    const freq = renderFreq(it.freq);
    return `<div class="pex">
      <div class="pnum">${n}</div>
      <div style="flex:1">
        <h4>${esc(x.name)}</h4>
        <div class="pd">${esc(x.desc)}</div>
        <div class="pt">What it's for: ${esc(x.targets)}</div>
        ${it.rx||freq?`<div class="prx">${esc(it.rx)}${it.rx&&freq?" &nbsp;·&nbsp; ":""}${esc(freq)}</div>`:""}
        ${it.note?`<div class="pn">${esc(it.note)}</div>`:""}
      </div>
    </div>`;
  };

  /* Parts are numbered by what is actually present, so a handout with no nerve
     work never shows a gap in the numbering. */
  let n = 0, part = 0;
  const section = (items, title) => items.length
    ? `<div class="sheet-sec"><h3>Part ${++part} — ${title}</h3>${items.map(i=>card(i,++n)).join("")}</div>`
    : "";
  /* "do these first" only says something when there is a second part to be
     before. On a mobility-only sheet it points at nothing. */
  const multiPart = [mob, nerve, stab].filter(s=>s.length).length > 1;
  const secMob   = section(mob,   "Mobility" + (multiPart ? " (do these first)" : ""));
  const secNerve = section(nerve, "Nerve glides (small doses)");
  const secStab  = section(stab,  "Stability &amp; strength");

  /* Prescribed for this patient, not generic guidance, so it sits with the parts
     rather than in the callout stack. Always last, taking the next part number
     off the same counter — which one that is depends on what precedes it. It
     holds no numbered items, so the running exercise count is untouched. */
  const secDaily = ph.dailyMods
    ? `<div class="sheet-sec"><h3>Part ${++part} — Daily modifications</h3>
        <div class="modtext"><p>${esc(ph.dailyMods).replace(/\n/g,"</p><p>")}</p></div></div>`
    : "";

  /* Every line of the closing guidance has to be true of the sheet it prints on.
     The ordering line assumes both mobility and stability work are present — on a
     sheet of nerve glides alone it referred to exercises the patient did not have. */
  /* The library writes progressions as "Build it up: …" inside desc. If nothing
     prescribed has one, the progressing line sends the patient looking for stages
     that are not there — and on nerve glides, inventing their own is the exact
     failure the safety callout exists to prevent. */
  const hasProgressions = known.some(i => byId[i.exerciseId].desc.includes("Build it up"));

  const guidance = []
    .concat(mob.length && stab.length
      ? [`<p><strong>Mobility first, then strength.</strong> The mobility work opens the range; the stability work teaches you to hold it. Doing it in the other order wastes both.</p>`]
      : [])
    .concat([
      `<p><strong>Where you should feel it.</strong> A stretch or a working muscle is fine. Sharp, pinching, or nerve-like pain is not — back off that exercise and tell me at the next appointment.</p>`
    ])
    .concat(hasProgressions
      ? [`<p><strong>Progressing.</strong> Each exercise has stages built into the description. Move to the next stage only once the current one feels controlled and easy for all your reps.</p>`]
      : [])
    .concat([
      `<p><strong>Consistency beats intensity.</strong> Short and frequent beats long and occasional every time.</p>`
    ]);
  /* Nothing prescribed means nothing to give guidance about. */
  const howToRun = known.length ? `
      <div class="callout">
        <span class="lbl">How to run this program</span>
        ${guidance.join("\n        ")}
      </div>` : "";

  /* Region and type safety callouts. Neither is optional or dismissible: if the
     phase contains the work, the handout carries its rules. Where a phase has
     both, cervical prints first and nerve second — see the render order below. */
  const hasCervical = known.some(i=>regionsOf(byId[i.exerciseId]).indexOf("cervical") >= 0);
  const cervicalCallout = hasCervical ? `
      <div class="callout safety">
        <span class="lbl">About the neck exercises</span>
        <ul>
          <li>Stay within a range that feels comfortable. Neck work is deliberately low effort — pushing harder does not speed it up.</li>
          <li>Mild muscle fatigue or a stretching feeling is fine. Sharp pain, or symptoms spreading into both arms, is not.</li>
          <li>Stop and contact me if any of these happen during or after: dizziness, light-headedness, changes in your vision, nausea, or trouble speaking or swallowing.</li>
        </ul>
      </div>` : "";

  const nerveCallout = nerve.length ? `
      <div class="callout safety">
        <span class="lbl">About the nerve glides</span>
        <p>These are different from stretching. You are moving a nerve, not lengthening a muscle, so the dose is deliberately small.</p>
        <ul>
          <li>Move smoothly and stop at the first hint of symptoms — do not push into tingling, numbness or burning.</li>
          <li>Any symptoms you provoke should settle within seconds of stopping. If they linger, you did too many.</li>
          <li>Fewer is better. A handful of slow repetitions is a full dose.</li>
          <li>Stop and tell me if symptoms start travelling <strong>further down</strong> the limb than before.</li>
        </ul>
      </div>` : "";

  /* Daily modifications alone is still a sheet with something on it. */
  const empty = (!known.length && !ph.dailyMods)
    ? `<div class="empty" style="padding:60px 40px"><b>Nothing assigned yet</b>Switch to Build and tick some exercises.</div>`
    : "";

  const single = isSingle();
  /* Eyebrow is built from what actually exists — no invented level copy. */
  const eyebrow = ["MVMT Program"].concat(ph.level ? [LEVELS[ph.level]] : []).join(" · ");
  const heading = single ? (S.patient || "Home program") : ph.name;

  $("#patientView").innerHTML = `
    <div class="sheet">
      <div class="sheet-hd">
        <div class="eyebrow">${esc(eyebrow)}</div>
        <h1>${esc(heading)}</h1>
        <div class="sheet-meta">
          ${S.patient && !single?`<div><span class="lbl">Patient</span><strong>${esc(S.patient)}</strong></div>`:""}
          ${S.practitioner?`<div><span class="lbl">Practitioner</span><strong>${esc(S.practitioner)}</strong></div>`:""}
          ${S.startDate?`<div><span class="lbl">Started</span><strong>${esc(prettyDate(S.startDate))}</strong></div>`:""}
          ${ph.timeframe?`<div><span class="lbl">Timeframe</span><strong>${esc(ph.timeframe)}</strong></div>`:""}
          <div><span class="lbl">Exercises</span><strong>${known.length}</strong></div>
        </div>
      </div>
      ${empty}
      ${secMob}${secNerve}${secStab}${secDaily}
      ${cervicalCallout}${nerveCallout}
      ${ph.patientNote?`<div class="callout"><span class="lbl">Notes from your therapist</span><p>${esc(ph.patientNote).replace(/\n/g,"</p><p>")}</p></div>`:""}
      ${howToRun}
      <div class="sheet-foot">
        Prepared${S.practitioner?" by "+esc(S.practitioner):""} for ${single?"you":"this phase only"}. Bring this sheet to your next appointment so we can progress it.
      </div>
    </div>`;
}

/* ============================ VIEW SWITCH / RENDER ALL ============================ */
function setView(v){
  /* Build and Patient copy need a program; without one there is only the list. */
  if(v !== "list" && !S) v = "list";
  U.view = v;
  $("#vList").setAttribute("aria-pressed", v==="list");
  $("#vPrac").setAttribute("aria-pressed", v==="prac");
  $("#vPat").setAttribute("aria-pressed", v==="pat");
  $("#listView").style.display    = v==="list" ? "" : "none";
  $("#buildView").style.display   = v==="prac" ? "" : "none";
  $("#patientView").style.display = v==="pat"  ? "" : "none";

  /* Header and phase chrome only make sense with a program open, and the phase
     bar only when there is more than one phase to move between. */
  $("#who").style.display    = (v!=="list" && S) ? "" : "none";
  $("#legend").style.display = v==="prac" ? "" : "none";
  $("#courtWrap").style.display = (v!=="list" && S && !isSingle()) ? "" : "none";
  ["bSave","bBackup","bPrint"].forEach(id=>{
    $("#"+id).style.display = S ? "" : "none";
  });
  $("#vPrac").disabled = !S;
  $("#vPat").disabled = !S;

  renderSaved();
  if(v === "list") renderList();
  else renderAll();
}

$("#vList").onclick = ()=>setView("list");
$("#vPrac").onclick = ()=>setView("prac");
$("#vPat").onclick  = ()=>setView("pat");

function renderAll(){
  if(!S) return;
  if(U.active >= S.phases.length) U.active = 0;
  renderTabs(); renderMeta(); renderLib(); renderAsg();
  const ph = phase();
  $("#nPatient").value = ph.patientNote;
  $("#nDaily").value = ph.dailyMods;
  $("#nPrac").value = ph.practitionerNote;
  if(U.view==="pat") renderPatient();
}

function syncHeader(){
  $("#fPatient").value = S ? S.patient : "";
  $("#fPrac").value    = S ? S.practitioner : "";
  $("#fDate").value    = S ? S.startDate : "";
}

$("#nPatient").oninput = e=>{phase().patientNote = e.target.value; touch();};
$("#nDaily").oninput = e=>{phase().dailyMods = e.target.value; touch();};
$("#nPrac").oninput = e=>{phase().practitionerNote = e.target.value; touch();};
["fPatient","fPrac","fDate"].forEach((id,i)=>{
  const k = ["patient","practitioner","startDate"][i];
  $("#"+id).oninput = e=>{ if(!S) return; S[k]=e.target.value; touch(); };
});

$("#bSave").onclick = ()=>{ clearTimeout(saveTimer); saveTimer=null; persist(true); };

/* ============================ FILE / PRINT ============================ */
const slug = s=>String(s||"").trim().replace(/[^\w-]+/g,"-").replace(/^-+|-+$/g,"").toLowerCase();

function printCurrent(){
  if(!S) return;
  const orig = document.title;
  // Browsers use the page title as the default PDF filename.
  document.title = [slug(S.patient)||"program",
                    isSingle() ? "" : slug(phase().name),
                    U.view==="pat" ? "patient" : "practitioner"]
                     .filter(Boolean).join("-");
  window.print();
  setTimeout(()=>{document.title = orig;}, 800);
}
$("#bPrint").onclick = printCurrent;

$("#bBackup").onclick = ()=>{
  if(!S) return;
  S.updatedAt = new Date().toISOString();
  /* Any custom exercises the program uses travel with it, so the file still
     builds the same handout on a machine that has never seen them. The key is
     attached to a copy — normalize() doesn't carry it, and it has no business
     in the stored record. */
  const carried = customUsedBy(S);
  const out = carried.length ? Object.assign({}, S, {customExercises:carried}) : S;
  const blob = new Blob([JSON.stringify(out,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (slug(S.patient)||"program")+"-program.json";
  a.click(); URL.revokeObjectURL(a.href);
  toast("Program file saved. Reload it any time with Open file.");
};

$("#bOpen").onclick = ()=>$("#fFile").click();
$("#fFile").onchange = e=>{
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      const d = JSON.parse(rd.result);
      /* A file of exercises on its own is a reasonable thing to open here too. */
      if(d && !Array.isArray(d.phases) && !Array.isArray(d.blocks)
           && (Array.isArray(d.exercises) || Array.isArray(d.customExercises))){
        importCustomFile(d);
        e.target.value = "";
        return;
      }
      /* Custom exercises riding along inside a program file have to be merged
         before migrate() runs, or migrateItems drops every reference to them as
         an unknown id. A merge that had to suffix an id remaps the references. */
      const merged = (d && Array.isArray(d.customExercises)) ? mergeCustom(d.customExercises) : null;
      if(merged){
        renderFilterChips();
        remapIds(d, merged.map);
      }
      const p = migrate(d);
      if(!p) throw 0;
      flushSave();
      S = p;
      U.active = 0;
      applyPhaseLevel();
      persist(false);
      syncHeader();
      setView("prac");
      if(!reportMigration()){
        toast("Loaded "+(S.patient||"program")+"."
          + (merged && merged.added ? " " + customAddedMsg(merged) : ""));
      }
    }catch(err){
      toast("That file isn't a program file. Pick the .json this tool saved.");
    }
    e.target.value = "";
  };
  rd.readAsText(f);
};

/* ---- the custom library on its own ---- */
$("#bAddEx").onclick = addCustomFlow;

$("#bExportCustom").onclick = ()=>{
  if(!CUSTOM.length){ toast("You haven't written any exercises of your own yet."); return; }
  const blob = new Blob([JSON.stringify({
    type: "mvmt-custom-exercises",
    version: 1,
    exportedAt: new Date().toISOString(),
    exercises: CUSTOM
  },null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "my-exercises.json";
  a.click(); URL.revokeObjectURL(a.href);
  toast("Your exercises are saved to a file. Import it to put them back.");
};

$("#bImportCustom").onclick = ()=>$("#fCustomFile").click();
$("#fCustomFile").onchange = e=>{
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try{ importCustomFile(JSON.parse(rd.result)); }
    catch(err){ toast("That file isn't an exercise file."); }
    e.target.value = "";
  };
  rd.readAsText(f);
};

/* ============================ BOOT ============================ */
(function(){
  /* One-time upgrade of a v1 blob left by the previous build. The old key is
     left in place as a fallback rather than deleted. */
  if(!readPrograms().length){
    const p = migrate(readJSON(LEGACY_KEY, null));
    if(p){
      writePrograms([p]);
      writeSettings({lastProgramId: p.id});
    }
  }
  /* The saved-programs list is the home screen. */
  setView("list");
})();
</script>

</body>
</html>
