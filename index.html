<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Return to Tennis — Program Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#0F343D;
  --ink-2:#4A6469;
  --ink-3:#7B9298;
  --line:#D3DEDD;
  --line-2:#E7EEED;
  --paper:#FFFFFF;
  --bg:#F1F5F4;
  /* Region accents. hip / lumbar / thoracic are the original three; the rest
     are defined now so regions added later need no CSS change. */
  --r-cervical:#8A3A62;
  --r-shoulder:#2E6E8E;
  --r-elbow-wrist:#6E5AA8;
  --r-thoracic:#3F4C93;
  --r-lumbar:#B0562F;
  --r-hip:#17707F;
  --r-knee:#2F7A46;
  --r-ankle-foot:#8A6A2F;
  /* Legacy aliases — still used by the phase-level tab colours below. */
  --hip:var(--r-hip);
  --lum:var(--r-lumbar);
  --tsp:var(--r-thoracic);
  --ball:#CBDD3F;
  --ball-dk:#A8B92A;
  --ok:#1F7A54;
  --display:"Archivo Narrow","Archivo","Helvetica Neue",sans-serif;
  --body:"Public Sans","Helvetica Neue",Arial,sans-serif;
  --ui:"Archivo","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- scoreboard label ---------- */
.lbl{
  font-family:var(--display);
  text-transform:uppercase;
  letter-spacing:.13em;
  font-weight:600;
  font-size:11px;
  color:var(--ink-3);
}

/* ---------- top bar ---------- */
.topbar{
  background:var(--ink);
  color:#EAF2F1;
  padding:14px 22px;
  display:flex;
  align-items:center;
  gap:22px;
  flex-wrap:wrap;
  position:sticky;top:0;z-index:50;
}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand b{
  font-family:var(--display);
  text-transform:uppercase;
  letter-spacing:.09em;
  font-size:17px;
  font-weight:700;
}
.brand span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7FA6A9;font-family:var(--display);font-weight:500}
.who{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.who input{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);
  border-radius:3px;padding:7px 10px;color:#fff;width:150px;font-size:13px;
}
.who input::placeholder{color:#83A6A9}
.acts{display:flex;gap:8px;align-items:center}
.btn{
  background:transparent;border:1px solid rgba(255,255,255,.28);color:#EAF2F1;
  padding:7px 14px;border-radius:3px;
  font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;font-size:11px;font-weight:600;
}
.btn:hover{background:rgba(255,255,255,.1)}
.btn.solid{background:var(--ball);border-color:var(--ball);color:#1B2410}
.btn.solid:hover{background:var(--ball-dk)}

/* view switch */
.switch{display:flex;border:1px solid rgba(255,255,255,.28);border-radius:3px;overflow:hidden}
.switch button{
  background:transparent;border:0;color:#9DBCBE;padding:7px 15px;
  font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;font-size:11px;font-weight:600;
}
.switch button[aria-pressed="true"]{background:#EAF2F1;color:var(--ink)}

/* ---------- court strip (signature) ---------- */
.court{
  background:var(--paper);border-bottom:1px solid var(--line);
  padding:0 22px;
}
.court-inner{max-width:1500px;margin:0 auto;display:flex;align-items:stretch;gap:0;overflow-x:auto}
.blocktab{
  border:0;background:transparent;
  padding:14px 20px 12px;
  border-bottom:3px solid transparent;
  border-right:1px solid var(--line-2);
  text-align:left;min-width:168px;flex:1;
  display:flex;flex-direction:column;gap:3px;
}
.blocktab:hover{background:#F7FAF9}
.blocktab[aria-selected="true"]{border-bottom-color:var(--ball);background:#FBFDF7}
.blocktab .st{
  font-family:var(--display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
}
.blocktab .nm{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.02em;color:var(--ink)}
.blocktab .wk{font-size:11px;color:var(--ink-3)}
.blocktab .ct{
  font-family:var(--display);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-2);font-weight:600;margin-top:2px;
}
.st1{color:var(--hip)} .st2{color:var(--lum)} .st3{color:var(--tsp)}

/* ---------- layout ---------- */
.wrap{max-width:1500px;margin:0 auto;padding:22px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
@media(max-width:1080px){.cols{grid-template-columns:1fr}}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:4px}
.panel-hd{
  padding:14px 18px;border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
}
.panel-hd h2{
  margin:0;font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;
  font-size:13px;font-weight:700;
}
.panel-hd .count{margin-left:auto;font-family:var(--display);font-size:11px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;font-weight:600}

/* ---------- filters ---------- */
.filters{padding:12px 18px;border-bottom:1px solid var(--line-2);display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.fgroup{display:flex;flex-direction:column;gap:5px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 11px;
  font-family:var(--display);font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--ink-2);
}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.search{border:1px solid var(--line);border-radius:3px;padding:7px 10px;min-width:180px;flex:1}

/* ---------- library list ---------- */
.lib{max-height:calc(100vh - 300px);overflow-y:auto}
.grp{padding:11px 18px 5px;background:#F7FAF9;border-bottom:1px solid var(--line-2);position:sticky;top:0;z-index:2}
.grp .lbl{color:var(--ink-2)}
.ex{
  display:flex;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line-2);
  border-left:3px solid transparent;
}
.ex:hover{background:#F9FBFA}
.ex.cervical{border-left-color:var(--r-cervical)}
.ex.shoulder{border-left-color:var(--r-shoulder)}
.ex.elbow-wrist{border-left-color:var(--r-elbow-wrist)}
.ex.thoracic{border-left-color:var(--r-thoracic)}
.ex.lumbar{border-left-color:var(--r-lumbar)}
.ex.hip{border-left-color:var(--r-hip)}
.ex.knee{border-left-color:var(--r-knee)}
.ex.ankle-foot{border-left-color:var(--r-ankle-foot)}
.ex.on{background:#FBFDF2}
.ex input[type=checkbox]{margin-top:4px;width:16px;height:16px;accent-color:var(--ink);flex:0 0 auto}
.ex-body{flex:1;min-width:0}
.ex-hd{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.ex-nm{font-weight:600;font-size:14.5px}
.tag{
  font-family:var(--display);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;
  padding:2px 6px;border-radius:2px;background:var(--line-2);color:var(--ink-2);white-space:nowrap;
}
.tag.stage{background:var(--ink);color:#fff}
.ex-d{font-size:13px;color:var(--ink-2);margin-top:3px}
.ex-t{font-size:12.5px;color:var(--ink-3);margin-top:3px;font-style:italic}

/* ---------- assigned list ---------- */
.asg{max-height:calc(100vh - 300px);overflow-y:auto}
.acard{padding:13px 18px;border-bottom:1px solid var(--line-2);border-left:3px solid transparent}
.acard.cervical{border-left-color:var(--r-cervical)}
.acard.shoulder{border-left-color:var(--r-shoulder)}
.acard.elbow-wrist{border-left-color:var(--r-elbow-wrist)}
.acard.thoracic{border-left-color:var(--r-thoracic)}
.acard.lumbar{border-left-color:var(--r-lumbar)}
.acard.hip{border-left-color:var(--r-hip)}
.acard.knee{border-left-color:var(--r-knee)}
.acard.ankle-foot{border-left-color:var(--r-ankle-foot)}
.acard-hd{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.acard-hd .num{
  font-family:var(--display);font-weight:700;color:var(--ink-3);font-size:13px;
  min-width:20px;font-variant-numeric:tabular-nums;
}
.rx{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.rx label{display:flex;flex-direction:column;gap:3px}
.rx input{border:1px solid var(--line);border-radius:3px;padding:5px 8px;font-size:13px;width:88px}
.rx input.wide{width:100%}
.rx .grow{flex:1;min-width:190px}
.rm{
  margin-left:auto;border:0;background:transparent;color:var(--ink-3);
  font-family:var(--display);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:3px 5px;
}
.rm:hover{color:var(--lum)}
.empty{padding:40px 22px;text-align:center;color:var(--ink-3);font-size:14px}
.empty b{display:block;font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);margin-bottom:6px;font-size:12px}

/* notes */
.notes{padding:15px 18px;border-top:1px solid var(--line);background:#FAFCFB}
.notes label{display:block;margin-bottom:13px}
.notes textarea{
  width:100%;border:1px solid var(--line);border-radius:3px;padding:9px 10px;
  min-height:66px;resize:vertical;font-size:13.5px;line-height:1.5;margin-top:5px;
}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:3px}

/* block meta editing */
.bmeta{padding:13px 18px;border-bottom:1px solid var(--line-2);display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.bmeta label{display:flex;flex-direction:column;gap:4px}
.bmeta input{border:1px solid var(--line);border-radius:3px;padding:6px 9px;font-size:13px}
.bmeta input.nm{width:180px;font-weight:600}
.bmeta input.wk{width:130px}
.bmeta select{border:1px solid var(--line);border-radius:3px;padding:6px 9px;font-size:13px}

/* ---------- patient handout ---------- */
.sheet{
  background:var(--paper);border:1px solid var(--line);border-radius:4px;
  max-width:900px;margin:0 auto;padding:0 0 40px;
}
.sheet-hd{padding:30px 40px 22px;border-bottom:4px solid var(--ink)}
.sheet-hd .eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.18em;font-size:11px;font-weight:700;color:var(--ink-3)}
.sheet-hd h1{
  margin:6px 0 0;font-family:var(--display);font-size:33px;line-height:1.1;
  text-transform:uppercase;letter-spacing:.01em;font-weight:700;
}
.sheet-meta{display:flex;gap:32px;flex-wrap:wrap;margin-top:16px}
.sheet-meta div{display:flex;flex-direction:column;gap:2px}
.sheet-meta strong{font-size:15px;font-weight:600}
.sheet-sec{padding:26px 40px 0}
.sheet-sec h3{
  font-family:var(--display);text-transform:uppercase;letter-spacing:.13em;font-size:12px;font-weight:700;
  color:var(--ink);margin:0 0 4px;padding-bottom:7px;border-bottom:1px solid var(--line);
}
.pex{padding:15px 0;border-bottom:1px solid var(--line-2);display:flex;gap:15px}
.pex .pnum{
  font-family:var(--display);font-weight:700;font-size:19px;color:var(--ink-3);
  min-width:28px;font-variant-numeric:tabular-nums;line-height:1.2;
}
.pex h4{margin:0;font-size:16px;font-weight:600}
.pex .pd{font-size:14px;color:var(--ink-2);margin-top:5px}
.pex .pt{font-size:13px;color:var(--ink-3);font-style:italic;margin-top:5px}
.pex .prx{
  margin-top:8px;display:inline-block;background:#F3F7F1;border-left:3px solid var(--ball-dk);
  padding:6px 11px;font-size:13.5px;font-weight:600;
}
.pex .pn{font-size:13.5px;margin-top:7px;padding-left:11px;border-left:2px solid var(--line)}
.callout{
  margin:22px 40px 0;background:#F6F9F5;border:1px solid var(--line);border-left:4px solid var(--ball-dk);
  padding:16px 20px;font-size:14px;
}
.callout .lbl{display:block;margin-bottom:6px}
.callout p{margin:0 0 8px}
.callout p:last-child{margin:0}
.sheet-foot{padding:24px 40px 0;margin-top:24px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}

.legend{display:flex;gap:18px;flex-wrap:wrap;padding:12px 22px;max-width:1500px;margin:0 auto;font-size:12px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:4px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:200;
}
.toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- print ---------- */
@media print{
  @page{margin:14mm}
  body{background:#fff}
  .topbar,.court,.legend,.no-print{display:none!important}
  .wrap{padding:0;max-width:none}
  .sheet{border:0;max-width:none;padding:0}
  .sheet-hd{padding:0 0 18px}
  .sheet-sec{padding:20px 0 0;break-inside:auto}
  .callout{margin:18px 0 0;break-inside:avoid}
  .sheet-foot{padding:18px 0 0}
  .pex{break-inside:avoid}
  .panel{border:0}
  .lib,.asg{max-height:none;overflow:visible}
  .acard{break-inside:avoid}
}
</style>
</head>
<body>

<div class="topbar no-print">
  <div class="brand">
    <b>Return to Tennis</b>
    <span>Mobility &amp; Stability Program Builder</span>
  </div>
  <div class="who">
    <input id="fPatient" placeholder="Patient name">
    <input id="fPrac" placeholder="Practitioner (RMT)">
    <input id="fDate" placeholder="Start date">
  </div>
  <div class="acts">
    <div class="switch" role="group" aria-label="View">
      <button id="vPrac" aria-pressed="true">Build</button>
      <button id="vPat" aria-pressed="false">Patient copy</button>
    </div>
    <button class="btn" id="bSave" title="Keeps your work in this browser">Save</button>
    <button class="btn" id="bOpen" title="Load a .json program file you saved earlier">Open file</button>
    <button class="btn" id="bBackup" title="Saves your selections as a .json data file — not a handout">Save file (.json)</button>
    <button class="btn solid" id="bPrint" title="Makes the printable handout PDF">Print / Save as PDF</button>
    <input type="file" id="fFile" accept=".json,application/json" style="display:none">
  </div>
</div>

<div class="court no-print"><div class="court-inner" id="tabs" role="tablist"></div></div>

<div class="legend no-print">
  <span><i class="dot" style="background:var(--hip)"></i> Hip</span>
  <span><i class="dot" style="background:var(--lum)"></i> Lumbar</span>
  <span><i class="dot" style="background:var(--tsp)"></i> Thoracic</span>
  <span>· Level tags show the earliest phase an exercise is appropriate.</span>
</div>

<div class="wrap">
  <div id="buildView">
    <div class="cols">
      <section class="panel">
        <div class="panel-hd">
          <h2>Exercise library</h2>
          <span class="count" id="libCount"></span>
        </div>
        <div class="filters">
          <div class="fgroup">
            <span class="lbl">Region</span>
            <div class="chips" id="fRegion"></div>
          </div>
          <div class="fgroup">
            <span class="lbl">Type</span>
            <div class="chips" id="fType"></div>
          </div>
          <div class="fgroup">
            <span class="lbl">Level</span>
            <div class="chips" id="fLevel"></div>
          </div>
          <input class="search" id="fSearch" placeholder="Search exercises…">
        </div>
        <div class="lib" id="lib"></div>
      </section>

      <section class="panel">
        <div class="panel-hd">
          <h2>This block</h2>
          <span class="count" id="asgCount"></span>
        </div>
        <div class="bmeta" id="bmeta"></div>
        <div class="asg" id="asg"></div>
        <div class="notes">
          <label>
            <span class="lbl">Notes for patient — prints on their copy</span>
            <textarea id="nPatient" placeholder="Order to run them in, what it should feel like, when to stop, on-court progression for this block…"></textarea>
          </label>
          <label>
            <span class="lbl">Practitioner notes — stays on your copy only</span>
            <textarea id="nPrac" placeholder="Soft tissue findings, compensations seen, regression/progression triggers, what to reassess next visit…"></textarea>
            <span class="hint">Hidden from the patient copy.</span>
          </label>
        </div>
      </section>
    </div>
  </div>

  <div id="patientView" style="display:none"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================ EXERCISE LIBRARY ============================ */
/* Regions are the full clinical set. Only hip, lumbar and thoracic carry
   content today — the rest are declared now so the schema, the filters and the
   colour tokens are ready for material still to be written. A region with no
   exercises simply doesn't appear as a filter chip. */
const REGIONS = [
  {k:"cervical",    name:"Cervical"},
  {k:"shoulder",    name:"Shoulder"},
  {k:"elbow-wrist", name:"Elbow & wrist"},
  {k:"thoracic",    name:"Thoracic"},
  {k:"lumbar",      name:"Lumbar"},
  {k:"hip",         name:"Hip"},
  {k:"knee",        name:"Knee"},
  {k:"ankle-foot",  name:"Ankle & foot"}
];

const TYPES = [
  {k:"mobility",  name:"Mobility"},
  {k:"stability", name:"Stability"}
];

/* v1 used short ids (hm1, ls19). Saved programs and exported .json files still
   reference them, so every old id maps to its v2 slug here. Never remove an
   entry from this map — it is the only thing keeping old files loadable. */
const LEGACY_ID_MAP = {
  /* hip */

  "hm7": "hip-mob-worlds-greatest-stretch",

  "hm15": "hip-mob-banded-distraction",
  "hm16": "hip-mob-end-range-pails-rails",
  "hs1": "hip-stab-glute-bridge-series",
  "hs2": "hip-stab-side-plank-with-clam",
  "hs3": "hip-stab-copenhagen-plank",
  "hs4": "hip-stab-lateral-band-walks",
  "hs5": "hip-stab-single-leg-rdl",
  "hs6": "hip-stab-split-squat-to-bulgarian",
  "hs7": "hip-stab-eccentric-step-down",
  "hs8": "hip-stab-skater-bound",
  "hs9": "hip-stab-single-leg-balance-progression",
  "hs10": "hip-stab-standing-banded-abduction",
  "hs11": "hip-stab-wall-press-march",
  "hs12": "hip-stab-suitcase-carry",
  "hs13": "hip-stab-curtsy-lunge",
  "hs14": "hip-stab-single-leg-squat-to-box",
  "hs15": "hip-stab-lateral-resisted-walk",
  "hs16": "hip-stab-half-kneeling-pallof-press",

  /* lumbar */
  "lm1": "lumbar-mob-cat-cow",
  "lm2": "lumbar-mob-pelvic-tilts",
  "lm3": "lumbar-mob-supine-lower-trunk-rotation",
  "lm4": "lumbar-mob-childs-pose-lateral-reach",
  "lm5": "lumbar-mob-prone-press-up",
  "lm6": "lumbar-mob-sphinx-to-cobra",
  "lm7": "lumbar-mob-standing-lateral-flexion-with-reach",
  "lm8": "lumbar-mob-segmental-bridge",
  "lm9": "lumbar-mob-quadruped-rock-back",
  "lm10": "lumbar-mob-seated-ball-rotation",
  "ls1": "lumbar-stab-dead-bug",
  "ls2": "lumbar-stab-bird-dog",
  "ls3": "lumbar-stab-mcgill-curl-up",
  "ls4": "lumbar-stab-side-plank",
  "ls5": "lumbar-stab-front-plank-to-rkc-plank",
  "ls6": "lumbar-stab-pallof-press",
  "ls7": "lumbar-stab-half-kneeling-chop",
  "ls8": "lumbar-stab-half-kneeling-lift",
  "ls9": "lumbar-stab-farmer-suitcase-carry",
  "ls10": "lumbar-stab-bear-crawl",

const DEFAULT_PHASES = [
  {name:"Visit 1", level:1, timeframe:"Weeks 1-3",   items:[], patientNote:"", practitionerNote:""},
  {name:"Visit 2", level:1, timeframe:"Weeks 3-5",   items:[], patientNote:"", practitionerNote:""},
  {name:"Visit 3", level:2, timeframe:"Weeks 5-8",   items:[], patientNote:"", practitionerNote:""},
  {name:"Visit 4", level:2, timeframe:"Weeks 8-11",  items:[], patientNote:"", practitionerNote:""},
  {name:"Visit 5", level:3, timeframe:"Weeks 11-14", items:[], patientNote:"", practitionerNote:""},
  {name:"Visit 6", level:3, timeframe:"Weeks 14-17", items:[], patientNote:"", practitionerNote:""}
];

const clone = o => JSON.parse(JSON.stringify(o));

function uuid(){
  try{ if(window.crypto && crypto.randomUUID) return crypto.randomUUID(); }catch(err){}
  return "p-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,10);
}

function newProgram(){
  return {
    schemaVersion:2,
    id:uuid(),
    patient:"", practitioner:"", startDate:"",
    structure:"phased",
    phases:clone(DEFAULT_PHASES),
    updatedAt:new Date().toISOString()
  };
}

/* The program being edited. */
let S = newProgram();
/* View state. Deliberately kept off the program object so it never lands in a
   saved record or an export. */
let U = {view:"prac", active:0};
let F = {region:"all", type:"all", level:"all", q:""};

const byId = {}; EX.forEach(e=>byId[e.id]=e);
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const phase = ()=>S.phases[U.active];
const typeName = k=>(TYPES.find(t=>t.k===k)||{}).name || k;

const LEVEL_NAME = {1:"Level 1 · Restore", 2:"Level 2 · Integrate", 3:"Level 3 · Express"};
const LEVEL_BLURB = {
  1:"Mobility-led. Ground-based positions, slow tempo, one plane at a time. Rebuilding range and reawakening control after time off.",
  2:"Even split. Half-kneeling and split stance, light bands and load, two planes combined. Turning range into controlled strength.",
  3:"Strength and power led. Standing, single leg, reactive, full rotation. Bringing it back to the court."
};

/* ============================ SCHEMA MIGRATION ============================ */
/* v1 kept a single program under rtt:program, using block/np/nr field names and
   short exercise ids. v2 keeps an array of programs under homecare:programs.
   Anything still speaking v1 — an old saved blob, or a .json exported by the
   previous build — comes through migrate() first. */

let droppedOnMigrate = 0;

function migrateItems(items){
  const out = [];
  (items||[]).forEach(it=>{
    if(!it) return;
    const raw = it.exerciseId || it.id;
    const id = LEGACY_ID_MAP[raw] || raw;
    /* An id we no longer recognise is dropped rather than left to blow up the
       renderer. The count is surfaced to the user, never swallowed. */
    if(!id || !byId[id]){ droppedOnMigrate++; return; }
    out.push({exerciseId:id, rx:it.rx||"", freq:it.freq||"", note:it.note||""});
  });
  return out;
}

/* Reshape a v1 program. Exercise ids are left alone here — normalize() remaps
   them, so exactly one place knows about LEGACY_ID_MAP. */
function fromV1(d){
  return {
    id: uuid(),
    patient: d.patient || "",
    practitioner: d.prac || "",
    startDate: d.date || "",
    structure: "phased",
    phases: (d.blocks||[]).map(b=>({
      name: b.name,
      timeframe: b.weeks,
      level: b.stage,
      items: b.items,
      patientNote: b.np,
      practitionerNote: b.nr
    }))
  };
}

function normalize(d){
  const p = {
    schemaVersion: 2,
    id: d.id || uuid(),
    patient: d.patient || "",
    practitioner: d.practitioner || "",
    startDate: d.startDate || "",
    structure: d.structure === "single" ? "single" : "phased",
    phases: (Array.isArray(d.phases) ? d.phases : []).map((ph,i)=>({
      name: (ph && ph.name) || ("Phase " + (i+1)),
      timeframe: (ph && ph.timeframe) || "",
      level: Number(ph && ph.level) || 1,
      items: migrateItems(ph && ph.items),
      patientNote: (ph && ph.patientNote) || "",
      practitionerNote: (ph && ph.practitionerNote) || ""
    })),
    updatedAt: d.updatedAt || new Date().toISOString()
  };
  if(!p.phases.length) p.phases = clone(DEFAULT_PHASES);
  if(p.structure === "single") p.phases = p.phases.slice(0,1);
  return p;
}

/* Returns a v2 program, or null if this isn't a program at all. */
function migrate(d){
  droppedOnMigrate = 0;
  if(!d || typeof d !== "object") return null;
  if(Array.isArray(d.phases)) return normalize(d);          // already v2
  if(Array.isArray(d.blocks)) return normalize(fromV1(d));  // v1
  return null;
}

/* ============================ FILTERS UI ============================ */
function chips(el, opts, key){
  el.innerHTML = opts.map(o=>
    `<button class="chip" data-v="${o.v}" aria-pressed="${F[key]===o.v}">${o.l}</button>`).join("");
  el.onclick = e=>{
    const b=e.target.closest(".chip"); if(!b) return;
    F[key]=b.dataset.v; chips(el,opts,key); renderLib();
  };
}
/* Only offer a region or type that actually has something in it, so the regions
   waiting on content show up as nothing rather than as an empty filter. */
const regionOpts = [{v:"all",l:"All"}].concat(
  REGIONS.filter(r=>EX.some(x=>x.region===r.k)).map(r=>({v:r.k, l:r.name})));
const typeOpts = [{v:"all",l:"All"}].concat(
  TYPES.filter(t=>EX.some(x=>x.type===t.k)).map(t=>({v:t.k, l:t.name})));

chips($("#fRegion"), regionOpts, "region");
chips($("#fType"),   typeOpts, "type");
chips($("#fLevel"),  [{v:"all",l:"All"},{v:"1",l:"1"},{v:"2",l:"2"},{v:"3",l:"3"}], "level");
$("#fSearch").oninput = e=>{F.q=e.target.value.toLowerCase(); renderLib();};

/* ============================ RENDER: TABS ============================ */
function renderTabs(){
  /* A single-handout program has no phase structure to show. */
  const single = S.structure === "single";
  const court = $("#tabs").closest(".court");
  if(court) court.style.display = single ? "none" : "";
  if(single) return;

  $("#tabs").innerHTML = S.phases.map((ph,i)=>`
    <button class="blocktab" role="tab" aria-selected="${i===U.active}" data-i="${i}">
      <span class="st st${ph.level}">Level ${ph.level}</span>
      <span class="nm">${esc(ph.name)}</span>
      <span class="wk">${esc(ph.timeframe)}</span>
      <span class="ct">${ph.items.length} exercise${ph.items.length===1?"":"s"}</span>
    </button>`).join("");
  $("#tabs").onclick = e=>{
    const t=e.target.closest(".blocktab"); if(!t) return;
    U.active = +t.dataset.i; renderAll();
  };
}

/* ============================ RENDER: LIBRARY ============================ */
function passes(x){
  if(F.region!=="all" && x.region!==F.region) return false;
  if(F.type!=="all" && x.type!==F.type) return false;
  if(F.level!=="all" && String(x.level)!==F.level) return false;
  if(F.q && !(x.name+" "+x.targets+" "+x.desc).toLowerCase().includes(F.q)) return false;
  return true;
}
function renderLib(){
  const chosen = new Set(phase().items.map(i=>i.exerciseId));
  const list = EX.filter(passes);
  $("#libCount").textContent = list.length + " shown of " + EX.length;

  let html = "";
  REGIONS.forEach(r=>{
    TYPES.forEach(t=>{
      const g = list.filter(x=>x.region===r.k && x.type===t.k);
      if(!g.length) return;
      html += `<div class="grp"><span class="lbl">${esc(r.name)} — ${esc(t.name)} · ${g.length}</span></div>`;
      html += g.map(x=>`
        <label class="ex ${x.region} ${chosen.has(x.id)?"on":""}">
          <input type="checkbox" data-id="${x.id}" ${chosen.has(x.id)?"checked":""}>
          <span class="ex-body">
            <span class="ex-hd">
              <span class="ex-nm">${esc(x.name)}</span>
              <span class="tag stage">Level ${x.level}</span>
              <span class="tag">${esc(typeName(x.type))}</span>
            </span>
            <span class="ex-d">${esc(x.desc)}</span>
            <span class="ex-t">Targets: ${esc(x.targets)}</span>
          </span>
        </label>`).join("");
    });
  });
  if(!html) html = `<div class="empty"><b>Nothing matches</b>Widen a filter or clear the search box.</div>`;
  $("#lib").innerHTML = html;

  $("#lib").onchange = e=>{
    const cb = e.target; if(cb.type!=="checkbox") return;
    const id = cb.dataset.id, ph = phase();
    if(cb.checked){
      if(!ph.items.some(i=>i.exerciseId===id)) ph.items.push({exerciseId:id, rx:byId[id].rx, freq:"", note:""});
    } else {
      ph.items = ph.items.filter(i=>i.exerciseId!==id);
    }
    renderAll();
  };
}

/* ============================ RENDER: PHASE META + ASSIGNED ============================ */
function renderMeta(){
  const ph = phase();
  const single = S.structure === "single";
  $("#bmeta").innerHTML = `
    ${single?"":`<label><span class="lbl">Phase name</span><input class="nm" id="mName" value="${esc(ph.name)}"></label>`}
    <label><span class="lbl">Timeframe</span><input class="wk" id="mWeeks" value="${esc(ph.timeframe)}"></label>
    <label><span class="lbl">Level</span>
      <select id="mLevel">
        <option value="1"${ph.level===1?" selected":""}>Level 1 — Restore</option>
        <option value="2"${ph.level===2?" selected":""}>Level 2 — Integrate</option>
        <option value="3"${ph.level===3?" selected":""}>Level 3 — Express</option>
      </select></label>`;
  if(!single) $("#mName").oninput = e=>{ph.name=e.target.value; renderTabs();};
  $("#mWeeks").oninput = e=>{ph.timeframe=e.target.value; renderTabs();};
  $("#mLevel").onchange = e=>{ph.level=+e.target.value; renderTabs();};
}

function renderAsg(){
  const ph = phase();
  $("#asgCount").textContent = ph.items.length + " selected";
  if(!ph.items.length){
    $("#asg").innerHTML = `<div class="empty"><b>No exercises yet</b>Tick anything in the library to add it to ${esc(ph.name)}.</div>`;
    return;
  }
  $("#asg").innerHTML = ph.items.map((it,i)=>{
    const x = byId[it.exerciseId];
    if(!x) return "";
    return `<div class="acard ${x.region}">
      <div class="acard-hd">
        <span class="num">${i+1}</span>
        <span class="ex-nm">${esc(x.name)}</span>
        <span class="tag stage">Level ${x.level}</span>
        <span class="tag">${esc(typeName(x.type))}</span>
        <button class="rm" data-rm="${x.id}">Remove</button>
      </div>
      <div class="rx">
        <label><span class="lbl">Sets &amp; reps</span><input data-f="rx" data-id="${x.id}" value="${esc(it.rx)}"></label>
        <label><span class="lbl">Per week</span><input data-f="freq" data-id="${x.id}" value="${esc(it.freq)}" placeholder="e.g. 4x"></label>
        <label class="grow"><span class="lbl">Cue or note for this exercise</span><input class="wide" data-f="note" data-id="${x.id}" value="${esc(it.note)}" placeholder="e.g. keep ribs down, stop if it pinches at the front"></label>
      </div>
    </div>`;
  }).join("");

  $("#asg").onclick = e=>{
    const r = e.target.closest("[data-rm]"); if(!r) return;
    ph.items = ph.items.filter(i=>i.exerciseId!==r.dataset.rm); renderAll();
  };
  $("#asg").oninput = e=>{
    const f = e.target.dataset.f; if(!f) return;
    const it = ph.items.find(i=>i.exerciseId===e.target.dataset.id);
    if(it) it[f] = e.target.value;
  };
}

function renderPatient(){
  const ph = phase();
  const known = ph.items.filter(i=>byId[i.exerciseId]);
  /* Mobility always prints before stability. */
  const mob  = known.filter(i=>byId[i.exerciseId].type==="mobility");
  const stab = known.filter(i=>byId[i.exerciseId].type==="stability");

  const card = (it,n)=>{
    const x = byId[it.exerciseId];
    return `<div class="pex">
      <div class="pnum">${n}</div>
      <div style="flex:1">
        <h4>${esc(x.name)}</h4>
        <div class="pd">${esc(x.desc)}</div>
        <div class="pt">What it's for: ${esc(x.targets)}</div>
        ${it.rx||it.freq?`<div class="prx">${esc(it.rx)}${it.freq?" &nbsp;·&nbsp; "+esc(it.freq)+" per week":""}</div>`:""}
        ${it.note?`<div class="pn">${esc(it.note)}</div>`:""}
      </div>
    </div>`;
  };

  let n=0;
  const secMob = mob.length ? `<div class="sheet-sec"><h3>Part 1 — Mobility (do these first)</h3>${mob.map(i=>card(i,++n)).join("")}</div>` : "";
  const secStab = stab.length ? `<div class="sheet-sec"><h3>Part 2 — Stability &amp; strength</h3>${stab.map(i=>card(i,++n)).join("")}</div>` : "";

  const empty = !known.length ? `<div class="empty" style="padding:60px 40px"><b>Nothing assigned to this phase yet</b>Switch to Build and tick some exercises.</div>` : "";

  const single = S.structure === "single";

  $("#patientView").innerHTML = `
    <div class="sheet">
      <div class="sheet-hd">
        <div class="eyebrow">${esc(single ? "Home programme" : "Home programme · " + LEVEL_NAME[ph.level])}</div>
        <h1>${esc(single ? "Your programme" : ph.name)}</h1>
        <div class="sheet-meta">
          ${S.patient?`<div><span class="lbl">Patient</span><strong>${esc(S.patient)}</strong></div>`:""}
          ${S.practitioner?`<div><span class="lbl">Practitioner</span><strong>${esc(S.practitioner)}</strong></div>`:""}
          ${S.startDate?`<div><span class="lbl">Started</span><strong>${esc(S.startDate)}</strong></div>`:""}
          ${ph.timeframe?`<div><span class="lbl">Timeframe</span><strong>${esc(ph.timeframe)}</strong></div>`:""}
          <div><span class="lbl">Exercises</span><strong>${known.length}</strong></div>
        </div>
      </div>
      ${empty}
      ${secMob}${secStab}
      ${ph.patientNote?`<div class="callout"><span class="lbl">Notes from your therapist</span><p>${esc(ph.patientNote).replace(/\n/g,"</p><p>")}</p></div>`:""}
      <div class="callout">
        <span class="lbl">How to run this programme</span>
        <p><strong>Mobility first, then strength.</strong> The mobility work opens the range; the stability work teaches you to hold it. Doing it in the other order wastes both.</p>
        <p><strong>Where you should feel it.</strong> A stretch or a working muscle is fine. Sharp, pinching, or nerve-like pain is not — back off that exercise and tell me at the next appointment.</p>
        <p><strong>Progressing.</strong> Each exercise has stages built into the description. Move to the next stage only once the current one feels controlled and easy for all your reps.</p>
        <p><strong>Consistency beats intensity.</strong> Short and frequent beats long and occasional every time.</p>
      </div>
      <div class="sheet-foot">
        Prepared${S.practitioner?" by "+esc(S.practitioner):""} for ${single?"you":"this phase only"}. Bring this sheet to your next appointment so we can progress it.
      </div>
    </div>`;
}

/* ============================ VIEW SWITCH / RENDER ALL ============================ */
function setView(v){
  U.view = v;
  $("#vPrac").setAttribute("aria-pressed", v==="prac");
  $("#vPat").setAttribute("aria-pressed", v==="pat");
  $("#buildView").style.display = v==="prac" ? "" : "none";
  $("#patientView").style.display = v==="pat" ? "" : "none";
  if(v==="pat") renderPatient();
}
$("#vPrac").onclick = ()=>setView("prac");
$("#vPat").onclick = ()=>setView("pat");

function renderAll(){
  if(U.active >= S.phases.length) U.active = 0;
  renderTabs(); renderMeta(); renderLib(); renderAsg();
  const ph = phase();
  $("#nPatient").value = ph.patientNote; $("#nPrac").value = ph.practitionerNote;
  if(U.view==="pat") renderPatient();
}
$("#nPatient").oninput = e=>{phase().patientNote = e.target.value;};
$("#nPrac").oninput = e=>{phase().practitionerNote = e.target.value;};
["fPatient","fPrac","fDate"].forEach((id,i)=>{
  const k = ["patient","practitioner","startDate"][i];
  $("#"+id).oninput = e=>{S[k]=e.target.value;};
});

/* ============================ STORAGE ============================ */
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}

const KEYS = {
  programs: "homecare:programs",
  custom:   "homecare:custom",
  settings: "homecare:settings"
};
const LEGACY_KEY = "rtt:program";

/* Persistence. Plain localStorage — reading or writing it throws in private
   mode or when the quota is full, and every caller below treats that as
   "couldn't save" rather than letting it break the page. */
const storage = {
  set(key, value){
    localStorage.setItem(key, value);
    return true;
  },
  get(key){
    const value = localStorage.getItem(key);
    return value === null ? null : {value};
  }
};

function readJSON(key, fallback){
  try{
    const r = storage.get(key);
    if(!r || !r.value) return fallback;
    const d = JSON.parse(r.value);
    return d == null ? fallback : d;
  }catch(err){ return fallback; }
}
function writeJSON(key, value){
  try{ return storage.set(key, JSON.stringify(value)); }
  catch(err){ return false; }
}

function readPrograms(){
  const a = readJSON(KEYS.programs, []);
  return Array.isArray(a) ? a : [];
}
function readSettings(){
  const s = readJSON(KEYS.settings, {});
  return (s && typeof s === "object" && !Array.isArray(s)) ? s : {};
}

function save(){
  S.updatedAt = new Date().toISOString();
  const list = readPrograms();
  const i = list.findIndex(p=>p && p.id===S.id);
  if(i>=0) list[i] = S; else list.push(S);

  const st = readSettings();
  st.lastProgramId = S.id;
  if(S.practitioner) st.practitioner = S.practitioner;

  if(writeJSON(KEYS.programs, list) && writeJSON(KEYS.settings, st)){
    toast("Saved. It'll be here next time you open this.");
  }else{
    toast("Couldn't save in the browser — use Save file (.json) instead.");
  }
}

function reportDropped(n){
  toast(n===1
    ? "1 exercise in that program is no longer in the library and was left out."
    : n + " exercises in that program are no longer in the library and were left out.");
}

function load(){
  let list = readPrograms();
  let dropped = 0;

  if(!list.length){
    /* First run on v2. Bring across a v1 blob from the previous build if one is
       sitting there. The old key is left in place as a fallback. */
    const p = migrate(readJSON(LEGACY_KEY, null));
    if(p){
      dropped = droppedOnMigrate;
      list = [p];
      writeJSON(KEYS.programs, list);
      const st = readSettings(); st.lastProgramId = p.id; writeJSON(KEYS.settings, st);
    }
  }
  if(!list.length) return;

  const st = readSettings();
  const chosen = list.find(p=>p && p.id===st.lastProgramId) || list[0];
  const p = migrate(chosen);
  if(!p) return;
  S = p;
  dropped = dropped || droppedOnMigrate;
  if(dropped) reportDropped(dropped);
}

$("#bSave").onclick = save;

/* ============================ FILE / PRINT ============================ */
const slug = s=>String(s||"").trim().replace(/[^\w-]+/g,"-").replace(/^-+|-+$/g,"").toLowerCase();

$("#bPrint").onclick = ()=>{
  const orig = document.title;
  // Browsers use the page title as the default PDF filename.
  document.title = [slug(S.patient)||"program",
                    S.structure==="single" ? "" : slug(phase().name),
                    U.view==="pat"?"patient":"practitioner"]
                     .filter(Boolean).join("-");
  window.print();
  setTimeout(()=>{document.title = orig;}, 800);
};

$("#bBackup").onclick = ()=>{
  S.updatedAt = new Date().toISOString();
  const blob = new Blob([JSON.stringify(S,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (slug(S.patient)||"program")+"-program.json";
  a.click(); URL.revokeObjectURL(a.href);
  toast("Program file saved. Reload it any time with Open file.");
};

$("#bOpen").onclick = ()=>$("#fFile").click();
$("#fFile").onchange = e=>{
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      const p = migrate(JSON.parse(rd.result));
      if(!p) throw 0;
      const dropped = droppedOnMigrate;
      S = p;
      U.active = 0;
      $("#fPatient").value = S.patient;
      $("#fPrac").value = S.practitioner;
      $("#fDate").value = S.startDate;
      setView(U.view||"prac");
      renderAll();
      if(dropped) reportDropped(dropped);
      else toast("Loaded "+(S.patient||"program")+".");
    }catch(err){
      toast("That file isn't a program file. Pick the .json this tool saved.");
    }
    e.target.value = "";
  };
  rd.readAsText(f);
};

/* ============================ BOOT ============================ */
(function(){
  load();
  if(!S.practitioner){
    const st = readSettings();
    if(st.practitioner) S.practitioner = st.practitioner;
  }
  $("#fPatient").value = S.patient;
  $("#fPrac").value = S.practitioner;
  $("#fDate").value = S.startDate;
  setView(U.view||"prac");
  renderAll();
})();
</script>

</body>
