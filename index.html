 clinical:"The most commonly injured cuff tendon. Loads heavily in the first 30 degrees, which is why the full can raise stops at shoulder height.",
 ex:["Full Can Raise","Side-lying External Rotation","Doorframe Isometrics","Prone Y-T-W-I"]},

{id:"shoulder-infraspinatus", name:"Infraspinatus", latin:"m. infraspinatus", region:"shoulder", system:"muscular", layer:2,
 action:"Rotates the arm outward and holds the head of the humerus back in the socket.",
 clinical:"The main external rotator and the main brake on a throw or a serve. Trained far too heavy by almost everyone.",
 ex:["Side-lying External Rotation","Band External Rotation at 90/90","Band External Rotation, Arm at Side","Doorframe Isometrics"]},

{id:"shoulder-teres-minor", name:"Teres Minor", latin:"m. teres minor", region:"shoulder", system:"muscular", layer:2,
 action:"Rotates the arm outward alongside infraspinatus.",
 clinical:"Small, and usually trained together with infraspinatus rather than separately.",
 ex:["Side-lying External Rotation","Band External Rotation at 90/90","Face Pull","Bottoms-Up Kettlebell Hold"]},

{id:"shoulder-subscapularis", name:"Subscapularis", latin:"m. subscapularis", region:"shoulder", system:"muscular", layer:2,
 action:"Rotates the arm inward and is the largest of the four cuff muscles.",
 clinical:"The forgotten cuff muscle — everyone trains external rotation and skips this. Sits on the front of the shoulder blade, so it is not directly palpable.",
 ex:["Band Internal Rotation","Doorframe Isometrics","Towel Internal Rotation Stretch","Bottoms-Up Kettlebell Hold"]},

{id:"shoulder-pec-major", name:"Pectoralis Major", latin:"m. pectoralis major", region:"shoulder", system:"muscular", layer:1,
 action:"Draws the arm forward and across the body.",
 clinical:"Shortens with desk posture, pulls the shoulders forward and caps overhead reach. Each of its three parts shortens differently — stretch at three heights.",
 ex:["Doorway Pec Stretch","Push-Up Plus","Dowel Pass-Throughs","Band Pull-Apart"]},

{id:"shoulder-pec-minor", name:"Pectoralis Minor", latin:"m. pectoralis minor", region:"shoulder", system:"muscular", layer:2,
 action:"Pulls the shoulder blade forward and down over the ribs.",
 clinical:"Short pec minor tips the shoulder blade forward and narrows the space nerves pass through. A frequent hidden driver of both shoulder and arm symptoms.",
 ex:["Doorway Pec Stretch","Wall Plank Protraction Hold","Prone Trap Raise","Serratus Wall Slide"]},

{id:"shoulder-lats", name:"Latissimus Dorsi", latin:"m. latissimus dorsi", region:"shoulder", system:"muscular", layer:1,
 action:"Pulls the arm down and back and rotates it inward.",
 clinical:"A major and frequently missed limiter of overhead reach, routinely mistaken for a stiff shoulder joint. It also attaches to the pelvis, so it links shoulder and low back.",
 ex:["Kneeling Lat Stretch","Dowel Pass-Throughs","Ring or Inverted Row","Supine Snow Angel"]},

{id:"shoulder-teres-major", name:"Teres Major", latin:"m. teres major", region:"shoulder", system:"muscular", layer:2,
 action:"Draws the arm down and back with latissimus dorsi.",
 clinical:"Restricts overhead reach with the lats. Often the tender spot found at the back of the armpit.",
 ex:["Kneeling Lat Stretch","Cross-Body Stretch","Dowel-Assisted Flexion","Ring or Inverted Row"]},

{id:"shoulder-mid-trap", name:"Middle Trapezius", latin:"m. trapezius pars transversa", region:"shoulder", system:"muscular", layer:1,
 action:"Draws the shoulder blades toward the spine.",
 clinical:"Endurance rather than strength is what fails here. Train it in long sets.",
 ex:["Band Pull-Apart","Prone Y-T-W-I","Ring or Inverted Row","Face Pull"]},

{id:"shoulder-lower-trap", name:"Lower Trapezius", latin:"m. trapezius pars ascendens", region:"shoulder", system:"muscular", layer:2,
 action:"Draws the shoulder blade down and rotates it upward for overhead reach.",
 clinical:"Sets the shoulder blade before the arm goes overhead. Weak in almost everyone with a desk job, and the direct counterpart to an overworking upper trapezius.",
 ex:["Prone Trap Raise","Prone Y-T-W-I","Face Pull","Banded Wall Slide"]},

{id:"shoulder-rhomboids", name:"Rhomboids", latin:"mm. rhomboidei major et minor", region:"shoulder", system:"muscular", layer:2,
 action:"Draw the shoulder blades together and slightly upward.",
 clinical:"Where people feel the ache between the shoulder blades. Usually a length and endurance problem rather than a strength one.",
 ex:["Band Pull-Apart","Prone Y-T-W-I","Prone Swimmers","Ring or Inverted Row"]},

{id:"shoulder-serratus", name:"Serratus Anterior", latin:"m. serratus anterior", region:"shoulder", system:"muscular", layer:2,
 action:"Holds the shoulder blade flat against the ribs and rotates it upward.",
 clinical:"The muscle that actually lets the arm reach overhead. When it fails the blade wings and the cuff absorbs the load instead.",
 ex:["Push-Up Plus","Serratus Wall Slide","Wall Plank Protraction Hold","Quadruped Protraction Rock"]},

{id:"shoulder-biceps-long-head", name:"Biceps Long Head", latin:"caput longum m. bicipitis brachii", region:"shoulder", system:"muscular", layer:2,
 action:"Runs through the shoulder joint in a groove at the front of the humerus.",
 clinical:"Pain at the front of the shoulder in overhead athletes often traces here rather than to the cuff. Provoked by resisted forward reach.",
 ex:["Doorframe Isometrics","Side-lying External Rotation","Prone Extension Reach","Dowel-Assisted External Rotation"]},

{id:"shoulder-gh-joint", name:"Glenohumeral Joint", latin:"articulatio humeri", region:"shoulder", system:"articular", layer:3,
 action:"Ball and shallow socket — the most mobile joint in the body.",
 clinical:"The shallow socket is why it moves further than any other joint and dislocates most easily. Stability is muscular, not bony.",
 ex:["Shoulder CARs","Supine 90/90 Rotation Arcs","Sleeper Stretch","Rhythmic Stabilization"]},

{id:"shoulder-ac-joint", name:"Acromioclavicular Joint", latin:"articulatio acromioclavicularis", region:"shoulder", system:"articular", layer:3,
 action:"Small joint at the top of the shoulder where the collarbone meets the shoulder blade.",
 clinical:"Point tenderness right on top, worse with reaching across the body. The cross-body stretch is also the provocation test — use it to screen before prescribing.",
 ex:["Scapular Circles","Cross-Body Stretch","Band Pull-Apart","Prone Trap Raise"]},

{id:"shoulder-scapulothoracic", name:"Scapulothoracic Articulation", latin:"junctura scapulothoracica", region:"shoulder", system:"articular", layer:2,
 action:"Not a true joint — the shoulder blade gliding on the back of the ribcage.",
 clinical:"A stiff ribcage caps shoulder blade movement no matter how strong the muscles are. Ribs before blade, blade before arm.",
 ex:["Scapular Circles","Serratus Wall Slide","Foam Roller Thoracic Extension","Wall Angels"]},

{id:"shoulder-scapula", name:"Scapula", latin:"os scapula", region:"shoulder", system:"skeletal", layer:3,
 action:"A floating bone suspended on muscle, with its only bony link to the trunk through the collarbone.",
 clinical:"Its resting position and its ability to rotate upward govern nearly everything the shoulder can do.",
 ex:["Scapular Circles","Side-lying Scapular Punch","Scap Push-Up","Prone Trap Raise"]},

/* ---- Elbow & Wrist — 41 ---- */
{id:"elbow-common-extensor", name:"Common Extensor Origin", latin:"origo communis extensorum", region:"elbow-wrist", system:"muscular", layer:2,
 action:"Shared attachment of the wrist extensors at the outer elbow.",
 clinical:"Tennis elbow. Isometrics first, eccentrics second — loading it early beats resting it, but the dose has to be right.",
 ex:["Wrist Extensor Isometric","Eccentric Wrist Extension","Rubber Bar Twist","Wrist Extensor Stretch"]},

{id:"elbow-common-flexor", name:"Common Flexor Origin", latin:"origo communis flexorum", region:"elbow-wrist", system:"muscular", layer:2,
 action:"Shared attachment of the wrist flexors at the inner elbow.",
 clinical:"Golfer's elbow. Same principle as the outer side, and the ulnar nerve sits right behind it — screen for nerve symptoms before loading.",
 ex:["Wrist Flexor Isometric","Eccentric Wrist Flexion","Wrist Flexor Stretch","Ulnar Nerve Slider"]},

{id:"elbow-ecrb", name:"Extensor Carpi Radialis Brevis", latin:"m. extensor carpi radialis brevis", region:"elbow-wrist", system:"muscular", layer:2,
 action:"Extends the wrist and is the primary tendon involved in tennis elbow.",
 clinical:"The specific tendon at fault in most lateral elbow pain. Loads most with the elbow straight — which is why gripping with a straight arm hurts most.",
 ex:["Wrist Extensor Isometric","Eccentric Wrist Extension","Rubber Bar Twist","Wrist Extensor Stretch"]},

{id:"elbow-wrist-flexors", name:"Wrist Flexors", latin:"mm. flexores carpi radialis et ulnaris", region:"elbow-wrist", system:"muscular", layer:1,
 action:"Bend the wrist and contribute to grip.",
 clinical:"Short flexors reduce the wrist extension needed to bear weight through the hand — check before prescribing any floor work.",
 ex:["Wrist Flexor Stretch","Eccentric Wrist Flexion","Quadruped Wrist Rocks","Prayer and Reverse Prayer"]},

{id:"elbow-biceps", name:"Biceps Brachii", latin:"m. biceps brachii", region:"elbow-wrist", system:"muscular", layer:1,
 action:"Bends the elbow and turns the palm upward.",
 clinical:"The strongest forearm supinator. Loss of full elbow straightening after injury is often biceps guarding rather than a joint block.",
 ex:["Elbow Flexion and Extension","Elbow Extension Hold","Forearm Rotation","Hammer Rotation"]},

{id:"elbow-triceps", name:"Triceps Brachii", latin:"m. triceps brachii", region:"elbow-wrist", system:"muscular", layer:1,
 action:"Straightens the elbow; its long head also crosses the shoulder.",
 clinical:"Because the long head crosses both joints, a tight triceps limits overhead reach as well as elbow bend.",
 ex:["Elbow Flexion and Extension","Kneeling Lat Stretch","Half-Kneeling Overhead Reach","Landmine Press"]},

{id:"elbow-brachioradialis", name:"Brachioradialis", latin:"m. brachioradialis", region:"elbow-wrist", system:"muscular", layer:1,
 action:"Bends the elbow, strongest with the thumb pointing up.",
 clinical:"Frequently tender in anyone doing repetitive gripping with a neutral forearm — hammering, racquet sports, manual therapy itself.",
 ex:["Hammer Rotation","Forearm Rotation","Grip Squeeze","Wrist Extensor Stretch"]},

{id:"elbow-pronator-teres", name:"Pronator Teres", latin:"m. pronator teres", region:"elbow-wrist", system:"muscular", layer:2,
 action:"Turns the palm downward.",
 clinical:"The median nerve passes between its two heads — a compression site that mimics carpal tunnel but with forearm symptoms too.",
 ex:["Forearm Rotation","Median Nerve Slider","Hammer Rotation","Wrist Flexor Stretch"]},

{id:"elbow-carpal-tunnel", name:"Carpal Tunnel", latin:"canalis carpi", region:"elbow-wrist", system:"fascial", layer:2,
 action:"Passage at the front of the wrist carrying the median nerve and finger flexor tendons.",
 clinical:"Symptoms in the thumb, index and middle fingers, typically worse at night. Glide the nerve, do not stretch it — and check the neck and pronator teres before assuming the wrist.",
 ex:["Median Nerve Slider","Tendon Glides","Wrist Flexor Stretch","Cervical Lateral Glide"]},

{id:"elbow-first-compartment", name:"First Dorsal Compartment", latin:"compartimentum extensorum primum", region:"elbow-wrist", system:"fascial", layer:2,
 action:"Sheath at the thumb side of the wrist carrying the thumb's long tendons.",
 clinical:"De Quervain's. Extremely common in new parents from repeated lifting with the thumb out. Provokes easily — go gently.",
 ex:["Thumb and First Compartment Stretch","Wrist Circles","Radial and Ulnar Deviation","Hammer Radial Deviation"]},

{id:"elbow-joint", name:"Elbow Joint", latin:"articulatio cubiti", region:"elbow-wrist", system:"articular", layer:3,
 action:"Hinge for bending, plus a rotating joint at the radial head for turning the forearm.",
 clinical:"The last few degrees of straightening are the first thing lost and the hardest to get back. Time under a light load beats forcing.",
 ex:["Elbow Extension Hold","Elbow Flexion and Extension","Forearm Rotation","Prone Hang"]},

/* -- anterior forearm: the six that inherit from Wrist Flexors --
   Each child carries only what is specific to it; the shared flexor work comes
   from the parent, so it is stated once and verified once. */
{id:"elbow-wrist-fcr", name:"Flexor Carpi Radialis", latin:"m. flexor carpi radialis", region:"elbow-wrist", system:"muscular", layer:1,
 inherits:"elbow-wrist-flexors",
 action:"Bends the wrist and tilts the hand toward the thumb side.",
 clinical:"One of the main contributors to golfer's elbow through the shared inner-elbow tendon. Its own tendon is a prominent cord at the front of the wrist and a useful landmark.",
 ex:["Hammer Radial Deviation"]},

{id:"elbow-wrist-fcu", name:"Flexor Carpi Ulnaris", latin:"m. flexor carpi ulnaris", region:"elbow-wrist", system:"muscular", layer:1,
 inherits:"elbow-wrist-flexors",
 action:"Bends the wrist and tilts the hand toward the little-finger side.",
 clinical:"The ulnar nerve runs between its two heads at the elbow, so a tight or overworked FCU is a genuine compression site. Treating the elbow flexor mass matters as much as treating the nerve.",
 ex:["Ulnar Nerve Slider"]},

{id:"elbow-wrist-palmaris-longus", name:"Palmaris Longus", latin:"m. palmaris longus", region:"elbow-wrist", system:"muscular", layer:1,
 inherits:"elbow-wrist-flexors",
 action:"A thin muscle running to the palm, tensioning the palmar fascia.",
 clinical:"Absent in roughly one person in seven, on one or both sides — so a missing tendon is a normal variant, not a finding. Because it is expendable it is the usual tendon-graft donor.",
 ex:["Palmar Fascia Stretch"]},

{id:"elbow-wrist-fds", name:"Flexor Digitorum Superficialis", latin:"m. flexor digitorum superficialis", region:"elbow-wrist", system:"muscular", layer:2,
 inherits:"elbow-wrist-flexors",
 action:"Bends the middle joint of the fingers.",
 clinical:"Each finger carries two flexor tendons; this is the superficial one and it splits to let the deep tendon pass through. That crossing point is where trigger finger catches.",
 ex:["Tendon Glides","Intrinsic Plus Hold"]},

{id:"elbow-wrist-fdp", name:"Flexor Digitorum Profundus", latin:"m. flexor digitorum profundus", region:"elbow-wrist", system:"muscular", layer:2,
 inherits:"elbow-wrist-flexors",
 action:"Bends the fingertip joints. The only muscle that can.",
 clinical:"Split supply — median nerve to the index and middle fingers, ulnar to the ring and little. That split is why an ulnar nerve problem weakens the grip of only the last two fingers.",
 ex:["Tendon Glides","Grip Squeeze"]},

{id:"elbow-wrist-fpl", name:"Flexor Pollicis Longus", latin:"m. flexor pollicis longus", region:"elbow-wrist", system:"muscular", layer:2,
 inherits:"elbow-wrist-flexors",
 action:"Bends the tip of the thumb.",
 clinical:"The only muscle that bends the thumb tip. Loss of that movement with an intact grip is a specific sign of a median nerve problem above the wrist rather than at the carpal tunnel.",
 ex:["Tendon Glides","Thumb Opposition"]},

/* -- anterior forearm: the rest -- */
{id:"elbow-wrist-pronator-quadratus", name:"Pronator Quadratus", latin:"m. pronator quadratus", region:"elbow-wrist", system:"muscular", layer:2,
 action:"Deep square muscle joining the two forearm bones just above the wrist. The primary muscle that turns the palm down.",
 clinical:"Does most of the pronation work; pronator teres only assists under load. Sits directly on the interosseous membrane, so it is involved after distal forearm fractures.",
 ex:["Forearm Rotation","Hammer Rotation","Wrist Circles"]},

{id:"elbow-wrist-brachialis", name:"Brachialis", latin:"m. brachialis", region:"elbow-wrist", system:"muscular", layer:2,
 action:"Lies under the biceps and bends the elbow. The true workhorse of elbow flexion.",
 clinical:"Works regardless of forearm position, unlike biceps. Pain blamed on the biceps in front of the elbow is very often brachialis — palpate either side of the biceps tendon, not on it.",
 ex:["Elbow Flexion and Extension","Elbow Extension Hold","Wrist Flexor Stretch"]},

/* -- posterior forearm -- */
{id:"elbow-wrist-ecrl", name:"Extensor Carpi Radialis Longus", latin:"m. extensor carpi radialis longus", region:"elbow-wrist", system:"muscular", layer:1,
 action:"Straightens the wrist and tilts the hand toward the thumb. Attaches above the elbow rather than at the shared tendon.",
 clinical:"Because it attaches higher, it loads most with the elbow bent — which is why some people with tennis elbow hurt more carrying a bag than gripping with a straight arm.",
 ex:["Wrist Extensor Isometric","Eccentric Wrist Extension","Hammer Radial Deviation","Wrist Extensor Stretch"]},

{id:"elbow-wrist-ed", name:"Extensor Digitorum", latin:"m. extensor digitorum", region:"elbow-wrist", system:"muscular", layer:1,
 action:"Straightens the fingers at the knuckles.",
 clinical:"Its tendons are linked across the back of the hand, which is why lifting the ring finger alone is difficult. Loss of finger extension with intact wrist extension points at the radial nerve below the elbow.",
 ex:["Finger Extension with Band","Tendon Glides","Wrist Extensor Stretch","Finger Spread and Squeeze"]},

{id:"elbow-wrist-edm", name:"Extensor Digiti Minimi", latin:"m. extensor digiti minimi", region:"elbow-wrist", system:"muscular", layer:1,
 action:"Independently straightens the little finger.",
 clinical:"Gives the little finger extension that does not depend on the shared tendon linkage. Minor on its own, useful for distinguishing a tendon problem from a nerve one.",
 ex:["Finger Extension with Band","Tendon Glides","Finger Spread and Squeeze"]},

{id:"elbow-wrist-ecu", name:"Extensor Carpi Ulnaris", latin:"m. extensor carpi ulnaris", region:"elbow-wrist", system:"muscular", layer:1,
 action:"Straightens the wrist and tilts the hand toward the little-finger side.",
 clinical:"Its tendon sits in a groove that can snap in and out as the forearm rotates — a painful click on the little-finger side of the wrist with supination. Common in racquet sports and a frequent cause of ulnar wrist pain.",
 ex:["Wrist Extensor Isometric","Forearm Rotation","Radial and Ulnar Deviation","Wrist Circles"]},

{id:"elbow-wrist-ei", name:"Extensor Indicis", latin:"m. extensor indicis", region:"elbow-wrist", system:"muscular", layer:2,
 action:"Independently straightens the index finger.",
 clinical:"Allows pointing without lifting the other fingers. Frequently harvested as a tendon transfer when the thumb extensor ruptures.",
 ex:["Finger Extension with Band","Tendon Glides","Intrinsic Plus Hold"]},

{id:"elbow-wrist-epl", name:"Extensor Pollicis Longus", latin:"m. extensor pollicis longus", region:"elbow-wrist", system:"muscular", layer:2,
 action:"Straightens the tip of the thumb and lifts it back away from the palm.",
 clinical:"Its tendon hooks around a bony ridge on the back of the wrist, where its blood supply is poor. Rupture weeks to months after a wrist fracture is a known and easily missed complication — inability to lift the thumb off a flat table is the test.",
 ex:["Thumb and First Compartment Stretch","Finger Extension with Band","Thumb Opposition","Wrist Circles"]},

{id:"elbow-wrist-anconeus", name:"Anconeus", latin:"m. anconeus", region:"elbow-wrist", system:"muscular", layer:1,
 action:"Small triangular muscle at the back of the elbow that assists extension and steadies the joint.",
 clinical:"Sits directly over the outer elbow, so it is frequently tender in tennis elbow and mistaken for the extensor origin. Palpate slightly behind and below the epicondyle to tell them apart.",
 ex:["Elbow Flexion and Extension","Wrist Extensor Isometric","Elbow Extension Hold"]},

{id:"elbow-wrist-supinator", name:"Supinator", latin:"m. supinator", region:"elbow-wrist", system:"muscular", layer:2,
 action:"Wraps around the upper forearm and turns the palm upward.",
 clinical:"The deep branch of the radial nerve passes straight through it. That makes it a compression site producing outer-elbow pain that mimics tennis elbow but sits a few centimetres further down and does not respond to tendon loading. Worth testing before adding more load.",
 ex:["Forearm Rotation","Radial Nerve Slider","Hammer Rotation","Wrist Extensor Stretch"]},

/* -- hand intrinsics -- */
{id:"elbow-wrist-thenar", name:"Thenar Group", latin:"mm. thenaris", region:"elbow-wrist", system:"muscular", layer:2,
 action:"The muscular bulge at the base of the thumb. Moves the thumb across the palm to meet the fingers.",
 clinical:"Median nerve supplied. Visible flattening of this bulge is a late and serious sign of carpal tunnel syndrome — by then the nerve has been compressed a long time.",
 ex:["Thumb Opposition","Thumb Base Isometric","Grip Squeeze","Putty or Rice Bucket Work"]},

{id:"elbow-wrist-hypothenar", name:"Hypothenar Group", latin:"mm. hypothenaris", region:"elbow-wrist", system:"muscular", layer:2,
 action:"The bulge at the base of the little finger, moving and cupping that side of the hand.",
 clinical:"Ulnar nerve supplied. Wasting here alongside a normal thumb bulge separates an ulnar problem from a median one at a glance.",
 ex:["Finger Spread and Squeeze","Grip Squeeze","Putty or Rice Bucket Work","Intrinsic Plus Hold"]},

{id:"elbow-wrist-adductor-pollicis", name:"Adductor Pollicis", latin:"m. adductor pollicis", region:"elbow-wrist", system:"muscular", layer:2,
 action:"Draws the thumb in toward the palm. The main muscle of a key pinch.",
 clinical:"Ulnar supplied. When it is weak the thumb tip bends to compensate during a pinch — the thumb buckling while gripping paper is a classic ulnar nerve sign.",
 ex:["Thumb Base Isometric","Grip Squeeze","Thumb Opposition","Putty or Rice Bucket Work"]},

{id:"elbow-wrist-lumbricals", name:"Lumbricals of the Hand", latin:"mm. lumbricales manus", region:"elbow-wrist", system:"muscular", layer:2,
 action:"Four small muscles that bend the knuckles while straightening the finger joints beyond them.",
 clinical:"Produce the L-shaped finger position that a stiff or swollen hand loses first. No amount of gripping trains them — the position has to be trained directly.",
 ex:["Intrinsic Plus Hold","Tendon Glides","Finger Spread and Squeeze","Putty or Rice Bucket Work"]},

{id:"elbow-wrist-interossei", name:"Interossei of the Hand", latin:"mm. interossei dorsales et palmares", region:"elbow-wrist", system:"muscular", layer:2,
 action:"Spread and close the fingers, and assist the lumbricals in the L-shaped position.",
 clinical:"All ulnar supplied. Hollowing of the web space between thumb and index is the earliest visible sign of ulnar nerve trouble and is easy to spot by comparing hands.",
 ex:["Finger Spread and Squeeze","Intrinsic Plus Hold","Putty or Rice Bucket Work","Ulnar Nerve Slider"]},

/* -- joints and connective tissue -- */
{id:"elbow-wrist-proximal-ru-joint", name:"Proximal Radioulnar Joint", latin:"articulatio radioulnaris proximalis", region:"elbow-wrist", system:"articular", layer:3,
 action:"Where the radius head spins inside a ring of ligament at the elbow, allowing the forearm to rotate.",
 clinical:"Held by the annular ligament. In young children a sharp pull on the arm slips the radius head out of that ring — the classic pulled elbow, which reduces easily and is not a fracture.",
 ex:["Forearm Rotation","Hammer Rotation","Elbow Flexion and Extension"]},

{id:"elbow-wrist-distal-ru-joint", name:"Distal Radioulnar Joint", latin:"articulatio radioulnaris distalis", region:"elbow-wrist", system:"articular", layer:3,
 action:"Where the two forearm bones meet at the wrist, completing forearm rotation.",
 clinical:"Cushioned by a cartilage complex on the little-finger side. Ulnar wrist pain worse with rotation and gripping, particularly after a fall onto an outstretched hand, points here.",
 ex:["Forearm Rotation","Hammer Rotation","Radial and Ulnar Deviation","Wrist Circles"]},

{id:"elbow-wrist-interosseous-membrane", name:"Interosseous Membrane", latin:"membrana interossea antebrachii", region:"elbow-wrist", system:"fascial", layer:2,
 action:"A fibrous sheet between the two forearm bones that transfers load between them.",
 clinical:"Load through the hand is shared between radius and ulna via this sheet. When it tears alongside a radial head fracture the ulna migrates upward — a combination that turns a simple fracture into a difficult one.",
 ex:["Forearm Rotation","Wrist Weight-Bearing Progression","Hammer Rotation"]},

{id:"elbow-wrist-flexor-retinaculum", name:"Flexor Retinaculum", latin:"retinaculum musculorum flexorum", region:"elbow-wrist", system:"fascial", layer:2,
 action:"A tough band across the front of the wrist forming the roof of the carpal tunnel.",
 clinical:"The tunnel cannot expand — the floor is bone and the roof is this band. Anything that increases the contents, including swelling and fluid retention, raises pressure on the nerve. That is why symptoms are worst at night.",
 ex:["Median Nerve Slider","Tendon Glides","Wrist Flexor Stretch","Prayer and Reverse Prayer"]},

{id:"elbow-wrist-extensor-retinaculum", name:"Extensor Retinaculum", latin:"retinaculum musculorum extensorum", region:"elbow-wrist", system:"fascial", layer:2,
 action:"A band across the back of the wrist holding the extensor tendons down, divided into six compartments.",
 clinical:"Each compartment can inflame separately. The first, on the thumb side, is de Quervain's; the sixth, on the little-finger side, is the ECU tendon. Knowing which compartment is tender names the problem.",
 ex:["Thumb and First Compartment Stretch","Wrist Circles","Radial and Ulnar Deviation","Wrist Extensor Stretch"]},

{id:"elbow-wrist-palmar-aponeurosis", name:"Palmar Aponeurosis", latin:"aponeurosis palmaris", region:"elbow-wrist", system:"fascial", layer:1,
 action:"A triangular sheet of fascia across the palm, protecting what runs beneath it and anchoring the skin for grip.",
 clinical:"Where Dupuytren's contracture forms — painless cords and nodules that gradually pull the ring and little fingers into the palm. Stretching does not reverse it, but keeping the palm mobile is worth doing early.",
 ex:["Palmar Fascia Stretch","Tendon Glides","Finger Spread and Squeeze","Putty or Rice Bucket Work"]},

{id:"elbow-wrist-guyons-canal", name:"Guyon's Canal", latin:"canalis ulnaris", region:"elbow-wrist", system:"fascial", layer:2,
 action:"A small tunnel on the little-finger side of the wrist carrying the ulnar nerve into the hand.",
 clinical:"Distinguishes itself from cubital tunnel by what it spares — the back of the hand keeps normal sensation, because that branch leaves the nerve before the wrist. Classic in cyclists from handlebar pressure.",
 ex:["Ulnar Nerve Slider","Finger Spread and Squeeze","Wrist Circles","Prayer and Reverse Prayer"]},

{id:"elbow-wrist-cubital-tunnel", name:"Cubital Tunnel", latin:"canalis cubitalis", region:"elbow-wrist", system:"fascial", layer:2,
 action:"The groove behind the inner elbow where the ulnar nerve passes, roofed by a fibrous band.",
 clinical:"The tunnel narrows as the elbow bends, which is why symptoms come on during phone calls and on waking with a bent arm. Numbness covering both the front and back of the little finger side places the problem here rather than at the wrist.",
 ex:["Ulnar Nerve Slider","Ulnar Nerve Tensioner","Wrist Flexor Stretch","Elbow Extension Hold"]},

{id:"elbow-wrist-joint", name:"Wrist Joint Complex", latin:"articulationes carpi", region:"elbow-wrist", system:"articular", layer:3,
 action:"Two rows of small bones giving the wrist movement in every direction.",
 clinical:"Weight-bearing through the hand needs roughly 70 degrees of extension. Most desk-bound people are well short and load the joint at end range instead.",
 ex:["Quadruped Wrist Rocks","Reverse Quadruped Wrist Rocks","Wrist Weight-Bearing Progression","Wrist Circles"]},

/* ---- Thoracic — 10 ---- */
{id:"thoracic-erector-spinae", name:"Thoracic Erector Spinae", latin:"m. erector spinae pars thoracis", region:"thoracic", system:"muscular", layer:2,
 action:"Runs the length of the back, extending the spine and controlling forward bending.",
 clinical:"Works eccentrically far more than concentrically — it controls the descent rather than driving the lift.",
 ex:["Foam Roller Thoracic Extension","Sphinx to Cobra","Prone Y-T-W-I","Bench Thoracic Extension"]},

{id:"thoracic-multifidus", name:"Thoracic Multifidus", latin:"m. multifidus thoracis", region:"thoracic", system:"muscular", layer:2,
 action:"Small deep muscles crossing two or three levels, controlling movement segment by segment.",
 clinical:"Provides local control rather than gross movement. Segmental work reaches it; global extension does not.",
 ex:["Cat-Cow","Segmental Bridge","Bird Dog","Quadruped Rotation (hand behind head)"]},

{id:"thoracic-facets", name:"Thoracic Facet Joints", latin:"articulationes zygapophysiales thoracicae", region:"thoracic", system:"articular", layer:3,
 action:"Oriented to favour rotation, which is why the upper back is the body's main rotation engine.",
 clinical:"When these stiffen, the lumbar spine supplies the rotation instead — and it is not built for it. The most consequential stiffness in the body.",
 ex:["Open Book","Quadruped Rotation (hand behind head)","Seated-on-Heels Rotation","Standing Wall Rotation (ball between knees)"]},

{id:"thoracic-costovertebral", name:"Costovertebral Joints", latin:"articulationes costovertebrales", region:"thoracic", system:"articular", layer:3,
 action:"Where each rib meets the spine — they move with every breath.",
 clinical:"Sharp, well-localised back pain that catches on a deep breath usually sits here. Breathing work reaches it better than stretching does.",
 ex:["Rib Roll Breathing","Open Book","Foam Roller Thoracic Extension","Child's Pose Lateral Reach"]},

{id:"thoracic-ribs", name:"Ribs", latin:"costae", region:"thoracic", system:"skeletal", layer:3,
 action:"Twelve pairs forming the ribcage, moving with breathing.",
 clinical:"Ribcage expansion caps upper back rotation. If the ribs do not move, rotation work has a ceiling no amount of stretching will lift.",
 ex:["Rib Roll Breathing","Child's Pose Lateral Reach","Open Book","Standing Lateral Flexion with Reach"]},

{id:"thoracic-diaphragm", name:"Diaphragm", latin:"diaphragma", region:"thoracic", system:"muscular", layer:2,
 action:"The primary breathing muscle, and part of the pressure system that stabilises the trunk.",
 clinical:"Breathing and trunk stability share the same muscle. Someone breathing through their neck is not going to brace well, whatever core work you give them.",
 ex:["Rib Roll Breathing","Pelvic Tilts","Dead Bug","Child's Pose Lateral Reach"]},

{id:"thoracic-intercostals", name:"Intercostals", latin:"mm. intercostales", region:"thoracic", system:"muscular", layer:2,
 action:"Between the ribs, controlling their movement during breathing.",
 clinical:"Restriction here limits both breathing depth and trunk rotation. Side-bending with a long exhale reaches them best.",
 ex:["Child's Pose Lateral Reach","Rib Roll Breathing","Standing Lateral Flexion with Reach","Side-Lying Windmill"]},

{id:"thoracic-vertebrae", name:"Thoracic Vertebrae", latin:"vertebrae thoracicae T1-T12", region:"thoracic", system:"skeletal", layer:3,
 action:"Twelve bones, each anchored to a pair of ribs, forming the least mobile part of the spine.",
 clinical:"The cervicothoracic junction at the top is usually the stiffest point and the true cause of many complaints blamed on the neck.",
 ex:["Cervicothoracic Junction Extension","Foam Roller Thoracic Extension","Peanut Segmental Extension","Bench Thoracic Extension"]},

{id:"thoracic-tl-junction", name:"Thoracolumbar Junction", latin:"junctura thoracolumbalis", region:"thoracic", system:"articular", layer:3,
 action:"Where the rotating upper back meets the non-rotating lower back at T12-L1.",
 clinical:"A transition point and therefore a concentration point for load. Frequently symptomatic in rotational athletes.",
 ex:["Standing Wall Rotation (ball between knees)","Half-Kneeling Rotation with Dowel","Bird Dog","Pallof Press"]},

{id:"thoracic-serratus-posterior", name:"Serratus Posterior", latin:"mm. serrati posteriores", region:"thoracic", system:"muscular", layer:2,
 action:"Thin sheets under the shoulder blade assisting rib movement in breathing.",
 clinical:"Often the source of a deep ache under the shoulder blade that resists surface work because it sits beneath the blade.",
 ex:["Rib Roll Breathing","Thread the Needle","Open Book","Prone Swimmers"]},

/* ---- Lumbar — 12 ---- */
{id:"lumbar-erector-spinae", name:"Lumbar Erector Spinae", latin:"m. erector spinae pars lumborum", region:"lumbar", system:"muscular", layer:2,
 action:"Extends the low back and controls the descent into forward bending.",
 clinical:"Almost always overworking rather than weak. It stays switched on because the deeper system is not doing its job — chasing it with more extension work makes things worse.",
 ex:["Prone Press-Up","Cat-Cow","Bird Dog","Child's Pose Lateral Reach"]},

{id:"lumbar-multifidus", name:"Lumbar Multifidus", latin:"m. multifidus lumborum", region:"lumbar", system:"muscular", layer:2,
 action:"Small deep muscles controlling one or two segments at a time.",
 clinical:"Measurably shrinks within days of a back injury and does not recover on its own once pain settles. Segmental control work reaches it; deadlifts do not.",
 ex:["Segmental Bridge","Bird Dog","Dead Bug","Cat-Cow"]},

{id:"lumbar-ql", name:"Quadratus Lumborum", latin:"m. quadratus lumborum", region:"lumbar", system:"muscular", layer:2,
 action:"Hikes the hip, side-bends the trunk, and steadies the twelfth rib for breathing.",
 clinical:"The classic one-sided low back ache in people who stand on one leg, carry a child on one hip, or sit twisted. Side plank work is the answer more often than stretching.",
 ex:["Side Plank","Standing Lateral Flexion with Reach","Suitcase Carry","Child's Pose Lateral Reach"]},

{id:"lumbar-psoas", name:"Psoas Major", latin:"m. psoas major", region:"lumbar", system:"muscular", layer:2,
 action:"Lifts the thigh and attaches directly to every lumbar vertebra.",
 clinical:"Filed under lumbar rather than hip because it attaches to the spine — a short psoas pulls the low back into extension. It also fatigues into the arched-back posture at the end of a long day.",
 ex:["Half-Kneeling Hip Flexor Series","Dead Bug","Wall Press March","Pelvic Tilts"]},

{id:"lumbar-tva", name:"Transversus Abdominis", latin:"m. transversus abdominis", region:"lumbar", system:"muscular", layer:2,
 action:"The deepest abdominal layer, wrapping the trunk like a corset and raising internal pressure.",
 clinical:"Timing matters more than strength — it should fire fractionally before a limb moves, and after injury it fires late. Train the timing, not the crunch.",
 ex:["Dead Bug","Pelvic Tilts","Bird Dog","Bear Crawl"]},

{id:"lumbar-obliques", name:"Obliques", latin:"mm. obliquus externus et internus abdominis", region:"lumbar", system:"muscular", layer:1,
 action:"Rotate and side-bend the trunk, and resist both.",
 clinical:"In a rotational athlete their main job is resisting rotation, not producing it. Anti-rotation work loads them harder than any twisting exercise.",
 ex:["Pallof Press","Side Plank","Half-Kneeling Chop","Offset / Uneven Carry"]},

{id:"lumbar-rectus-abdominis", name:"Rectus Abdominis", latin:"m. rectus abdominis", region:"lumbar", system:"muscular", layer:1,
 action:"Bends the trunk forward and resists the back arching.",
 clinical:"Its useful role is anti-extension — holding the ribs down under load — rather than curling up. That is what the serve position and the overhead press demand.",
 ex:["Dead Bug","Hollow Body Hold","Ab Wheel / Ball Rollout","Standing Banded Overhead Press"]},

{id:"lumbar-tl-fascia", name:"Thoracolumbar Fascia", latin:"fascia thoracolumbalis", region:"lumbar", system:"fascial", layer:2,
 action:"Broad sheet across the low back linking the lats above to the glutes below.",
 clinical:"The mechanical link between opposite shoulder and hip. Explains why a shoulder problem shows up as low back stiffness and the reverse.",
 ex:["Bird Dog","Kneeling Lat Stretch","Glute Bridge Series","Half-Kneeling Chop"]},

{id:"lumbar-facets", name:"Lumbar Facet Joints", latin:"articulationes zygapophysiales lumbales", region:"lumbar", system:"articular", layer:3,
 action:"Oriented to permit bending and block rotation.",
 clinical:"Pain worse with extension and rotation, easier with flexion — the opposite pattern to a disc. Loads hard in the kick serve and the overhead position.",
 ex:["Quadruped Rock Back","Supine Lower Trunk Rotation","Pallof Press","Dead Bug"]},

{id:"lumbar-discs", name:"Lumbar Discs", latin:"disci intervertebrales lumbales", region:"lumbar", system:"articular", layer:3,
 action:"Shock absorbers between the lumbar vertebrae.",
 clinical:"Typically worse sitting and bending, easier standing and walking, worst first thing in the morning. Screen the direction of preference before prescribing anything.",
 ex:["Prone Press-Up","Sphinx to Cobra","Pelvic Tilts","Dead Bug"]},

{id:"lumbar-sij", name:"Sacroiliac Joint", latin:"articulatio sacroiliaca", region:"lumbar", system:"articular", layer:3,
 action:"Where the spine meets the pelvis. Very little movement — its job is transferring load between trunk and legs.",
 clinical:"Pain typically pointed to with one finger just below the belt line. Usually a load-transfer problem, so single leg strength work beats mobilisation.",
 ex:["Single Leg RDL","Glute Bridge Series","Side Plank","Suitcase Carry"]},

{id:"lumbar-pelvic-floor", name:"Pelvic Floor", latin:"diaphragma pelvis", region:"lumbar", system:"muscular", layer:2,
 action:"Forms the base of the abdominal pressure system and works with the diaphragm on every breath.",
 clinical:"Part of the same canister as the diaphragm and transversus abdominis. Breath-holding through effort is a sign the system is not coordinating — and it belongs in any low back conversation, including with men.",
 ex:["Dead Bug","Rib Roll Breathing","Pelvic Tilts","Glute Bridge Series"]},

/* ---- Hip — 15 ---- */
{id:"hip-glute-max", name:"Gluteus Maximus", latin:"m. gluteus maximus", region:"hip", system:"muscular", layer:1,
 action:"Extends the hip and rotates it outward. The largest muscle in the body.",
 clinical:"Strong in almost everyone, poorly recruited in many. If the hamstrings cramp during bridging, it is not firing.",
 ex:["Glute Bridge Series","Split Squat to Bulgarian","Single Leg RDL","Step Up"]},

{id:"hip-glute-med", name:"Gluteus Medius", latin:"m. gluteus medius", region:"hip", system:"muscular", layer:2,
 action:"Holds the pelvis level when standing on one leg.",
 clinical:"The single most important muscle for single leg control. Its failure shows as a dropping pelvis or a knee falling inward — and it shows on the stance leg, not the moving one.",
 ex:["Standing Banded Abduction","Lateral Band Walks","Side Plank with Clam","Single Leg Squat to Box"]},

{id:"hip-glute-min", name:"Gluteus Minimus", latin:"m. gluteus minimus", region:"hip", system:"muscular", layer:2,
 action:"Works with gluteus medius to steady the pelvis and rotate the hip inward.",
 clinical:"Refers pain down the outside of the leg convincingly enough to be mistaken for sciatica.",
 ex:["Lateral Band Walks","Standing Banded Abduction","Hip Airplane","Single Leg Balance Progression"]},

{id:"hip-tfl", name:"Tensor Fasciae Latae", latin:"m. tensor fasciae latae", region:"hip", system:"muscular", layer:1,
 action:"Bends and abducts the hip, and tensions the IT band.",
 clinical:"Takes over abduction when gluteus medius is weak. Persistent TFL tightness is usually a symptom, not the problem — train the glute rather than stretching this.",
 ex:["Half-Kneeling Hip Flexor Series","Lateral Thigh Roll","Standing Banded Abduction","Supine Figure-4 to Active Pigeon"]},

{id:"hip-itb", name:"Iliotibial Band", latin:"tractus iliotibialis", region:"hip", system:"fascial", layer:1,
 action:"Thick fascial band from the pelvis to just below the knee.",
 clinical:"It does not meaningfully lengthen — it is not a stretchable structure. Symptoms come from compression at the knee under poor hip control, so treat the hip.",
 ex:["Lateral Thigh Roll","Standing Banded Abduction","Eccentric Step Down","Lateral Band Walks"]},

{id:"hip-piriformis", name:"Piriformis", latin:"m. piriformis", region:"hip", system:"muscular", layer:2,
 action:"Rotates the hip outward with the leg straight, and inward once the hip is bent past 90 degrees.",
 clinical:"The sciatic nerve runs beneath it, and through it in a minority of people. Buttock pain with leg symptoms — test the nerve before deciding it is the muscle.",
 ex:["Supine Figure-4 to Active Pigeon","Hip CARs (Controlled Rotations)","Sciatic Nerve Slider (seated)","Prone Windshield Wipers"]},

{id:"hip-deep-rotators", name:"Deep External Rotators", latin:"mm. obturatorii, gemelli, quadratus femoris", region:"hip", system:"muscular", layer:2,
 action:"Small deep muscles steering hip rotation and holding the head of the femur in the socket.",
 clinical:"The hip's equivalent of the rotator cuff. Rarely trained directly, and limited internal rotation usually traces here.",
 ex:["Prone Windshield Wipers","Seated 90/90 Lift-Offs","Hip CARs (Controlled Rotations)","Hip Airplane"]},

{id:"hip-adductor-longus", name:"Adductor Longus & Brevis", latin:"mm. adductor longus et brevis", region:"hip", system:"muscular", layer:1,
 action:"Draw the leg toward the midline and assist hip flexion.",
 clinical:"Adductor longus is the most commonly strained groin muscle in change-of-direction sport. Copenhagen work is the strongest protection and is almost universally skipped.",
 ex:["Copenhagen Plank","Adductor Rock Back","Cossack Squat","Frog Rock"]},

{id:"hip-adductor-magnus", name:"Adductor Magnus", latin:"m. adductor magnus", region:"hip", system:"muscular", layer:2,
 action:"The largest adductor. Its rear portion functions as a hip extensor alongside the hamstrings.",
 clinical:"Effectively a fourth hamstring. Contributes significantly to hip extension power and is frequently missed in hamstring rehab.",
 ex:["Copenhagen Plank","Cossack Squat","Single Leg RDL","Deep Squat Hold"]},

{id:"hip-gracilis", name:"Gracilis", latin:"m. gracilis", region:"hip", system:"muscular", layer:1,
 action:"Long thin adductor crossing both hip and knee.",
 clinical:"Crossing two joints means knee position changes its length — test adduction with the knee both bent and straight.",
 ex:["Adductor Rock Back","Frog Rock","Cossack Squat","Copenhagen Plank"]},

{id:"hip-iliacus", name:"Iliacus", latin:"m. iliacus", region:"hip", system:"muscular", layer:2,
 action:"Lines the inner pelvis and joins psoas to lift the thigh.",
 clinical:"Unlike psoas it does not attach to the spine, so it affects hip position without directly pulling on the low back.",
 ex:["Half-Kneeling Hip Flexor Series","Wall Press March","Pelvic Tilts","Deep Squat Hold"]},

{id:"hip-rectus-femoris", name:"Rectus Femoris", latin:"m. rectus femoris", region:"hip", system:"muscular", layer:1,
 action:"The only quadriceps head crossing the hip as well as the knee.",
 clinical:"Because it crosses both, it must be tested with the hip extended and knee bent together. A tight rectus femoris tips the pelvis forward and is frequently misread as a low back problem.",
 ex:["Half-Kneeling Hip Flexor Series","Quadriceps Stretch","Reverse Nordic","Bretzel 2"]},

{id:"hip-hamstring-origin", name:"Hamstring Origin", latin:"origo ischiocruralis, tuber ischiadicum", region:"hip", system:"muscular", layer:2,
 action:"Common attachment of the hamstrings at the sitting bone.",
 clinical:"High hamstring tendinopathy — deep buttock pain, worse sitting on a hard chair and worse with stretching. Stretch it and it gets worse; load it and it improves.",
 ex:["Hamstring Bridge","Single Leg RDL","Nordic Hamstring Curl","Slider Hamstring Curl"]},

{id:"hip-joint", name:"Hip Joint & Labrum", latin:"articulatio coxae, labrum acetabuli", region:"hip", system:"articular", layer:3,
 action:"Deep ball and socket, built for stability under load.",
 clinical:"Deep front-of-groin pain with a pinch at end-range flexion and internal rotation. Limited internal rotation is the earliest sign — measure it every visit.",
 ex:["Hip CARs (Controlled Rotations)","Banded Hip Distraction","Prone Windshield Wipers","90/90 Hip Switch"]},

{id:"hip-pubic-symphysis", name:"Pubic Symphysis", latin:"symphysis pubica", region:"hip", system:"articular", layer:3,
 action:"The cartilage joint at the front of the pelvis.",
 clinical:"Loads where the two sides of the pelvis move asymmetrically — kicking, lunging, or late pregnancy. Adductor and deep abdominal work together, not either alone.",
 ex:["Copenhagen Plank","Dead Bug","Adductor Rock Back","Side Plank"]},

/* ---- Knee — 14 ---- */
{id:"knee-quadriceps", name:"Quadriceps", latin:"mm. vasti lateralis, medialis, intermedius", region:"knee", system:"muscular", layer:1,
 action:"Straighten the knee and control the descent of every step down.",
 clinical:"Switches off remarkably fast after knee swelling — within days. Reawakening it with quad sets comes before anything else.",
 ex:["Quad Set","Short Arc Quad","Squat Progression","Sit-to-Stand Progression"]},

{id:"knee-vmo", name:"Vastus Medialis Oblique", latin:"m. vastus medialis obliquus", region:"knee", system:"muscular", layer:2,
 action:"The inner fibres of the quadriceps that steady the kneecap in its groove.",
 clinical:"Cannot be trained in isolation despite decades of claims otherwise. Train the quadriceps through full range and it comes with it.",
 ex:["Short Arc Quad","Spanish Squat","Step Up","Terminal Knee Extension"]},

{id:"knee-hamstrings", name:"Hamstrings", latin:"mm. biceps femoris, semitendinosus, semimembranosus", region:"knee", system:"muscular", layer:1,
 action:"Bend the knee and extend the hip.",
 clinical:"Injuries happen while lengthening under load, not while shortening — which is why Nordic curls protect and hamstring curls largely do not.",
 ex:["Nordic Hamstring Curl","Slider Hamstring Curl","Single Leg RDL","Hamstring Bridge"]},

{id:"knee-popliteus", name:"Popliteus", latin:"m. popliteus", region:"knee", system:"muscular", layer:2,
 action:"Unlocks the fully straight knee by rotating the shin inward.",
 clinical:"Small, deep and easily missed. A source of vague back-of-knee pain, particularly in downhill running.",
 ex:["Shin Rotation","Knee CARs","Heel Slides","Calf Stretch, Knee Bent"]},

{id:"knee-patellar-tendon", name:"Patellar Tendon", latin:"ligamentum patellae", region:"knee", system:"fascial", layer:2,
 action:"Connects the kneecap to the shin and transmits all quadriceps force.",
 clinical:"Jumper's knee. Isometrics reduce pain for hours; heavy slow loading and decline work rebuild it. Rest alone reliably fails.",
 ex:["Isometric Wall Sit at 60 Degrees","Decline Squat","Spanish Squat","Single Leg Wall Sit"]},

{id:"knee-quad-tendon", name:"Quadriceps Tendon", latin:"tendo m. quadricipitis femoris", region:"knee", system:"fascial", layer:2,
 action:"Connects the quadriceps to the top of the kneecap.",
 clinical:"Less common than patellar tendon problems but managed identically. Tenderness sits above the kneecap rather than below.",
 ex:["Isometric Wall Sit at 60 Degrees","Spanish Squat","Squat Progression","Reverse Nordic"]},

{id:"knee-acl", name:"Anterior Cruciate Ligament", latin:"ligamentum cruciatum anterius", region:"knee", system:"articular", layer:3,
 action:"Stops the shin sliding forward on the thigh and controls rotation.",
 clinical:"Most injuries are non-contact, on landing or cutting with the knee collapsing inward. Landing mechanics and hop control are the prevention and the return-to-sport gate.",
 ex:["Landing Mechanics","Hop and Stick","Nordic Hamstring Curl","Lateral Step Down"]},

{id:"knee-pcl", name:"Posterior Cruciate Ligament", latin:"ligamentum cruciatum posterius", region:"knee", system:"articular", layer:3,
 action:"Stops the shin sliding backward on the thigh.",
 clinical:"Usually injured by a direct blow to the front of a bent knee — a dashboard or a fall onto the shin. Quadriceps strength is the mainstay of management.",
 ex:["Quad Set","Short Arc Quad","Terminal Knee Extension","Squat Progression"]},

{id:"knee-mcl", name:"Medial Collateral Ligament", latin:"ligamentum collaterale mediale", region:"knee", system:"articular", layer:3,
 action:"Resists the knee being forced inward.",
 clinical:"The most commonly injured knee ligament and the one that heals best without surgery. Protect from sideways load early, then load progressively.",
 ex:["Quad Set","Straight Leg Raise","Sit-to-Stand Progression","Step Up"]},

{id:"knee-lcl", name:"Lateral Collateral Ligament", latin:"ligamentum collaterale laterale", region:"knee", system:"articular", layer:3,
 action:"Resists the knee being forced outward.",
 clinical:"Injured less often and heals less readily than the medial side. The common fibular nerve runs close by — check for foot drop.",
 ex:["Quad Set","Single Leg Balance Progression","Lateral Step Down","Common Fibular Nerve Glide"]},

{id:"knee-menisci", name:"Menisci", latin:"menisci lateralis et medialis", region:"knee", system:"articular", layer:3,
 action:"Wedge-shaped cartilage spreading load across the joint surface.",
 clinical:"Degenerative tears are common and often incidental on scan. Loading and strengthening outperforms surgery for most non-locking presentations.",
 ex:["Quad Set","Sit-to-Stand Progression","Stationary Bike Range Progression","Squat Progression"]},

{id:"knee-pes-anserinus", name:"Pes Anserinus", latin:"pes anserinus", region:"knee", system:"fascial", layer:2,
 action:"Shared attachment of three muscles on the inner shin below the knee.",
 clinical:"Tender inner knee pain, often confused with a medial meniscus or MCL problem but sitting lower and more superficial.",
 ex:["Hamstring Stretch","Adductor Rock Back","Hamstring Bridge","Step Up"]},

{id:"knee-tibiofemoral", name:"Tibiofemoral Joint", latin:"articulatio tibiofemoralis", region:"knee", system:"articular", layer:3,
 action:"The main knee joint — hinging, with a small amount of rotation.",
 clinical:"The last few degrees of straightening matter more than the last few of bending. Lose full extension and every step costs more.",
 ex:["Prone Hang","Heel Slides","Knee CARs","Terminal Knee Extension"]},

{id:"knee-patellofemoral", name:"Patellofemoral Joint", latin:"articulatio patellofemoralis", region:"knee", system:"articular", layer:3,
 action:"Where the kneecap tracks in its groove on the thigh bone.",
 clinical:"Pain on stairs, hills and prolonged sitting. The problem is usually above and below — hip control and foot position — rather than at the kneecap itself.",
 ex:["Lateral Step Down","Standing Banded Abduction","Kneecap Mobilization","Spanish Squat"]},

/* ---- Ankle & Foot — 13 ---- */
{id:"ankle-gastrocnemius", name:"Gastrocnemius", latin:"m. gastrocnemius", region:"ankle-foot", system:"muscular", layer:1,
 action:"The upper calf. Points the foot down and crosses the knee.",
 clinical:"Because it crosses the knee, it must be tested with the knee straight. Restriction here caps ankle bending and pushes the problem up to the knee and hip.",
 ex:["Calf Stretch, Knee Straight","Calf Raise","Eccentric Heel Drop","Knee-to-Wall Dorsiflexion"]},

{id:"ankle-soleus", name:"Soleus", latin:"m. soleus", region:"ankle-foot", system:"muscular", layer:2,
 action:"The deep calf, lying under gastrocnemius and not crossing the knee.",
 clinical:"The real workhorse of walking and standing, and it limits ankle bending more than the upper calf does. Almost never trained directly — the seated calf raise is how you reach it.",
 ex:["Calf Stretch, Knee Bent","Seated Calf Raise","Isometric Calf Hold","Knee-to-Wall Dorsiflexion"]},

{id:"ankle-achilles", name:"Achilles Tendon", latin:"tendo calcaneus", region:"ankle-foot", system:"fascial", layer:2,
 action:"The strongest tendon in the body, joining both calf muscles to the heel bone.",
 clinical:"Midportion and insertional problems load differently — insertional cases often worsen with heel drops below neutral. Ask where it hurts before choosing the exercise.",
 ex:["Eccentric Heel Drop","Isometric Calf Hold","Single Leg Calf Raise off a Step","Seated Calf Raise"]},

{id:"ankle-tib-post", name:"Tibialis Posterior", latin:"m. tibialis posterior", region:"ankle-foot", system:"muscular", layer:2,
 action:"The main dynamic support of the arch, turning the foot inward and pointing it down.",
 clinical:"Its failure is the usual cause of a progressively flattening adult foot. Inability to perform a single leg heel raise is the classic sign.",
 ex:["Band Inversion","Single Leg Calf Raise off a Step","Short Foot","Foot Tripod Balance"]},

{id:"ankle-tib-ant", name:"Tibialis Anterior", latin:"m. tibialis anterior", region:"ankle-foot", system:"muscular", layer:1,
 action:"Pulls the foot up and controls its lowering to the ground after heel strike.",
 clinical:"Works eccentrically with every step. Central to shin splints, and its weakness is why tired runners slap their feet down.",
 ex:["Band Dorsiflexion","Heel Walk and Toe Walk","Ankle Alphabet","Ankle CARs"]},

{id:"ankle-fibularis", name:"Fibularis Longus & Brevis", latin:"mm. fibularis longus et brevis", region:"ankle-foot", system:"muscular", layer:1,
 action:"Run down the outside of the shin and turn the foot outward.",
 clinical:"The primary active defence against rolling the ankle. Priority after any lateral sprain, and routinely under-dosed.",
 ex:["Band Eversion","Lateral Hop and Stick","Foot Tripod Balance","Single Leg Balance Progression"]},

{id:"ankle-fhl", name:"Flexor Hallucis Longus", latin:"m. flexor hallucis longus", region:"ankle-foot", system:"muscular", layer:2,
 action:"Bends the big toe and contributes to push-off.",
 clinical:"Symptomatic in dancers and sprinters, and behind some persistent inner-ankle pain. Test it with the big toe extended.",
 ex:["Toe Flexion and Extension","Big Toe Extension Mobilization","Toe Yoga","Towel Scrunch"]},

{id:"ankle-plantar-fascia", name:"Plantar Fascia", latin:"aponeurosis plantaris", region:"ankle-foot", system:"fascial", layer:2,
 action:"Thick band along the sole, tensioning the arch as the big toe extends at push-off.",
 clinical:"Worst with the first steps in the morning. Because big toe extension tensions it, limited big toe range is a frequent and overlooked driver.",
 ex:["Plantar Fascia Stretch","Plantar Ball Roll","Big Toe Extension Mobilization","Short Foot"]},

{id:"ankle-intrinsics", name:"Intrinsic Foot Muscles", latin:"mm. intrinseci pedis", region:"ankle-foot", system:"muscular", layer:2,
 action:"Small muscles within the foot that hold the arch and fine-tune balance.",
 clinical:"Weak in almost anyone who has worn supportive shoes for decades. The foot's local stabilisers, and the equivalent of deep neck flexors or multifidus.",
 ex:["Short Foot","Toe Yoga","Toe Splay","Towel Scrunch"]},

{id:"ankle-talocrural", name:"Talocrural Joint", latin:"articulatio talocruralis", region:"ankle-foot", system:"articular", layer:3,
 action:"The main ankle hinge — pointing the foot up and down.",
 clinical:"Bending range is the single most useful ankle measurement. Restriction here pushes compensation up into the knee and hip on every squat and stair.",
 ex:["Knee-to-Wall Dorsiflexion","Banded Ankle Distraction","Kneeling Ankle Rock","Ankle CARs"]},

{id:"ankle-subtalar", name:"Subtalar Joint", latin:"articulatio subtalaris", region:"ankle-foot", system:"articular", layer:3,
 action:"Sits below the ankle and handles side-to-side foot movement on uneven ground.",
 clinical:"Stiffens after ankle sprains and gets missed because everyone tests bending range instead. Heel bone work is what reaches it.",
 ex:["Subtalar Inversion and Eversion","Heel Bone Mobilization","Ankle CARs","Foot Tripod Balance"]},

{id:"ankle-first-mtp", name:"First MTP Joint", latin:"articulatio metatarsophalangealis prima", region:"ankle-foot", system:"articular", layer:3,
 action:"The big toe joint, which must extend roughly 60 degrees for a normal step.",
 clinical:"Restriction here alters every step and drives compensation up the whole chain. One of the most commonly missed causes of foot, knee and hip complaints.",
 ex:["Big Toe Extension Mobilization","Toe Flexion and Extension","Toe Yoga","Plantar Fascia Stretch"]},

function uuid(){
  try{ if(window.crypto && crypto.randomUUID) return crypto.randomUUID(); }catch(err){}
  return "p-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,10);
}

function blankPhase(name){
  return {name:name||"Phase", timeframe:"", level:null, items:[], patientNote:"", dailyMods:"", practitionerNote:""};
}

    structure:o.structure==="single"?"single":"phased",
    phases:(o.names||["Phase 1"]).map(blankPhase),

}

   user has authored. EX itself is never touched — customs are a separate array
   merged on top of it, so nothing a user types can reach the shipped content.
   Everything downstream (filters, grouping, handout, both safety callouts)
   reads ALL and byId, never EX, so a custom entry behaves exactly like a
   built-in one without any of them knowing the difference. */
let CUSTOM = [];

const byId = {}; ALL.forEach(e=>byId[e.id]=e);
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

   thoracic but is shoulder-girdle material. alsoRegion cross-lists them without
   changing their id, so no migration is needed. */
/* alsoRegion takes one region or several — single leg balance is genuinely a
   knee and an ankle drill as well as a hip one. */
const regionsOf = x => x.alsoRegion
  ? [x.region].concat(Array.isArray(x.alsoRegion) ? x.alsoRegion : [x.alsoRegion])
  : [x.region];
/* Which region heading an exercise sits under right now. With no region filter
   it stays under its primary region, so nothing is ever listed twice. */
const displayRegion = x =>
  (F.region !== "all" && x.region !== F.region && regionsOf(x).indexOf(F.region) >= 0)
    ? F.region : x.region;
const regionLabel = k => (REGIONS.find(r=>r.k===k)||{}).name || k;
/* Cross-listings not already accounted for by the heading this row sits under. */
const alsoTag = x => {
  const extra = regionsOf(x).slice(1).filter(k => k !== displayRegion(x));
  return extra.length ? `<span class="tag">Also ${esc(extra.map(regionLabel).join(" / "))}</span>` : "";
