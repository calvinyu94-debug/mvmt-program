 name:"Bear Position Neck Hold", rx:"3 x 20s",
 desc:"Hands and toes with the knees hovering an inch off the floor, neck held in line with the spine. Hold and breathe. Build it up: 20 seconds → add slow shoulder taps.",
 targets:"Neck control under whole-body effort, where it is usually the first thing to go"},
{id:"cervical-stab-wall-angel-tuck", region:"cervical", type:"stability", level:2,
 name:"Wall Angel with Chin Tuck", rx:"3 x 10",
 desc:"Back against a wall, chin tucked so the head stays in contact. Slide the arms up and overhead keeping the head, arms and back on the wall. If the head lifts away, you have gone too far — stop there.",
 targets:"Neck and shoulder blade control together, in the overhead position"},
{id:"cervical-stab-submax-mid-range", region:"cervical", type:"stability", level:1,
 name:"Sub-maximal Mid-range Holds", rx:"5 x 5s, 20-30% effort",
 desc:"Very light isometric holds, around a quarter of your maximum, in the middle of your comfortable range. Deliberately easy. Build it up: 20% effort → 30% → longer holds, over weeks not days.",
 targets:"A safe entry point for a neck too irritable for anything else"},

/* ---------- SHOULDER MOBILITY ---------- */
{id:"shoulder-mob-cars", region:"shoulder", type:"mobility", level:2,
 name:"Shoulder CARs", rx:"3 slow circles each direction, each side",
 desc:"Trace the largest slow circle you can with the arm, keeping the ribs down and the rest of the body completely still. Build it up: standing with a small circle → full range → lying on your back so the floor stops you cheating → 30 seconds per circle.",
 targets:"Full shoulder range in every direction, and a good weekly self-check"},
{id:"shoulder-mob-pendulum", region:"shoulder", type:"mobility", level:1,
 name:"Pendulum Swings", rx:"2 x 30s each direction",
 desc:"Lean forward with the good hand on a table and let the sore arm hang completely loose. Shift your weight to swing the arm — forward and back, side to side, then circles. The arm muscles do nothing; your body creates the movement.",
 targets:"Gentle shoulder movement when the joint is too irritable for anything active"},
{id:"shoulder-mob-wall-walk", region:"shoulder", type:"mobility", level:1,
 name:"Wall Walk", rx:"2 x 8",
 desc:"Face a wall and walk the fingers up it as high as comfortable, then walk back down under control. Build it up: facing the wall → standing side-on to walk the arm out sideways → mark your height and chase it week to week.",
 targets:"Overhead reach, with the wall taking most of the arm's weight"},
{id:"shoulder-mob-sleeper-stretch", region:"shoulder", type:"mobility", level:2,
 name:"Sleeper Stretch", rx:"3 x 30s each side",
 desc:"Lie on the side to be stretched with that arm out in front at shoulder height and the elbow bent to 90 degrees. Use the top hand to press the forearm down toward the floor. Stop well short of any pinch at the front of the shoulder.",
 targets:"The back of the shoulder capsule — usually tight in anyone who throws or serves"},
{id:"shoulder-mob-cross-body", region:"shoulder", type:"mobility", level:1,
 name:"Cross-Body Stretch", rx:"3 x 30s each side",
 desc:"Bring one arm straight across the chest and use the other forearm to draw it closer. Keep the shoulder pressed down rather than letting it shrug toward the ear — that shrug is what makes this stretch feel like nothing.",
 targets:"Back of the shoulder and the outside of the shoulder blade"},
{id:"shoulder-mob-doorway-pec", region:"shoulder", type:"mobility", level:1,
 name:"Doorway Pec Stretch", rx:"3 x 30s at each height",
 desc:"Forearm on a doorframe, step through gently until you feel a stretch across the front of the chest. Do it at three elbow heights — below shoulder, at shoulder, and above shoulder — as each one targets a different part of the muscle.",
 targets:"Pectorals — the front-of-chest tightness that pulls the shoulders forward"},
{id:"shoulder-mob-lat-stretch", region:"shoulder", type:"mobility", level:1,
 name:"Kneeling Lat Stretch", rx:"3 x 45s",
 desc:"Kneel with forearms on a bench or chair, thumbs up, and sink the chest toward the floor. Build it up: both arms → one arm at a time → add a gentle side bend away from the arm → add a slow breath out at the end.",
 targets:"Lats — a major limiter of overhead reach that is often mistaken for a stiff shoulder"},
{id:"shoulder-mob-dowel-flexion", region:"shoulder", type:"mobility", level:1,
 name:"Dowel-Assisted Flexion", rx:"2 x 10",
 desc:"Lying on your back holding a dowel or broomstick in both hands, use the good arm to push the sore arm up overhead. Build it up: lying down → seated → standing → holding 5 seconds at the top.",
 targets:"Overhead range with the good arm doing the work — useful early or after surgery"},
{id:"shoulder-mob-dowel-er", region:"shoulder", type:"mobility", level:1,
 name:"Dowel-Assisted External Rotation", rx:"2 x 10 each side",
 desc:"Lying on your back, elbow tucked at your side and bent to 90 degrees, hold a dowel and use the good arm to push the sore forearm outward. Keep a rolled towel under the elbow so it stays at your side.",
 targets:"Outward shoulder rotation, assisted"},
{id:"shoulder-mob-towel-ir", region:"shoulder", type:"mobility", level:2,
 name:"Towel Internal Rotation Stretch", rx:"3 x 30s each side",
 desc:"Hold a towel behind your back, top hand over the shoulder and bottom hand at the low back. Use the top hand to draw the bottom hand gently up the spine. Build it up: mark where the bottom hand reaches and chase it over weeks.",
 targets:"Inward shoulder rotation — the reach-behind-your-back movement"},
{id:"shoulder-mob-9090-arcs", region:"shoulder", type:"mobility", level:2,
 name:"Supine 90/90 Rotation Arcs", rx:"2 x 10 each side",
 desc:"Lie on your back with the arm out to the side at shoulder height, elbow bent to 90 degrees. Rotate the forearm back toward the floor above your head, then forward toward your hip. Keep the shoulder blade flat on the floor throughout.",
 targets:"Rotation range at the position the shoulder actually works in overhead"},
{id:"shoulder-mob-scap-circles", region:"shoulder", type:"mobility", level:1,
 name:"Scapular Circles", rx:"2 x 8 each direction",
 desc:"Without bending the elbows, move only the shoulder blades — up, back, down, forward, in a continuous circle. Build it up: standing → on hands and knees → in a plank position.",
 targets:"Shoulder blade movement on the ribcage, independent of the arm"},
{id:"shoulder-mob-eagle-arms", region:"shoulder", type:"mobility", level:1,
 name:"Eagle Arms", rx:"3 x 30s each side",
 desc:"Cross one arm under the other in front of you and wrap the forearms, then lift the elbows and reach the hands forward to spread the shoulder blades apart. Build it up: simple bear hug → crossed forearms → full wrap.",
 targets:"Spreading the shoulder blades and opening the back of the shoulder"},
{id:"shoulder-mob-dowel-pass-through", region:"shoulder", type:"mobility", level:2,
 name:"Dowel Pass-Throughs", rx:"2 x 8",
 desc:"Hold a dowel wide in front of you and bring it up and over your head to behind your back, then reverse. Start much wider than feels necessary. Build it up: narrow the grip an inch at a time over weeks, never forcing.",
 targets:"Whole-shoulder overhead range — and an honest measure of it, since the grip width tells you where you are"},
{id:"shoulder-mob-snow-angel", region:"shoulder", type:"mobility", level:1,
 name:"Supine Snow Angel", rx:"2 x 8",
 desc:"Lie on your back with arms out to the sides, backs of the hands on the floor. Slide the arms overhead keeping contact with the floor, then back down to your hips. Wherever the hands lift away is your current limit — work at that edge.",
 targets:"Overhead range with the floor giving constant feedback"},
{id:"shoulder-mob-overhead-reach", region:"shoulder", type:"mobility", level:2,
 name:"Half-Kneeling Overhead Reach", rx:"2 x 8 each side",
 desc:"Half-kneel, tuck the tailbone and keep the ribs down, then reach one arm straight overhead. The half-kneeling position stops you arching the low back to fake the range. Build it up: no weight → light dowel → light kettlebell held bottoms-up.",
 targets:"True overhead reach without borrowing it from the low back"},
{id:"shoulder-mob-prone-extension-reach", region:"shoulder", type:"mobility", level:1,
 name:"Prone Extension Reach", rx:"2 x 10",
 desc:"Lie face down with arms by your sides, palms up. Lift the hands toward the ceiling and slide them back toward your feet. Build it up: hands only → add lifting the chest slightly → hold 3 seconds at the top.",
 targets:"Shoulder extension — the backward reach, commonly lost and rarely trained"},
{id:"shoulder-mob-table-slide", region:"shoulder", type:"mobility", level:1,
 name:"Seated Table Slide", rx:"2 x 10",
 desc:"Sit at a table with the forearm resting on a towel, then slide the arm forward across the table, letting the chest sink toward it. The table takes the arm's weight entirely. Build it up: slide forward → add sliding out to the side.",
 targets:"Early overhead range for a shoulder that cannot yet hold its own weight"},

/* ---------- SHOULDER STABILITY ---------- */
{id:"shoulder-stab-sidelying-er", region:"shoulder", type:"stability", level:1,
 name:"Side-lying External Rotation", rx:"3 x 12 each side",
 desc:"Lie on your side with the top elbow tucked into your ribs, bent to 90 degrees, and a rolled towel under the elbow. Rotate the forearm up toward the ceiling, then lower slowly. Build it up: no weight → 1kg → 2kg. Small weights only.",
 targets:"Rotator cuff — the foundational cuff exercise and the one to start with"},
{id:"shoulder-stab-band-er-0", region:"shoulder", type:"stability", level:1,
 name:"Band External Rotation, Arm at Side", rx:"3 x 15 each side",
 desc:"Stand side-on to an anchored band, elbow tucked at your side with a rolled towel held in the armpit. Rotate the forearm outward, keeping the elbow pinned. If the towel drops, the shoulder is compensating.",
 targets:"Rotator cuff strength in the safest position"},
{id:"shoulder-stab-band-er-90", region:"shoulder", type:"stability", level:2,
 name:"Band External Rotation at 90/90", rx:"3 x 12 each side",
 desc:"Arm out to the side at shoulder height, elbow bent to 90 degrees, band anchored in front. Rotate the forearm back and up, then lower slowly. Build it up: light band → heavier → add a 3 second lower.",
 targets:"Rotator cuff in the overhead position, where it actually has to work"},
{id:"shoulder-stab-band-ir", region:"shoulder", type:"stability", level:1,
 name:"Band Internal Rotation", rx:"3 x 15 each side",
 desc:"Stand side-on to an anchored band with the elbow tucked, and pull the forearm across toward your stomach. Keep the elbow pinned to your side throughout.",
 targets:"The inward-rotating cuff muscles — often neglected in favour of external rotation alone"},
{id:"shoulder-stab-iso-doorframe", region:"shoulder", type:"stability", level:1,
 name:"Doorframe Isometrics", rx:"3 x 10s each direction, 30-50% effort",
 desc:"Standing in a doorway with the elbow bent at your side, press the back of the wrist outward into the frame and hold. Then turn around and press the palm inward. Nothing moves. Never go to maximum effort.",
 targets:"Cuff strength with no movement — the option when the shoulder will not tolerate range"},
{id:"shoulder-stab-full-can", region:"shoulder", type:"stability", level:2,
 name:"Full Can Raise", rx:"3 x 12",
 desc:"Raise the arms up and out at about 30 degrees from straight ahead, thumbs pointing up, to shoulder height. Stop at shoulder height. Build it up: no weight → 1kg → 2-3kg. This is an endurance exercise, not a strength one.",
 targets:"Supraspinatus and the upward rotation of the shoulder blade"},
{id:"shoulder-stab-push-up-plus", region:"shoulder", type:"stability", level:2,
 name:"Push-Up Plus", rx:"3 x 12",
 desc:"At the top of a push-up position, push the floor away to spread the shoulder blades apart, then let them come back together. The elbows stay locked. Build it up: against a wall → on an incline → on the floor → feet elevated.",
 targets:"Serratus anterior — the muscle that holds the shoulder blade against the ribs"},
{id:"shoulder-stab-quadruped-protraction", region:"shoulder", type:"stability", level:1,
 name:"Quadruped Protraction Rock", rx:"3 x 10",
 desc:"On hands and knees, push the floor away to round the upper back, then rock gently forward and back holding that position. Build it up: hold still → rock → lift one hand briefly.",
 targets:"Serratus control with body weight through the arm"},
{id:"shoulder-stab-wall-plank-hold", region:"shoulder", type:"stability", level:1,
 name:"Wall Plank Protraction Hold", rx:"3 x 30s",
 desc:"Forearms on a wall, lean in, and push the wall away so the shoulder blades spread. Hold. Build it up: standing close → feet further back → on a bench → on the floor.",
 targets:"Sustained shoulder blade control, scalable to almost any starting point"},
{id:"shoulder-stab-bottoms-up-hold", region:"shoulder", type:"stability", level:2,
 name:"Bottoms-Up Kettlebell Hold", rx:"3 x 20-30s each side",
 desc:"Hold a light kettlebell upside down by the handle, elbow bent at 90 degrees in front of you. Squeeze the handle hard and keep the bell balanced. Build it up: at the shoulder → half overhead → fully overhead.",
 targets:"Reflexive cuff activation — the whole shoulder switches on to keep the bell from tipping"},
{id:"shoulder-stab-bottoms-up-carry", region:"shoulder", type:"stability", level:3,
 name:"Bottoms-Up Carry", rx:"4 x 20m each side",
 desc:"Walk holding the kettlebell upside down at shoulder height. Build it up: short distance → longer → overhead instead of racked → add turns.",
 targets:"Cuff and shoulder blade control while moving, under a genuinely unforgiving load"},
{id:"shoulder-stab-overhead-carry", region:"shoulder", type:"stability", level:2,
 name:"Overhead Carry", rx:"4 x 20-30m each side",
 desc:"Walk with one weight locked out overhead, ribs down, arm beside the ear. Build it up: light and short → heavier → both arms overhead → add turns and steps.",
 targets:"Holding a stable shoulder overhead under load while the rest of the body moves"},
{id:"shoulder-stab-scap-punch", region:"shoulder", type:"stability", level:1,
 name:"Side-lying Scapular Punch", rx:"3 x 12 each side",
 desc:"Lie on your side with the top arm straight up toward the ceiling holding a light weight. Push the hand toward the ceiling using only the shoulder blade, then release. The elbow stays locked.",
 targets:"Isolated shoulder blade protraction, hard to cheat"},
{id:"shoulder-stab-ring-row", region:"shoulder", type:"stability", level:2,
 name:"Ring or Inverted Row", rx:"3 x 10",
 desc:"Hang under a bar or rings and pull the chest toward them, leading with the shoulder blades rather than the elbows. Build it up: upright, feet well forward → more horizontal → feet elevated.",
 targets:"Pulling strength with the shoulder blades doing the work"},
{id:"shoulder-stab-rhythmic-stabilization", region:"shoulder", type:"stability", level:2,
 name:"Rhythmic Stabilization", rx:"3 x 20s each position",
 desc:"Hold the arm out in front at shoulder height and have someone tap it lightly from unpredictable directions while you hold the position. Alone, press a ball into a wall and make small rapid taps against it.",
 targets:"Reactive shoulder control — responding to load you did not see coming"},
{id:"shoulder-stab-wall-ball-circles", region:"shoulder", type:"stability", level:2,
 name:"Wall Ball Circles", rx:"3 x 5 circles each direction",
 desc:"Press a ball into a wall at shoulder height with a straight arm and trace slow circles, keeping constant pressure. Build it up: small circles → large circles → figure-8 → write the alphabet.",
 targets:"Cuff endurance through a full arc while bearing load"},
{id:"shoulder-stab-eccentric-lowering", region:"shoulder", type:"stability", level:3,
 name:"Eccentric Overhead Lowering", rx:"3 x 6 each side",
 desc:"Use both arms to press a weight overhead, then lower it with one arm over 4-5 seconds. Build it up: light → heavier → slower lowering. The lowering is the entire exercise.",
 targets:"Controlling load on the way down overhead, which is where shoulders usually fail"},
{id:"shoulder-stab-prone-trap-raise", region:"shoulder", type:"stability", level:2,
 name:"Prone Trap Raise", rx:"3 x 12",
 desc:"Lie chest-down on an incline bench with the arms hanging. Raise them up and out into a Y with thumbs up, leading with the shoulder blade. Build it up: no weight → 1kg → 2kg, with a 2 second hold at the top.",
 targets:"Lower trapezius, which sets the shoulder blade for overhead work"},

/* ---------- ELBOW & WRIST MOBILITY ---------- */
{id:"elbow-wrist-mob-flex-ext", region:"elbow-wrist", type:"mobility", level:1,
 name:"Wrist Flexion and Extension", rx:"2 x 15",
 desc:"Forearm supported on a table with the hand off the edge. Move the hand up and down through its full comfortable range, slowly. Build it up: unsupported movement → light assist from the other hand → hold 3 seconds at each end.",
 targets:"Basic wrist range in both directions"},
{id:"elbow-wrist-mob-cars", region:"elbow-wrist", type:"mobility", level:1,
 name:"Wrist Circles", rx:"2 x 8 each direction",
 desc:"Make a loose fist and trace the largest slow circle you can with it, keeping the forearm still. Build it up: unloaded → gripping a light weight → the forearm unsupported.",
 targets:"Full wrist range in every direction"},
{id:"elbow-wrist-mob-extensor-stretch", region:"elbow-wrist", type:"mobility", level:1,
 name:"Wrist Extensor Stretch", rx:"3 x 30s each side",
 desc:"Straighten the elbow with the palm facing down, then use the other hand to bend the wrist downward. Build it up: hand flat → make a fist first → add turning the forearm inward for a stronger stretch.",
 targets:"The outer forearm muscles — the group involved in tennis elbow"},
{id:"elbow-wrist-mob-flexor-stretch", region:"elbow-wrist", type:"mobility", level:1,
 name:"Wrist Flexor Stretch", rx:"3 x 30s each side",
 desc:"Straighten the elbow with the palm facing up, then use the other hand to draw the fingers and hand back toward you. Build it up: fingers only → whole hand → add turning the forearm outward.",
 targets:"The inner forearm muscles — the group involved in golfer's elbow"},
{id:"elbow-wrist-mob-pronation-supination", region:"elbow-wrist", type:"mobility", level:1,
 name:"Forearm Rotation", rx:"2 x 15 each side",
 desc:"Elbow tucked at your side and bent to 90 degrees, turn the palm up then down. Keep the elbow pinned so the movement comes from the forearm and not the shoulder. Build it up: unloaded → holding a hammer near the head → holding it near the handle.",
 targets:"Turning the forearm — needed for everything from door handles to a racquet grip"},
{id:"elbow-wrist-mob-elbow-arom", region:"elbow-wrist", type:"mobility", level:1,
 name:"Elbow Flexion and Extension", rx:"2 x 15",
 desc:"Bend and straighten the elbow through its full comfortable range, slowly. Build it up: unassisted → light assist at the end range → hold 5 seconds at full straight.",
 targets:"Basic elbow range — the last few degrees of straightening are the ones most often lost"},
{id:"elbow-wrist-mob-deviation", region:"elbow-wrist", type:"mobility", level:1,
 name:"Radial and Ulnar Deviation", rx:"2 x 15",
 desc:"Forearm flat on a table, thumb up. Move the hand side to side like waving, keeping the forearm still. Build it up: unloaded → holding a light hammer → forearm unsupported.",
 targets:"Side-to-side wrist movement"},
{id:"elbow-wrist-mob-tendon-glides", region:"elbow-wrist", type:"mobility", level:1,
 name:"Tendon Glides", rx:"2 x 10 full sequences",
 desc:"Move the hand through five positions in order: fingers straight, then hooked, then a full fist, then a tabletop shape, then a straight fist. Pause a moment in each. Build it up: slowly through the sequence → repeat both directions.",
 targets:"Sliding of the finger tendons through the wrist — important after any wrist or hand immobilisation"},
{id:"elbow-wrist-mob-prayer-stretch", region:"elbow-wrist", type:"mobility", level:1,
 name:"Prayer and Reverse Prayer", rx:"3 x 30s each",
 desc:"Palms together in front of the chest, lower the hands while keeping the palms touching. Then reverse it — backs of the hands together, raise them up. Build it up: near the chest → further from the body.",
 targets:"Both directions of wrist range at once"},
{id:"elbow-wrist-mob-quadruped-rocks", region:"elbow-wrist", type:"mobility", level:2,
 name:"Quadruped Wrist Rocks", rx:"2 x 10",
 desc:"On hands and knees, palms flat and fingers forward, rock the body gently forward and back over the hands. Build it up: knees well back to take weight off → more weight → fingers turned out → fingers turned back toward the knees.",
 targets:"Wrist extension under body weight — the position needed for push-ups and floor work"},
{id:"elbow-wrist-mob-reverse-rocks", region:"elbow-wrist", type:"mobility", level:2,
 name:"Reverse Quadruped Wrist Rocks", rx:"2 x 10",
 desc:"On hands and knees with the backs of the hands on the floor, fingers pointing back toward the knees. Rock gently. Very little weight to start — this position loads the wrist quickly.",
 targets:"Wrist flexion under load, the direction most people never train"},
{id:"elbow-wrist-mob-elbow-extension-hold", region:"elbow-wrist", type:"mobility", level:2,
 name:"Elbow Extension Hold", rx:"3 x 60s",
 desc:"Rest the upper arm on a table with the forearm hanging off, and let a light weight in the hand draw the elbow toward straight. Let gravity do it — do not push. Build it up: 30 seconds → 2 minutes, and only then add weight.",
 targets:"Regaining the last degrees of elbow straightening, which respond to time rather than force"},
{id:"elbow-wrist-mob-thumb-stretch", region:"elbow-wrist", type:"mobility", level:1,
 name:"Thumb and First Compartment Stretch", rx:"3 x 20s each side",
 desc:"Tuck the thumb into the palm, close the fingers gently over it, then tip the wrist toward the little finger side. Go gently — this position provokes easily if the thumb tendons are irritable.",
 targets:"Thumb-side wrist tendons — relevant in de Quervain's and new-parent wrist pain"},
{id:"elbow-wrist-mob-palmar-fascia-stretch", region:"elbow-wrist", type:"mobility", level:1,
 name:"Palmar Fascia Stretch", rx:"3 x 30s each hand",
 desc:"Place the palm flat on a table and use the other hand to draw the fingers and thumb back and apart, spreading the palm wide. Build it up: fingers only → add the thumb → add pressing the palm flat while the fingers lift.",
 targets:"The thick tissue across the palm, which thickens and shortens with age and manual work"},

/* ---------- ELBOW & WRIST STABILITY ---------- */
{id:"elbow-wrist-stab-extensor-iso", region:"elbow-wrist", type:"stability", level:1,
 name:"Wrist Extensor Isometric", rx:"5 x 20s, 30-50% effort",
 desc:"Palm down, press the back of the hand up into the other hand and hold. Nothing moves. Build it up: 20 seconds → 45 seconds → higher effort, over weeks.",
 targets:"Outer forearm strength with no movement — the reliable starting point for a painful tennis elbow"},
{id:"elbow-wrist-stab-flexor-iso", region:"elbow-wrist", type:"stability", level:1,
 name:"Wrist Flexor Isometric", rx:"5 x 20s, 30-50% effort",
 desc:"Palm up, press the hand up into the other hand and hold. Nothing moves.",
 targets:"Inner forearm strength with no movement, for an irritable golfer's elbow"},
{id:"elbow-wrist-stab-eccentric-extension", region:"elbow-wrist", type:"stability", level:2,
 name:"Eccentric Wrist Extension", rx:"3 x 15 each side",
 desc:"Forearm on a table palm down, holding a light weight. Use the other hand to lift the weight up, then lower it slowly over 3-4 seconds using only the working hand. Only the lowering is done by the injured side.",
 targets:"Tendon loading for tennis elbow — the lowering is the part that does the work"},
{id:"elbow-wrist-stab-eccentric-flexion", region:"elbow-wrist", type:"stability", level:2,
 name:"Eccentric Wrist Flexion", rx:"3 x 15 each side",
 desc:"Same setup but palm up. Assist the lift with the other hand, then lower slowly over 3-4 seconds.",
 targets:"Tendon loading for golfer's elbow"},
{id:"elbow-wrist-stab-flexbar-twist", region:"elbow-wrist", type:"stability", level:2,
 name:"Rubber Bar Twist", rx:"3 x 15",
 desc:"Hold a flexible rubber bar in the sore hand, twist it with the good hand, then slowly let the sore hand untwist it over 4 seconds while both hands hold on. Build it up: light bar → firmer bar.",
 targets:"Loaded tendon work for the elbow, using a tool that makes the dose easy to control"},
{id:"elbow-wrist-stab-grip-squeeze", region:"elbow-wrist", type:"stability", level:1,
 name:"Grip Squeeze", rx:"3 x 10, 5s holds",
 desc:"Squeeze a soft ball or grip trainer and hold. Build it up: soft ball → firmer ball → grip trainer → longer holds.",
 targets:"Grip strength, and a simple way to keep the forearm working when the wrist is limited"},
{id:"elbow-wrist-stab-hammer-rotation", region:"elbow-wrist", type:"stability", level:2,
 name:"Hammer Rotation", rx:"3 x 12 each direction",
 desc:"Elbow tucked at your side, hold a hammer upright and rotate the forearm to lower the head to each side under control. Build it up: hold near the head → slide the grip toward the handle to increase the load.",
 targets:"Forearm rotation strength, adjustable by grip position alone"},
{id:"elbow-wrist-stab-hammer-deviation", region:"elbow-wrist", type:"stability", level:2,
 name:"Hammer Radial Deviation", rx:"3 x 12 each side",
 desc:"Forearm on a table, thumb up, holding a hammer upright. Tip the hammer head up toward the ceiling and lower it slowly. Build it up: grip near the head → grip near the handle.",
 targets:"Thumb-side wrist strength"},
{id:"elbow-wrist-stab-wrist-roller", region:"elbow-wrist", type:"stability", level:3,
 name:"Wrist Roller", rx:"3 x 2 up-and-down cycles",
 desc:"Hold a roller with a light weight on a cord at arm's length and wind it up, then unwind it slowly. Build it up: arms lowered → arms at shoulder height → heavier weight.",
 targets:"Forearm endurance — this one gets hard fast"},
{id:"elbow-wrist-stab-weight-bearing", region:"elbow-wrist", type:"stability", level:2,
 name:"Wrist Weight-Bearing Progression", rx:"3 x 30s",
 desc:"Take load through a flat hand. Build it up: hands on a wall → hands on a bench → hands and knees → full plank → one hand at a time.",
 targets:"Tolerance to load through the wrist, needed for any floor or pressing work"},
{id:"elbow-wrist-stab-grip-carry", region:"elbow-wrist", type:"stability", level:2,
 name:"Grip Carry", rx:"4 x 30m",
 desc:"Walk holding heavy weights, focusing on the grip rather than the trunk. Build it up: normal handles → thick handles or a towel wrapped around the handle → heavier.",
 targets:"Grip endurance under sustained load"},
{id:"elbow-wrist-stab-putty-work", region:"elbow-wrist", type:"stability", level:1,
 name:"Putty or Rice Bucket Work", rx:"3 x 2 minutes",
 desc:"Work therapy putty through pinching, rolling and pulling, or bury the hand in a bucket of rice and open, close and rotate it. Build it up: 1 minute → 5 minutes; softer putty → firmer.",
 targets:"General hand and forearm conditioning, easy to tolerate and easy to do while distracted"},
{id:"elbow-wrist-stab-finger-extension", region:"elbow-wrist", type:"stability", level:1,
 name:"Finger Extension with Band", rx:"3 x 15",
 desc:"Loop a small band around all five fingertips and open the hand against it. Build it up: light band → firmer band → hold 3 seconds open.",
 targets:"The opening muscles of the hand, which almost every job and hobby under-trains relative to gripping"},
{id:"elbow-wrist-stab-thumb-opposition", region:"elbow-wrist", type:"stability", level:1,
 name:"Thumb Opposition", rx:"3 x 5 full circuits",
 desc:"Touch the tip of the thumb to the tip of each finger in turn, making a round O each time rather than a flat pinch, then reverse the order. Build it up: slowly, watching the shape → faster → eyes closed → holding each contact 3 seconds.",
 targets:"The thumb muscles at the base of the palm — the movement that separates a human hand from a paw"},
{id:"elbow-wrist-stab-intrinsic-plus-hold", region:"elbow-wrist", type:"stability", level:1,
 name:"Intrinsic Plus Hold", rx:"3 x 10, 5s hold",
 desc:"Bend the knuckles at the base of the fingers while keeping the two finger joints beyond them completely straight, so the fingers make an L shape. Hold. Build it up: 3 seconds → 5 → 10, then add a light band across the fingers.",
 targets:"The small muscles inside the hand, which stiff hands lose first and which no gripping exercise reaches"},
{id:"elbow-wrist-stab-finger-abduction", region:"elbow-wrist", type:"stability", level:1,
 name:"Finger Spread and Squeeze", rx:"3 x 15",
 desc:"With the palm flat, spread the fingers as wide apart as they go, then draw them tightly together. Build it up: unresisted → a band looped around the fingers to resist spreading → a card held between each pair of fingers to resist squeezing.",
 targets:"The muscles between the hand bones, and the earliest place ulnar nerve problems show up"},
{id:"elbow-wrist-stab-thumb-base-isometric", region:"elbow-wrist", type:"stability", level:1,
 name:"Thumb Base Isometric", rx:"5 x 10s, 30-50% effort",
 desc:"Make a light O with thumb and index finger and press the two together without letting the shape collapse. Nothing moves. Build it up: 30% effort → 50% → longer holds. Stop well short of pain at the base of the thumb.",
 targets:"Stability at the base of the thumb, where arthritis and pinch pain most often sit"},

/* ---------- KNEE MOBILITY ---------- */
{id:"knee-mob-heel-slides", region:"knee", type:"mobility", level:1,
 name:"Heel Slides", rx:"2 x 15",
 desc:"Lying on your back, slide the heel toward the buttock as far as comfortable, then straighten. Build it up: slide on a smooth floor in socks → use a strap around the foot to assist → hold 5 seconds at the end of the bend.",
 targets:"Knee bending range — the first thing to restore after any period of rest or immobilisation"},
{id:"knee-mob-prone-hang", region:"knee", type:"mobility", level:1,
 name:"Prone Hang", rx:"3 x 3-5 minutes",
 desc:"Lie face down with the knee and lower leg hanging off the end of a bed. Let gravity straighten the knee. Do nothing else. Build it up: 2 minutes → 5 minutes → add a light ankle weight.",
 targets:"Full knee straightening, which responds to time under a light load rather than effort"},
{id:"knee-mob-cars", region:"knee", type:"mobility", level:2,
 name:"Knee CARs", rx:"2 slow circles each direction",
 desc:"Seated with the thigh supported, trace a slow circle with the lower leg, adding a small inward and outward rotation of the shin at the ends. Keep the thigh completely still.",
 targets:"Full knee range including the shin rotation most people never move deliberately"},
{id:"knee-mob-quad-stretch", region:"knee", type:"mobility", level:1,
 name:"Quadriceps Stretch", rx:"3 x 30s each side",
 desc:"Draw the heel toward the buttock while keeping the tailbone tucked so the low back does not arch. Build it up: side-lying → standing holding something → half-kneeling with the back foot on a bench.",
 targets:"Front of the thigh"},
{id:"knee-mob-hamstring-stretch", region:"knee", type:"mobility", level:1,
 name:"Hamstring Stretch", rx:"3 x 30s each side",
 desc:"Lying on your back with a strap around the foot, raise the straight leg until you feel a stretch behind the thigh. Build it up: knee slightly bent → fully straight → add pulling the toes toward you.",
 targets:"Back of the thigh"},
{id:"knee-mob-patellar-mob", region:"knee", type:"mobility", level:1,
 name:"Kneecap Mobilization", rx:"2 x 60s",
 desc:"Sitting with the leg straight and the thigh completely relaxed, use your fingers to glide the kneecap gently up, down and side to side. If the thigh is switched on, the kneecap will not move.",
 targets:"Kneecap glide, which stiffens quickly after swelling or immobilisation"},
{id:"knee-mob-wall-slide-flexion", region:"knee", type:"mobility", level:1,
 name:"Wall Slide Knee Flexion", rx:"2 x 10",
 desc:"Lie on your back with your legs up a wall, then let the heel slide down the wall to bend the knee, using the other leg to control the speed. Gravity assists the bend.",
 targets:"Assisted knee bending, useful when active bending is still painful"},
{id:"knee-mob-lateral-thigh-roll", region:"knee", type:"mobility", level:1,
 name:"Lateral Thigh Roll", rx:"60-90s each side",
 desc:"Foam roll the outside of the thigh from hip to just above the knee, pausing on the tender spots and breathing. Build it up: partial body weight with the other leg supporting → full weight → add slow knee bends while paused on a spot.",
 targets:"The outside of the thigh — often tender in runners and anyone with front-of-knee pain"},
{id:"knee-mob-kneeling-sit-back", region:"knee", type:"mobility", level:2,
 name:"Kneeling Sit-Back", rx:"3 x 45s",
 desc:"Kneel and sit back toward the heels as far as comfortable. Build it up: hands supporting in front → sitting on a cushion between the heels → removing the cushion → sitting fully on the heels.",
 targets:"Deep knee bending, needed for kneeling, gardening and floor work"},
{id:"knee-mob-standing-flexion", region:"knee", type:"mobility", level:1,
 name:"Standing Knee Flexion", rx:"2 x 12 each side",
 desc:"Standing and holding support, bend one knee to bring the heel up behind you. Build it up: unassisted → use a strap to draw the heel closer → hold 5 seconds.",
 targets:"Knee bending with the leg unloaded"},
{id:"knee-mob-knee-over-toe-rock", region:"knee", type:"mobility", level:2,
 name:"Half-Kneeling Knee-Over-Toe Rock", rx:"2 x 10 each side",
 desc:"Half-kneel and rock the front knee forward past the toes, keeping the heel down. Build it up: small range → knee well past the toes → back foot elevated to increase the demand.",
 targets:"Loaded knee bending combined with ankle range — the demand of stairs and squatting"},
{id:"knee-mob-tibial-rotation", region:"knee", type:"mobility", level:2,
 name:"Shin Rotation", rx:"2 x 10 each direction",
 desc:"Sitting with the knee bent to about 90 degrees and the foot flat, hold the thigh still and turn the shin inward and outward. Small range — this is a subtle movement, not a twist.",
 targets:"Rotation between the thigh and shin, which the knee needs and which is easily lost"},
{id:"knee-mob-prone-flexion-strap", region:"knee", type:"mobility", level:2,
 name:"Prone Knee Flexion with Strap", rx:"3 x 45s each side",
 desc:"Lying face down, loop a strap around the ankle and draw the heel toward the buttock with your hands over the shoulder. Build it up: gentle tension → firmer → hold longer rather than pulling harder.",
 targets:"End-range knee bending, when heel slides have stopped making progress"},
{id:"knee-mob-bike-progression", region:"knee", type:"mobility", level:1,
 name:"Stationary Bike Range Progression", rx:"5-10 minutes",
 desc:"Set the seat high enough to pedal half-circles back and forth without pain, then lower it a little at a time until full revolutions are possible. Build it up: rocking back and forth → full revolutions → longer duration.",
 targets:"Knee range through repeated low-load movement — usually the most tolerable way to get it back"},
{id:"knee-mob-seated-flexion-assist", region:"knee", type:"mobility", level:1,
 name:"Seated Knee Flexion Assist", rx:"2 x 10, 10s holds",
 desc:"Sitting on a chair, cross the good leg over the front of the sore ankle and use it to draw the sore knee into more bend. Hold 10 seconds and release.",
 targets:"Assisted knee bending you can do anywhere, including at a desk"},

/* ---------- KNEE STABILITY ---------- */
{id:"knee-stab-quad-set", region:"knee", type:"stability", level:1,
 name:"Quad Set", rx:"3 x 10, 5s holds",
 desc:"Sitting or lying with the leg straight, tighten the thigh to press the back of the knee down, and hold. Watch the kneecap slide slightly upward — if it does not, the muscle is not firing. Build it up: 5 second holds → 10 seconds → add a small towel under the knee to press into.",
 targets:"Reawakening the quadriceps, which switches off remarkably fast after knee swelling"},
{id:"knee-stab-slr", region:"knee", type:"stability", level:1,
 name:"Straight Leg Raise", rx:"3 x 12",
 desc:"Lying on your back with one knee bent, tighten the thigh of the straight leg first, then lift it to the height of the other knee and lower slowly. If the knee bends on the way up, do quad sets for another week first.",
 targets:"Quadriceps strength with no load through the knee joint"},
{id:"knee-stab-short-arc-quad", region:"knee", type:"stability", level:1,
 name:"Short Arc Quad", rx:"3 x 15",
 desc:"Lying down with a rolled towel or foam roller under the knee, straighten the knee to lift only the lower leg, then lower slowly. The thigh stays on the roller throughout.",
 targets:"The last few degrees of knee straightening, which is where the quadriceps is weakest"},
{id:"knee-stab-tke", region:"knee", type:"stability", level:1,
 name:"Terminal Knee Extension", rx:"3 x 15",
 desc:"Stand with a band around the back of the knee pulling forward. Straighten the knee against the band and hold 2 seconds. Build it up: both feet down → weight mostly on the working leg → single leg.",
 targets:"Locking the knee out straight while standing"},
{id:"knee-stab-wall-sit", region:"knee", type:"stability", level:1,
 name:"Wall Sit", rx:"3 x 30-45s",
 desc:"Back against a wall, slide down to a comfortable knee angle and hold. Build it up: shallow → deeper → longer holds → hold a weight → single leg.",
 targets:"Quadriceps endurance without any movement"},
{id:"knee-stab-iso-wall-sit-60", region:"knee", type:"stability", level:1,
 name:"Isometric Wall Sit at 60 Degrees", rx:"5 x 45s, 2 min rest",
 desc:"Wall sit at a shallow angle, around 60 degrees of knee bend, held for 45 seconds with a full 2 minutes rest between. Five rounds. The long holds and long rests are the point — do not shorten either.",
 targets:"Loading an irritable knee tendon in a way that often reduces pain for hours afterward"},
{id:"knee-stab-sit-to-stand", region:"knee", type:"stability", level:1,
 name:"Sit-to-Stand Progression", rx:"3 x 10",
 desc:"Stand up from a chair and sit back down under control. Build it up: high chair with hands pushing off → high chair hands free → normal chair → low chair → single leg to a high chair.",
 targets:"The most functional knee strength there is, and easy to scale by chair height alone"},
{id:"knee-stab-squat-progression", region:"knee", type:"stability", level:2,
 name:"Squat Progression", rx:"3 x 10",
 desc:"Squat to a comfortable depth with the weight through the whole foot. Build it up: to a box → bodyweight to parallel → holding a weight at the chest → full depth.",
 targets:"Whole-leg strength through range"},
{id:"knee-stab-spanish-squat", region:"knee", type:"stability", level:2,
 name:"Spanish Squat", rx:"3 x 12, 3s hold",
 desc:"Loop a heavy band around the backs of both knees, anchored behind you at knee height. Lean back into the band and squat, keeping the shins vertical. Build it up: shallow → deeper → hold 5 seconds at the bottom.",
 targets:"Loading the quadriceps and kneecap tendon heavily while keeping stress off the knee joint itself"},
{id:"knee-stab-step-up", region:"knee", type:"stability", level:2,
 name:"Step Up", rx:"3 x 10 each side",
 desc:"Step up onto a box driving through the whole foot, without pushing off the trailing leg. Build it up: low box → mid box → high box → holding weight → pausing 2 seconds at the top.",
 targets:"Single leg strength in the pattern used for every staircase"},
{id:"knee-stab-lateral-step-down", region:"knee", type:"stability", level:2,
 name:"Lateral Step Down", rx:"3 x 10 each side",
 desc:"Stand sideways on a box and lower the outside foot toward the floor over 3 seconds, keeping the knee tracking over the middle toes. Build it up: low box → higher box → touch and hold at the bottom.",
 targets:"Controlling the knee sideways under load, where knees usually collapse inward"},
{id:"knee-stab-decline-squat", region:"knee", type:"stability", level:3,
 name:"Decline Squat", rx:"3 x 15, 3s lower",
 desc:"Stand on a slope with the heels higher than the toes and squat on one leg, lowering over 3 seconds. Build it up: both legs → single leg → add weight. The slope loads the kneecap tendon much harder than flat ground.",
 targets:"Heavy loading of the kneecap tendon — the mainstay for stubborn jumper's knee"},
{id:"knee-stab-single-leg-wall-sit", region:"knee", type:"stability", level:3,
 name:"Single Leg Wall Sit", rx:"3 x 20-30s each side",
 desc:"Wall sit with one foot off the floor. Build it up: shallow angle → deeper → longer holds.",
 targets:"Single leg quadriceps endurance under a genuinely hard load"},
{id:"knee-stab-hamstring-bridge", region:"knee", type:"stability", level:1,
 name:"Hamstring Bridge", rx:"3 x 12",
 desc:"Lying on your back with heels on a chair or bench and legs fairly straight, lift the hips by driving through the heels. Build it up: two legs → 3 second holds → one leg.",
 targets:"Hamstring strength, which protects the knee and is usually far weaker than the quadriceps"},
{id:"knee-stab-slider-curl", region:"knee", type:"stability", level:2,
 name:"Slider Hamstring Curl", rx:"3 x 10",
 desc:"Lying on your back in a bridge with heels on sliders or a towel on a smooth floor, slide the heels away until the legs are nearly straight, then pull them back in without letting the hips drop. Build it up: two legs → one leg → slower.",
 targets:"Hamstring strength while lengthening — the mechanism that fails in a hamstring tear"},
{id:"knee-stab-nordic-curl", region:"knee", type:"stability", level:3,
 name:"Nordic Hamstring Curl", rx:"3 x 5",
 desc:"Kneel with the ankles anchored and lower the body forward as slowly as possible, catching yourself with your hands. Build it up: band assistance → hands on a raised surface → hands on the floor → lowering more slowly.",
 targets:"The strongest evidence-backed hamstring injury prevention exercise there is"},
{id:"knee-stab-reverse-nordic", region:"knee", type:"stability", level:3,
 name:"Reverse Nordic", rx:"3 x 6",
 desc:"Kneel upright with the tailbone tucked and lean backward as far as you can control, then return. Build it up: small lean → deeper → hands reaching overhead.",
 targets:"Quadriceps strength at long length — hard, and protective of the front of the thigh"},
{id:"knee-stab-hop-and-stick", region:"knee", type:"stability", level:3,
 name:"Hop and Stick", rx:"4 x 5 each side",
 desc:"Hop forward on one leg and land softly, holding the landing for 3 seconds with the knee bent and tracking straight. Build it up: forward → sideways → diagonally → hopping with eyes closed.",
 targets:"Landing control on one leg — the gate to return to running and sport"},
{id:"knee-stab-landing-mechanics", region:"knee", type:"stability", level:3,
 name:"Landing Mechanics", rx:"4 x 6",
 desc:"Step off a low box and land on both feet as quietly as you can, absorbing through the hips and knees. Build it up: low box, two feet → higher box → land on one leg → land and immediately jump again.",
 targets:"Absorbing impact properly, which is what separates a knee that tolerates sport from one that does not"},

/* ---------- ANKLE & FOOT MOBILITY ---------- */
{id:"ankle-foot-mob-df-cars", region:"ankle-foot", type:"mobility", level:1,
 name:"Ankle CARs", rx:"3 slow circles each direction",
 desc:"With the leg supported, trace the largest slow circle you can with the foot, keeping the shin still. Build it up: seated → lying with the leg raised → standing on the other leg.",
 targets:"Full ankle range in every direction"},
{id:"ankle-foot-mob-knee-to-wall", region:"ankle-foot", type:"mobility", level:1,
 name:"Knee-to-Wall Dorsiflexion", rx:"3 x 10 each side",
 desc:"Stand facing a wall, foot pointing straight ahead, and drive the knee forward to touch the wall without the heel lifting. Build it up: move the foot back a little further each time and mark the distance to track progress.",
 targets:"Ankle bending range — the single most useful ankle measurement, and easy to re-test"},
{id:"ankle-foot-mob-banded-distraction", region:"ankle-foot", type:"mobility", level:2,
 name:"Banded Ankle Distraction", rx:"2 x 15 each side",
 desc:"Loop a strong band around the front of the ankle just above the joint, anchored behind you, and step forward to create tension. Then drive the knee forward over the toes. The band pulls the ankle bone back as you bend.",
 targets:"Ankle bending when the restriction is in the joint rather than the calf"},
{id:"ankle-foot-mob-subtalar-arom", region:"ankle-foot", type:"mobility", level:1,
 name:"Subtalar Inversion and Eversion", rx:"2 x 15 each side",
 desc:"Sitting with the leg supported, tip the sole of the foot inward then outward, keeping the toes and shin still. The movement is at the heel, not the forefoot — it is smaller than you expect.",
 targets:"The joint just below the ankle, which handles side-to-side foot movement on uneven ground"},
{id:"ankle-foot-mob-calcaneal-mob", region:"ankle-foot", type:"mobility", level:2,
 name:"Heel Bone Mobilization", rx:"2 x 60s each side",
 desc:"Sitting with the ankle across the opposite knee, hold the shin firmly with one hand and cup the heel bone with the other. Tip and rock the heel bone gently side to side, then draw it away from the ankle. Slow and low force.",
 targets:"Heel bone glide — stiff after ankle sprains, immobilisation, or long-standing heel pain"},
{id:"ankle-foot-mob-gastroc-stretch", region:"ankle-foot", type:"mobility", level:1,
 name:"Calf Stretch, Knee Straight", rx:"3 x 45s each side",
 desc:"Hands on a wall, one leg back with the knee straight and heel down, and lean forward. Keep the back foot pointing straight ahead. Build it up: on the floor → forefoot on a step with the heel dropping below.",
 targets:"Gastrocnemius — the upper calf, which crosses the knee and so needs the knee straight"},
{id:"ankle-foot-mob-soleus-stretch", region:"ankle-foot", type:"mobility", level:1,
 name:"Calf Stretch, Knee Bent", rx:"3 x 45s each side",
 desc:"Same position but bend the back knee while keeping the heel down. The stretch drops lower, closer to the ankle. Build it up: on the floor → on a step → in a half-kneeling position.",
 targets:"Soleus — the deeper calf, which limits ankle bending more than the upper calf does"},
{id:"ankle-foot-mob-plantar-fascia-stretch", region:"ankle-foot", type:"mobility", level:1,
 name:"Plantar Fascia Stretch", rx:"3 x 30s each side, 3x daily",
 desc:"Sitting with the ankle across the opposite knee, pull the toes back toward the shin with one hand until you feel a stretch along the sole. Build it up: gentle → firmer → do it before the first steps in the morning.",
 targets:"The tissue along the sole of the foot — most effective done before getting out of bed"},
{id:"ankle-foot-mob-plantar-ball-roll", region:"ankle-foot", type:"mobility", level:1,
 name:"Plantar Ball Roll", rx:"60-90s each side",
 desc:"Roll the sole of the foot over a ball, pausing on tender spots. Build it up: seated with light pressure → standing with more weight → use a frozen bottle if the foot is irritable.",
 targets:"The sole of the foot, and a good self-management tool between appointments"},
{id:"ankle-foot-mob-toe-arom", region:"ankle-foot", type:"mobility", level:1,
 name:"Toe Flexion and Extension", rx:"2 x 15",
 desc:"Curl the toes fully under, then spread and lift them as far as they will go. Build it up: all toes together → try to move the big toe independently → use your hands to assist the end range.",
 targets:"Toe range, which quietly disappears in anyone who wears stiff shoes"},
{id:"ankle-foot-mob-big-toe-extension", region:"ankle-foot", type:"mobility", level:1,
 name:"Big Toe Extension Mobilization", rx:"2 x 60s each side",
 desc:"Hold the foot in one hand and use the other to draw the big toe back toward the shin, holding at the end. Build it up: gentle hold → add small circles → kneel with the toes tucked under and sit back gently.",
 targets:"Big toe extension — needed for the push-off phase of every step, and often the hidden cause of foot and knee complaints"},
{id:"ankle-foot-mob-ankle-alphabet", region:"ankle-foot", type:"mobility", level:1,
 name:"Ankle Alphabet", rx:"1 full alphabet each side",
 desc:"With the leg supported, write the alphabet in the air with your big toe. Build it up: lowercase → uppercase → larger letters → do it with the leg unsupported.",
 targets:"Range in every direction with a task that keeps people engaged long enough to do it"},
{id:"ankle-foot-mob-kneeling-ankle-rock", region:"ankle-foot", type:"mobility", level:2,
 name:"Kneeling Ankle Rock", rx:"2 x 12 each side",
 desc:"Half-kneel and drive the front knee forward over the toes with the heel down, rocking in and out of the position. Build it up: knee straight over the toes → knee angled across to the little toe side → knee angled to the big toe side.",
 targets:"Ankle bending under body weight, in all three directions the knee can travel"},
{id:"ankle-foot-mob-toe-splay", region:"ankle-foot", type:"mobility", level:1,
 name:"Toe Splay", rx:"2 x 15",
 desc:"Spread the toes apart from each other without curling or lifting them, then relax. Build it up: use your fingers between the toes to assist → unassisted → hold the spread for 5 seconds.",
 targets:"Toe spread, which widens the base of support and is almost always lost in narrow shoes"},

/* ---------- ANKLE & FOOT STABILITY ---------- */
{id:"ankle-foot-stab-calf-raise", region:"ankle-foot", type:"stability", level:1,
 name:"Calf Raise", rx:"3 x 15",
 desc:"Rise onto the balls of the feet and lower slowly. Build it up: two legs holding support → two legs hands free → one leg → one leg off a step for full range → add weight.",
 targets:"Calf strength — the workhorse, and the exercise most people under-dose by a wide margin"},
{id:"ankle-foot-stab-seated-calf-raise", region:"ankle-foot", type:"stability", level:1,
 name:"Seated Calf Raise", rx:"3 x 20",
 desc:"Sitting with the knees bent to 90 degrees and weight resting on the thighs, rise onto the balls of the feet. Bending the knee shifts the work to the deeper calf muscle.",
 targets:"Soleus, the deep calf — the main workhorse for walking and standing, and rarely trained directly"},
{id:"ankle-foot-stab-eccentric-heel-drop", region:"ankle-foot", type:"stability", level:2,
 name:"Eccentric Heel Drop", rx:"3 x 15, 3s lower",
 desc:"Stand with the forefeet on a step. Rise up with both legs, shift onto one, then lower that heel below the step over 3 seconds. Do both a knee-straight and a knee-bent version. Build it up: bodyweight → add a loaded backpack.",
 targets:"Loading an irritable Achilles tendon — the lowering is the whole exercise"},
{id:"ankle-foot-stab-calf-iso", region:"ankle-foot", type:"stability", level:1,
 name:"Isometric Calf Hold", rx:"5 x 45s",
 desc:"Rise onto the balls of the feet and simply hold. Build it up: two legs → one leg → holding a weight. Long holds with long rests.",
 targets:"Loading a painful Achilles without movement, often settling symptoms for hours after"},
{id:"ankle-foot-stab-band-eversion", region:"ankle-foot", type:"stability", level:1,
 name:"Band Eversion", rx:"3 x 20 each side",
 desc:"Band around the foot anchored to the inside, turn the sole outward against it and return slowly. Keep the knee and shin still so only the ankle works.",
 targets:"The outer ankle muscles — the primary defence against rolling the ankle, and the priority after any sprain"},
{id:"ankle-foot-stab-band-inversion", region:"ankle-foot", type:"stability", level:1,
 name:"Band Inversion", rx:"3 x 20 each side",
 desc:"Band anchored to the outside, turn the sole inward against it and return slowly.",
 targets:"The inner ankle muscles, which support the arch"},
{id:"ankle-foot-stab-band-dorsiflexion", region:"ankle-foot", type:"stability", level:1,
 name:"Band Dorsiflexion", rx:"3 x 20 each side",
 desc:"Band looped around the top of the foot and anchored in front, pull the foot up toward the shin against it and lower slowly.",
 targets:"The front-of-shin muscles — relevant in shin splints and in anyone who catches their toes"},
{id:"ankle-foot-stab-band-plantarflexion", region:"ankle-foot", type:"stability", level:1,
 name:"Band Plantarflexion", rx:"3 x 20 each side",
 desc:"Band around the ball of the foot held in both hands, push the foot down against it and return slowly.",
 targets:"Calf strength without weight-bearing — an early-stage option"},
{id:"ankle-foot-stab-short-foot", region:"ankle-foot", type:"stability", level:1,
 name:"Short Foot", rx:"3 x 10, 5s holds",
 desc:"Sitting with the foot flat, draw the ball of the foot toward the heel to raise the arch, without curling the toes or lifting them. It is a small movement and takes practice. Build it up: seated → standing → single leg standing.",
 targets:"The small muscles inside the foot that hold the arch up"},
{id:"ankle-foot-stab-toe-yoga", region:"ankle-foot", type:"stability", level:2,
 name:"Toe Yoga", rx:"3 x 10 each way",
 desc:"With the foot flat, lift only the big toe and keep the others down. Then reverse — big toe down, other four up. Most people cannot do this at first; it comes with practice.",
 targets:"Independent toe control, which underpins push-off and balance"},
{id:"ankle-foot-stab-towel-scrunch", region:"ankle-foot", type:"stability", level:1,
 name:"Towel Scrunch", rx:"3 x 30s each side",
 desc:"Place a towel on the floor and drag it toward you using only the toes. Build it up: towel alone → put a weight on the far end of the towel.",
 targets:"Toe flexor strength, easy to do while sitting at a desk"},
{id:"ankle-foot-stab-foot-tripod-balance", region:"ankle-foot", type:"stability", level:1,
 name:"Foot Tripod Balance", rx:"3 x 30s each side",
 desc:"Stand on one leg with weight spread evenly between the heel, the base of the big toe and the base of the little toe, arch lifted. Build it up: eyes open → eyes closed → on a cushion → with head turns.",
 targets:"Balance with attention on what the foot is doing, rather than just staying upright"},
{id:"ankle-foot-stab-heel-toe-walk", region:"ankle-foot", type:"stability", level:1,
 name:"Heel Walk and Toe Walk", rx:"3 x 20m each",
 desc:"Walk 20 metres on the heels only, then 20 metres on the toes only. Build it up: shorter distances → longer → carrying weight.",
 targets:"Front and back of the lower leg together, and a quick screen for weakness in either"},
{id:"ankle-foot-stab-lateral-hop-stick", region:"ankle-foot", type:"stability", level:3,
 name:"Lateral Hop and Stick", rx:"4 x 5 each direction",
 desc:"Hop sideways onto one leg and hold the landing for 3 seconds without the ankle wobbling. Build it up: small hop → larger → onto a cushion → with eyes closed.",
 targets:"Sideways ankle control on landing — the exact moment ankles get sprained"},
{id:"ankle-foot-stab-pogo-hops", region:"ankle-foot", type:"stability", level:3,
 name:"Pogo Hops", rx:"4 x 20",
 desc:"Small fast hops on the balls of the feet with stiff ankles and minimal knee bend, spending as little time on the ground as possible. Build it up: two legs in place → travelling → one leg.",
 targets:"Ankle stiffness and spring — what makes running efficient, and the last thing to return after injury"},
{id:"ankle-foot-stab-single-leg-calf-raise-step", region:"ankle-foot", type:"stability", level:2,
 name:"Single Leg Calf Raise off a Step", rx:"3 x 12 each side",
 desc:"Forefoot on a step, lower the heel below the step then rise as high as possible. Full range each rep. Build it up: bodyweight → holding a weight → 3 second lowering.",
 targets:"Calf strength through the full range — the standard to return to running is around 25 clean repetitions"},

/* ---------- HEAD & JAW MOBILITY ---------- */
{id:"head-jaw-mob-tongue-up-opening", region:"head-jaw", type:"mobility", level:1,
 name:"Tongue-Up Jaw Opening", rx:"2 x 10, slow",
 desc:"Rest the tip of your tongue on the roof of your mouth just behind your top teeth, and keep it there while you open and close. You will only open about halfway — that is the point. Build it up: 5 slow reps → 10 → hold open 3 seconds at the end.",
 targets:"The hinge part of jaw opening only, keeping the joint from sliding forward too early"},
{id:"head-jaw-mob-controlled-opening", region:"head-jaw", type:"mobility", level:1,
 name:"Controlled Opening in a Mirror", rx:"2 x 10",
 desc:"Face a mirror and open and close slowly, watching the midline of your chin. It should track straight down. Build it up: watch only → place a fingertip lightly on each joint and feel them move together → close your eyes and check yourself afterward.",
 targets:"Even, straight jaw movement — a jaw that swings to one side is the first thing to correct"},
{id:"head-jaw-mob-lateral-glide", region:"head-jaw", type:"mobility", level:1,
 name:"Lateral Jaw Glide", rx:"2 x 8 each side",
 desc:"With teeth slightly apart, slide the lower jaw sideways, keeping it level. Return to the middle before going the other way. Build it up: small range → full comfortable range → hold 3 seconds at the end.",
 targets:"Side-to-side jaw movement, usually restricted on one side"},
{id:"head-jaw-mob-protrusion-retrusion", region:"head-jaw", type:"mobility", level:1,
 name:"Jaw Protrusion and Retrusion", rx:"2 x 10",
 desc:"With teeth slightly apart, slide the lower jaw forward so the bottom teeth move ahead of the top, then draw it back. Build it up: small range → full range → pause 3 seconds forward and back.",
 targets:"The sliding component of jaw movement, separate from opening"},
{id:"head-jaw-mob-masseter-release", region:"head-jaw", type:"mobility", level:1,
 name:"Masseter Self-Release", rx:"60-90s each side",
 desc:"Find the thick muscle at the angle of the jaw — clench once to locate it, then relax. Press gently with two fingers and hold on the tender spots while breathing. Build it up: still pressure → small circles → hold while slowly opening the jaw.",
 targets:"The main clenching muscle, and the most reliably tender one"},
{id:"head-jaw-mob-temporalis-release", region:"head-jaw", type:"mobility", level:1,
 name:"Temporalis Self-Release", rx:"60-90s each side",
 desc:"Place your fingers flat on your temple above and in front of the ear. Clench to feel it engage, then relax and press gently, working in small circles from front to back. Build it up: fingers → knuckles → hold while slowly opening.",
 targets:"The fan-shaped muscle over the temple — a frequent headache source"},
{id:"head-jaw-mob-passive-opening", region:"head-jaw", type:"mobility", level:2,
 name:"Passive Opening Stretch", rx:"3 x 30s",
 desc:"Stack clean fingers between your front teeth to hold a comfortable open position, and let the jaw relax into it. Build it up: one finger → two → three, adding width only when the current one is comfortable. Stop well short of pain.",
 targets:"Opening range. Three fingers stacked is roughly normal — use it to track progress"},
{id:"head-jaw-mob-suprahyoid-stretch", region:"head-jaw", type:"mobility", level:1,
 name:"Under-Chin Stretch", rx:"3 x 20s",
 desc:"Tuck the chin gently, then tip the head back a little while keeping the tuck, so you feel a stretch under the chin and down the front of the throat. Build it up: small range → add a swallow at the end → hold longer.",
 targets:"The muscles under the chin, which shorten with a forward head position"},
{id:"head-jaw-mob-neck-jaw-sequence", region:"head-jaw", type:"mobility", level:1,
 name:"Neck and Jaw Sequencing", rx:"2 x 8",
 desc:"Set a gentle chin tuck first, hold it, then open and close the jaw without losing the tuck. Build it up: sitting → standing → against a wall.",
 targets:"Separating jaw movement from neck movement — they usually get done together"},
{id:"head-jaw-mob-tongue-posture", region:"head-jaw", type:"mobility", level:1,
 name:"Resting Tongue Position", rx:"5 minutes, several times daily",
 desc:"Rest the whole tongue lightly against the roof of your mouth, teeth slightly apart, lips closed, breathing through your nose. This is where the jaw should sit at rest. Build it up: 1 minute → 5 minutes → notice it through the day.",
 targets:"The resting position of the jaw. Teeth touching all day is clenching, whether or not you notice it"},
{id:"head-jaw-mob-occipitofrontalis-release", region:"head-jaw", type:"mobility", level:1,
 name:"Scalp and Forehead Release", rx:"60s",
 desc:"Place your fingertips on your forehead and on the back of the skull and move the scalp gently over the bone in small circles. It should slide, not just rub the skin.",
 targets:"The sheet of muscle over the scalp, involved in tension headache"},
{id:"head-jaw-mob-jaw-cars", region:"head-jaw", type:"mobility", level:2,
 name:"Jaw CARs", rx:"2 slow circles each direction",
 desc:"With teeth slightly apart, trace the largest slow circle you can with the lower jaw — forward, to one side, back, to the other. Keep it smooth and keep the head still. Build it up: small circle → full range → 20 seconds per circle.",
 targets:"Full jaw range in every direction, and a good weekly self-check"},

/* ---------- HEAD & JAW STABILITY ---------- */
{id:"head-jaw-stab-iso-opening", region:"head-jaw", type:"stability", level:1,
 name:"Isometric Opening", rx:"5 x 6s, 30-50% effort",
 desc:"Place a fist or thumb under the chin and press the jaw down into it while resisting. Nothing moves. Build it up: 6 seconds → 10 seconds. Never go to full effort.",
 targets:"The opening muscles, without moving an irritable joint"},
{id:"head-jaw-stab-iso-closing", region:"head-jaw", type:"stability", level:1,
 name:"Isometric Closing", rx:"5 x 6s, 30-50% effort",
 desc:"With the jaw slightly open, place two fingers between your teeth and gently try to close against them. Nothing moves. Very light effort — this is the direction that is already overworked.",
 targets:"The closing muscles. Low effort deliberately, since clenching is usually the problem"},
{id:"head-jaw-stab-iso-lateral", region:"head-jaw", type:"stability", level:1,

/* A structure-to-exercise map: look up a muscle, joint, ligament or nerve and
   get the drills from the library that load, lengthen or mobilise it.

   This array is the canonical copy — a separate 3D viewer project consumes the
   same dataset and treats this as its source. It is therefore deliberately
   self-contained: plain data, with no reference to anything that renders it,
   so it can be lifted out whole.

     region  one of the nine MVMT regions, NOT the anatomical one, so a
             structure's drills and the region filter agree. Psoas is filed
             under lumbar rather than hip because it attaches to every lumbar
             vertebra; the nerves are filed where you would look for them
             rather than where they end.
     system  muscular | skeletal | articular | nervous | fascial
     layer   1 superficial, 2 deep, 3 skeletal. Stored, never surfaced — it
             exists for the 3D viewer, not for this interface.
     ex      exercise NAMES, not ids. The names are stable and readable where
             the slugs are not. resolveAnatomy() turns them into ids at load
             and fails loudly if one does not match — see the note there.

   Two optional fields, both resolved in resolveAnatomy() and both there for
   material still to be written rather than for anything shipped today:

     inherits      a parent structure id. The child shows the parent's drills
                   followed by its own, deduplicated. Splitting a group into
                   its parts (hamstrings into three, erector spinae into nine)
                   otherwise means restating the same shared drill list on
                   every part and verifying it every time.
     noExercises   the reason a structure legitimately has no drills, in
                   patient-safe prose. Landmarks, most bones and several nerves
                   are not things a home exercise loads. An empty ex list is
                   only legal WITH this field — without it, an empty list is
                   indistinguishable from every name having failed to resolve,
                   which is exactly the silent failure the index refuses to
                   have. Missing it is reported like any other resolution
                   error.

   action is plain enough to read aloud to a patient. clinical is not: it names
   compensation patterns and things people get wrong. They are separate fields
   so hiding one is a toggle rather than a rewrite. clinical is reference-only
   and must never reach a printed handout — #anatView carries no-print for
   exactly that reason, and nothing copies these strings into a program. */
